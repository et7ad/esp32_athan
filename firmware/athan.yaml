select:
  - platform: template
    name: "Location"
    id: web_location_select
    icon: "mdi:map-marker"
    # The mosques come from docs/athantimes/mosques.json at runtime, shown by name (athan_core.location_choices(),
    # set by sync_web_state), so a mosque added there shows up without a firmware update. This option, the default
    # key, only holds the place until then. The device stores the mosque's KEY, never its name.
    options: ["davis"]
    set_action:
      - lambda: |-
          auto i = id(web_location_select).index_of(x.c_str(), x.size());
          const std::string key = i.has_value() ? id(athan_core).location_key((int) i.value()) : "";
          if (key.empty()) return;
          id(selected_location_key) = key;
          id(athan_core).set_location(key);
          id(web_location_select).publish_state(i.value());
    web_server:
      sorting_group_id: grp_location
      sorting_weight: 1
  - platform: template
    name: "Radio Station"
    id: web_radio_slot
    icon: "mdi:radio"
    options: ["Radio 1", "Radio 2", "Radio 3", "Radio 4", "Radio 5", "Radio 6", "Radio 7", "Radio 8", "Radio 9", "Radio 10"]
    set_action:
      - lambda: |-
          auto idx = id(web_radio_slot).index_of(x.c_str(), x.size());   // the label's position = the slot
          if (!idx.has_value()) {
            // A page opened before the names loaded still sends the old label: "Radio N…" names the slot too.
            int n = 0;
            if (sscanf(std::string(x.c_str(), x.size()).c_str(), "Radio %d", &n) == 1 && n >= 1 && n <= 10)
              idx = (size_t) (n - 1);
          }
          if (!idx.has_value()) return;
          id(radio_slot) = (int) idx.value();
          id(web_radio_slot).publish_state(idx.value());
          if (id(athan_core).radio_active() >= 0) id(radio_start).execute();   // switch station if playing
    web_server:
      sorting_group_id: grp_radio
      sorting_weight: 1
  - platform: template
    name: "Screen at Night"
    id: web_screen_night
    icon: "mdi:weather-night"
    # Normal: the night changes nothing, the screen is as by day (Brightness). Dim: ${screen_dim_pct} % from Night From
    # to Night Until. Turned off: dark then; a key press lights it dim for ${screen_wake_s} s (that press does nothing
    # else), the athan and the Pre-Fajr Tawashih while they play. Saved as screen_night 0, 1, 2 (day_window.h:
    # NIGHT_NORMAL, NIGHT_DIM, NIGHT_OFF).
    options: ["Normal (same as day)", "Dim", "Turned off"]
    set_action:
      - lambda: |-
          auto idx = id(web_screen_night).index_of(x.c_str(), x.size());
          if (!idx.has_value()) return;
          id(screen_night) = (int) idx.value();
          id(web_screen_night).publish_state(idx.value());
          id(screen_refresh).execute();
    web_server: {sorting_group_id: grp_screen, sorting_weight: 2}
  # The hourly tick's and the screen's night windows, [start, end): each end an hour, or a prayer that moves with the
  # times every day. The tick's day window starts at dawn (Fajr, Dhuhr) and ends at dusk (Maghrib, Isha); the night
  # the other way round. The options' order is the menu's (components/athan/day_window.h: window_value /
  # window_choice).
  - platform: template
    name: "Tick Window Start"
    id: web_htick_start
    icon: "mdi:clock-start"
    options: &dawn_ends ["Fajr", "Dhuhr", "00:00", "01:00", "02:00", "03:00", "04:00", "05:00", "06:00", "07:00", "08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00", "21:00", "22:00", "23:00"]
    set_action:
      - lambda: |-
          auto idx = id(web_htick_start).index_of(x.c_str(), x.size());
          if (!idx.has_value()) return;
          id(htick_start_hour) = athan::window_value(athan::WindowKind::TICK, false, (int) idx.value());
          id(web_htick_start).publish_state(idx.value());
    web_server: {sorting_group_id: grp_athan, sorting_weight: 8}
  - platform: template
    name: "Tick Window End"
    id: web_htick_end
    icon: "mdi:clock-end"
    options: &dusk_ends ["Maghrib", "Isha", "00:00", "01:00", "02:00", "03:00", "04:00", "05:00", "06:00", "07:00", "08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00", "21:00", "22:00", "23:00"]
    set_action:
      - lambda: |-
          auto idx = id(web_htick_end).index_of(x.c_str(), x.size());
          if (!idx.has_value()) return;
          id(htick_end_hour) = athan::window_value(athan::WindowKind::TICK, true, (int) idx.value());
          id(web_htick_end).publish_state(idx.value());
    web_server: {sorting_group_id: grp_athan, sorting_weight: 9}
  - platform: template
    name: "Night From"
    id: web_night_from
    icon: "mdi:weather-night"
    options: *dusk_ends
    set_action:
      - lambda: |-
          auto idx = id(web_night_from).index_of(x.c_str(), x.size());
          if (!idx.has_value()) return;
          id(night_from_hour) = athan::window_value(athan::WindowKind::NIGHT, false, (int) idx.value());
          id(web_night_from).publish_state(idx.value());
          id(screen_refresh).execute();
    web_server: {sorting_group_id: grp_screen, sorting_weight: 3}
  - platform: template
    name: "Night Until"
    id: web_night_until
    icon: "mdi:weather-sunset-up"
    options: *dawn_ends
    set_action:
      - lambda: |-
          auto idx = id(web_night_until).index_of(x.c_str(), x.size());
          if (!idx.has_value()) return;
          id(night_until_hour) = athan::window_value(athan::WindowKind::NIGHT, true, (int) idx.value());
          id(web_night_until).publish_state(idx.value());
          id(screen_refresh).execute();
    web_server: {sorting_group_id: grp_screen, sorting_weight: 4}

number:
  - platform: template
