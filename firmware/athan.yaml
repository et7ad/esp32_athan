# =====================================================================================================================
# Athan clock, version 3: ESP32-S3-WROOM-1-N16R8 + MAX98357A. ESPHome 2026.9 or newer.
#
#   Build:   esphome run firmware/athan.yaml        (first flash over USB-C: it also writes partitions.csv)
#   Docs:    README.md (owners), DEVELOPER.md (internals), version3_planning.md (design), CLAUDE.md (agents)
#
# Before the first build, put the two menu tones in firmware/sounds/ (README "Building"):
#   sounds/click.mp3   (menu click,   V2 file C3)      sounds/volume.mp3  (volume tone, V2 file C2)
#
# Behaviour lives here (menus, schedule, web entities). What ESPHome lacks (replaceable sounds in flash, the
# GitHub lists, radio subscriptions, yearly prayer files, runtime time zone, the /audio page) is the custom
# component in components/athan/.
# =====================================================================================================================

substitutions:
  device_name: athan
  friendly_name: Athan
  project_version: "3.0.0"
  # This repository's docs/ folder over HTTPS (lists, stations, yearly prayer files)
  data_url: "https://raw.githubusercontent.com/et7ad/esp32_athan/main/docs"
  # Firmware updates: manifest attached to the latest GitHub Release (scripts/make_release_manifest.py)
  update_manifest: "https://github.com/et7ad/esp32_athan/releases/latest/download/manifest.json"

  # Pins: version3_planning.md section 3.3
  pin_i2s_bclk: GPIO5
  pin_i2s_lrclk: GPIO6
  pin_i2s_dout: GPIO7
  pin_amp_sd: GPIO15       # MAX98357A SD_MODE through 4.7 kOhm: high = on (left channel), low/floating = off
  pin_sda: GPIO8
  pin_scl: GPIO9
  pin_next: GPIO10
  pin_select: GPIO11
  pin_relay: GPIO12
  pin_led: GPIO13

  # OLED orientation / contrast
  oled_flip_x: "true"
  oled_flip_y: "true"
  oled_contrast: "1.0"

  # Volume curve: 10 % plays this many dB below full, rising evenly to 100 % = full (0 % = silent).
  # Larger = quieter low end. ESPHome's own curve spans 49 dB, which made 50 % only -24.5 dB.
  volume_range_db: "30"

  # Pre-Fajr Tawashih: minutes before Fajr, and how long the relay stays on
  prefajr_offset_min: "25"
  prefajr_relay_min: "15"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: et7ad.esp32_athan
    version: ${project_version}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // First boot: Fajr volume starts equal to the main volume.
          if (id(fajr_volume_level) < 0) id(fajr_volume_level) = id(volume_level);
          id(athan_core).set_location(id(selected_location_key));
          // Previews set their own volume before they start: Fajr volume for the Fajr and Tawashih lists.
          id(athan_core).set_preview_volume_callback([](int list) {
            if (list == 1 || list == 2) id(apply_fajr_volume).execute();
            else id(apply_volume).execute();
          });
      # Wi-Fi reset: power up holding BOTH buttons. Overwrites the saved network, so setup mode starts
      # (Bluetooth, then the hotspot).
      - if:
          condition:
            and:
              - binary_sensor.is_on: ui_next
              - binary_sensor.is_on: ui_select
          then:
            - logger.log: "Both buttons held at power-up: forgetting Wi-Fi"
            - lambda: |-
                wifi::global_wifi_component->clear_sta();
                wifi::global_wifi_component->save_wifi_sta("doesntexist", "passwordfornonetwork");
            - repeat:
                count: 3
                then:
                  - output.turn_on: led_output
                  - delay: 300ms
                  - output.turn_off: led_output
                  - delay: 300ms
            - button.press: web_restart
      # Button unlock: power up holding exactly ONE button.
      - if:
          condition:
            lambda: 'return id(buttons_locked) && (id(ui_next).state != id(ui_select).state);'
          then:
            - lambda: |-
                id(buttons_locked) = false;
                ESP_LOGI("ui", "Buttons unlocked (one button held at power-up)");
            - repeat:
                count: 3
                then:
                  - output.turn_on: led_output
                  - delay: 150ms
                  - output.turn_off: led_output
                  - delay: 150ms
      - script.execute: apply_volume
      - script.execute: update_display

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  partitions: partitions.csv
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  # UART0 = TXD0/RXD0 on the J6 programming header. The board's 6-pin USB-C carries power only, so ESPHome's S3
  # default (native USB) would print nowhere. On a DevKitC prototype these logs come out of its "UART" port.
  hardware_uart: UART0

# Home Assistant native API (optional; the web page works without it)
api:
  reboot_timeout: 0s
  encryption:
    key: "/A5YakHWYfXLiBWI5Z92v0FWiaMsWbCUCWD41zlLPYk="

web_server:
  version: 3
  log: false
  # Makes the "Change Sounds At" value a clickable link (ESPHome shows values as plain text). This page only.
  js_include: web_audio_link.js
  sorting_groups:
    - id: grp_now
      name: "Now"
      sorting_weight: 10
    - id: grp_athan
      name: "Athan"
      sorting_weight: 20
    - id: grp_prayers
      name: "Athan On/Off per Prayer"
      sorting_weight: 30
    - id: grp_sounds
      name: "Sounds (change them at /audio)"
      sorting_weight: 35
    - id: grp_radio
      name: "Radio"
      sorting_weight: 40
    - id: grp_stations
      name: "Radio Stations"
      sorting_weight: 45
    - id: grp_location
      name: "Location and Prayer Times"
      sorting_weight: 50
    - id: grp_system
      name: "System"
      sorting_weight: 60

ota:
  - platform: esphome
    encryption:
      key: "/A5YakHWYfXLiBWI5Z92v0FWiaMsWbCUCWD41zlLPYk="   # same key as the api (ESPHome's recommendation)
  - platform: http_request
  # The web page's firmware upload form. Also REQUIRED for the /audio page's file upload: ESPHome only routes
  # multipart uploads to handlers when this platform is present.
  - platform: web_server

http_request:
  verify_ssl: true
  timeout: 20s

update:
  - platform: http_request
    id: fw_update
    name: "Firmware"
    source: ${update_manifest}
    update_interval: 6h
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 1

# No network is compiled in: Wi-Fi is set over Bluetooth (esp32_improv) or the fallback hotspot.
wifi:
  ap:
    ssid: "AthanFallbackHotspot"
    password: "athan404"
    ap_timeout: 3min
  on_connect:
    - logger.log: "Wi-Fi connected"
    - ble.disable:
    - script.execute: update_display
  on_disconnect:
    - ble.enable:

captive_portal:

esp32_ble:
  use_psram: true
  max_connections: 1

# Wi-Fi setup over Bluetooth (Improv). Starts when there is no working Wi-Fi; pressing Select on the device
# authorises the phone for a minute.
esp32_improv:
  id: improv_ble
  authorizer: ui_select
  authorized_duration: 1min
  wifi_timeout: 15s
  status_indicator: led_output
  on_state:
    - script.execute: update_display   # "BT: press Select" / "BT: allowed" (update_display guards is_ready())

i2c:
  sda: ${pin_sda}
  scl: ${pin_scl}
  frequency: 400kHz
  scan: true

# ---------------------------------------------------------------------------------------------------------------------
# Audio: media player -> resamplers -> mixer -> I2S -> MAX98357A
# 44.1 kHz: the stations and tones are 44.1 kHz MP3s, so the resamplers pass them through without resampling.
# Left channel only. The mono mixer keeps channel 0 of a stereo source, and channel: mono sends that sample in
# both I2S slots. The amp plays the left slot (SD_MODE through 4.7 kOhm): its (L+R)/2 mode gave artifacts in testing.
# So every sound needs its whole content in the left channel (README 1.5).
# ---------------------------------------------------------------------------------------------------------------------
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: ${pin_i2s_lrclk}
    i2s_bclk_pin: ${pin_i2s_bclk}

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: ${pin_i2s_dout}
    dac_type: external
    sample_rate: 44100
    bits_per_sample: 16bit
    channel: mono
  - platform: mixer
    id: audio_mixer
    output_speaker: i2s_speaker
    num_channels: 1
    source_speakers:
      - id: announce_mixer_input
        timeout: never
      - id: media_mixer_input
        timeout: never
  - platform: resampler
    id: announce_resampler
    output_speaker: announce_mixer_input
  - platform: resampler
    id: media_resampler
    output_speaker: media_mixer_input

media_player:
  - platform: speaker
    id: player
    name: "Speaker"
    task_stack_in_psram: true
    volume_min: 0.0
    volume_max: 1.0
    volume_initial: 0.5
    volume_increment: 0.1
    # Athan, tawashih, tick and menu tones (stored MP3s)
    announcement_pipeline:
      speaker: announce_resampler
      format: MP3
      num_channels: 1
      sample_rate: 44100
    # Radio and previews: every codec (MP3, Opus, FLAC, WAV)
    media_pipeline:
      speaker: media_resampler
      format: NONE
      num_channels: 1
      sample_rate: 44100
    files:
      - id: tone_click
        file: sounds/click.mp3
      - id: tone_volume
        file: sounds/volume.mp3
    on_play:
      - output.turn_on: amp_enable
      - script.stop: amp_idle_off
    on_announcement:
      - output.turn_on: amp_enable
      - script.stop: amp_idle_off
    on_idle:
      - script.execute: amp_idle_off

athan:
  id: athan_core
  media_player: player
  time_id: sntp_time
  data_url: ${data_url}
  # Own links of radio slots 1..10 (the text entities below), used when a slot does not follow the project list
  radio_urls: [radio_url_1, radio_url_2, radio_url_3, radio_url_4, radio_url_5,
               radio_url_6, radio_url_7, radio_url_8, radio_url_9, radio_url_10]

external_components:
  - source:
      type: local
      path: components
    components: [athan]

output:
  - platform: gpio
    id: amp_enable
    pin: ${pin_amp_sd}
  - platform: gpio
    id: led_output
    pin: ${pin_led}

# ---------------------------------------------------------------------------------------------------------------------
# Buttons. Menu state machine (ui_mode):
#   0 normal  1 main menu  2 sound list (list_slot: 0 athan, 1 fajr, 2 tawashih, 3 tick)  3 location  4 volume
#   5 fajr volume  6 athan on/off  7 info  8 tick window  9 tick start hour  10 tick end hour  11 radio
#   12 download progress
# Main menu items (index, 16 items, not persisted):
#   0 Athan 1 Fajr Athan 2 Tawashih 3 Hourly Tick 4 Tick Window 5 Athan On/Off 6 Pre-Fajr 7 Radio 8 Location
#   9 Volume 10 Fajr Volume 11 Clock 12 Update 13 Lock Buttons 14 Info 15 Cancel
# ---------------------------------------------------------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    id: ui_next
    name: "ui_next"
    internal: true
    pin:
      number: ${pin_next}
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      then:
        - lambda: |-
            id(ui_last_activity) = millis();
            const bool audio_on = id(athan_playing) || id(athan_core).slot_playing() ||
                                  id(athan_core).radio_active() >= 0 ||
                                  id(player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
            if (id(buttons_locked)) {
              id(silence_audio).execute();
              return;
            }
            if (id(ui_mode) == 0) {
              if (audio_on) {
                id(silence_audio).execute();
              } else {
                id(external_relay).toggle();   // idle: Next toggles the relay, as on V2
              }
              id(update_display).execute();
              return;
            }
            const int m = id(ui_mode);
            if (m == 1) {
              id(ui_menu_index) = (id(ui_menu_index) + 1) % 16;
              if (id(ui_menu_index) == 12) id(update_check_state) = 0;
            } else if (m == 2) {
              const int slot = id(list_slot);
              const int n = id(athan_core).catalog_size(slot) + (slot == 3 ? 1 : 0);   // tick list starts with "Off"
              if (n > 0) {
                id(list_index) = (id(list_index) + 1) % n;
                const int entry = (slot == 3) ? id(list_index) - 1 : id(list_index);
                if (entry >= 0 && !id(athan_playing)) id(athan_core).preview_catalog(slot, entry);
                else if (entry < 0) id(athan_core).stop_media();
              }
            } else if (m == 3) {
              id(location_index) = (id(location_index) + 1) % (int) id(web_location_select).size();
            } else if (m == 4) {
              id(volume_level) = (id(volume_level) <= 10) ? 100 : id(volume_level) - 10;
              id(apply_playing_volume).execute();   // a Fajr athan playing keeps the Fajr volume
              id(play_tone_volume).execute();
            } else if (m == 5) {
              id(fajr_volume_level) = (id(fajr_volume_level) <= 10) ? 100 : id(fajr_volume_level) - 10;
              id(fajr_volume_feedback).execute();
            } else if (m == 6) {
              id(mute_index) = (id(mute_index) + 1) % 6;
            } else if (m == 8) {
              id(tickwin_index) = (id(tickwin_index) + 1) % 3;
            } else if (m == 9) {
              id(htick_start_hour) = (id(htick_start_hour) + 1) % 24;
            } else if (m == 10) {
              id(htick_end_hour) = (id(htick_end_hour) + 1) % 24;
            } else if (m == 11) {
              // next radio slot that has something to play
              for (int k = 1; k <= 10; k++) {
                int c = (id(radio_cursor) + k) % 10;
                if (id(athan_core).station_available(c, id(radio_subscribed)[c])) {
                  id(radio_cursor) = c;
                  break;
                }
              }
            }
            id(update_display).execute();

  - platform: gpio
    id: ui_select
    name: "ui_select"
    internal: true
    pin:
      number: ${pin_select}
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      then:
        - lambda: |-
            id(ui_last_activity) = millis();
            const bool audio_on = id(athan_playing) || id(athan_core).slot_playing() ||
                                  id(athan_core).radio_active() >= 0 ||
                                  id(player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
            if (id(buttons_locked)) {
              id(silence_audio).execute();
              return;
            }
            if (id(ui_mode) == 0) {
              if (audio_on) {
                id(silence_audio).execute();
                return;
              }
              if (!id(sntp_time).now().is_valid() && id(improv_ble).is_active() &&
                  !wifi::global_wifi_component->is_connected()) {
                // Setup screen showing: this press only authorises the phone (esp32_improv authorizer), no menu.
                id(update_display).execute();
                return;
              }
              id(ui_mode) = 1;
              id(ui_menu_index) = 0;
              id(update_check_state) = 0;
              id(play_tone_click).execute();
              id(update_display).execute();
              return;
            }
            const int m = id(ui_mode);
            if (m == 1) {
              const int item = id(ui_menu_index);
              if (item <= 3) {
                // sound lists: 0 athan, 1 fajr, 2 tawashih, 3 tick. The list opens on the selected sound and
                // plays it (from flash, no download); the tick list opens on "Off" when the tick is off.
                id(list_slot) = item;
                id(ui_mode) = 2;
                if (!id(athan_core).catalog_ready()) id(athan_core).fetch_catalog();
                int entry = id(athan_core).selected_entry(item);
                if (item == 3 && !id(htick_enabled)) entry = -1;
                else if (entry < 0 && id(athan_core).catalog_size(item) > 0) entry = 0;   // selected one not listed
                id(list_index) = (item == 3) ? entry + 1 : std::max(0, entry);
                if (entry >= 0 && !id(athan_playing)) id(athan_core).preview_catalog(item, entry);
                else id(play_tone_click).execute();
              } else if (item == 4) {
                id(ui_mode) = 8;
                id(tickwin_index) = 0;
                id(play_tone_click).execute();
              } else if (item == 5) {
                id(ui_mode) = 6;
                id(mute_index) = 0;
                id(play_tone_click).execute();
              } else if (item == 6) {
                id(prefajr_enabled) = !id(prefajr_enabled);   // toggles in place
                ESP_LOGI("ui", "Pre-Fajr Tawashih %s", id(prefajr_enabled) ? "ON" : "OFF");
                id(play_tone_click).execute();
              } else if (item == 7) {
                id(ui_mode) = 11;
                id(radio_cursor) = id(radio_slot);
              } else if (item == 8) {
                id(ui_mode) = 3;
                id(location_index) = 0;
                for (int i = 0; i < (int) id(web_location_select).size(); i++) {
                  auto k = id(web_location_select).at(i);
                  if (k.has_value() && std::string(k.value()) == id(selected_location_key)) id(location_index) = i;
                }
                id(play_tone_click).execute();
              } else if (item == 9) {
                id(ui_mode) = 4;
                id(play_tone_volume).execute();
              } else if (item == 10) {
                id(ui_mode) = 5;
                id(fajr_volume_feedback).execute();
              } else if (item == 11) {
                id(clock_12h) = !id(clock_12h);   // toggles in place
                id(play_tone_click).execute();
              } else if (item == 12) {
                id(play_tone_click).execute();
                if (id(update_check_state) == 2) {
                  id(update_check_state) = 4;
                  id(fw_update).perform(false);
                } else if (id(update_check_state) != 3) {
                  id(check_update).execute();
                }
              } else if (item == 13) {
                id(buttons_locked) = true;
                id(ui_mode) = 0;
                id(play_tone_click).execute();
              } else if (item == 14) {
                id(ui_mode) = 7;
                id(play_tone_click).execute();
              } else {
                id(ui_mode) = 0;
                id(play_tone_click).execute();
              }
            } else if (m == 2) {
              const int slot = id(list_slot);
              const int entry = (slot == 3) ? id(list_index) - 1 : id(list_index);
              id(athan_core).stop_media();
              id(apply_playing_volume).execute();
              if (slot == 3 && entry < 0) {
                id(htick_enabled) = false;    // "Off"
                id(ui_mode) = 0;
              } else if (id(athan_core).catalog_size(slot) > 0) {
                if (slot == 3) id(htick_enabled) = true;
                id(athan_core).download_from_catalog(slot, entry);
                id(ui_mode) = 12;             // progress screen
              } else {
                id(ui_mode) = 0;
              }
              id(play_tone_click).execute();
            } else if (m == 3) {
              auto k = id(web_location_select).at(id(location_index));
              if (k.has_value()) {
                id(selected_location_key) = std::string(k.value());
                id(athan_core).set_location(id(selected_location_key));
              }
              id(ui_mode) = 0;
              id(play_tone_click).execute();
            } else if (m == 4) {
              id(ui_mode) = 0;
              id(play_tone_click).execute();
            } else if (m == 5) {
              id(apply_playing_volume).execute();
              id(ui_mode) = 0;
              id(play_tone_click).execute();
            } else if (m == 6) {
              static const int prayer_of[5] = {0, 3, 4, 5, 6};   // Fajr, Dhuhr, Asr, Maghrib, Isha
              if (id(mute_index) < 5) {
                int p = prayer_of[id(mute_index)];
                id(athan_enabled)[p] = !id(athan_enabled)[p];
              } else {
                id(ui_mode) = 0;
              }
              id(play_tone_click).execute();
            } else if (m == 7 || m == 12) {
              id(ui_mode) = 0;
              id(play_tone_click).execute();
            } else if (m == 8) {
              if (id(tickwin_index) == 0) id(ui_mode) = 9;
              else if (id(tickwin_index) == 1) id(ui_mode) = 10;
              else id(ui_mode) = 0;
              id(play_tone_click).execute();
            } else if (m == 9 || m == 10) {
              id(ui_mode) = 8;
              id(play_tone_click).execute();
            } else if (m == 11) {
              // Select plays the slot (or stops it if it is the one playing) and returns to the clock.
              const int c = id(radio_cursor);
              if (id(athan_core).radio_active() == c) {
                id(athan_core).radio_stop();
              } else {
                id(radio_slot) = c;
                id(radio_start).execute();
              }
              id(ui_mode) = 0;
            }
            id(update_display).execute();

  - platform: template
    name: "Athan Playing"
    id: web_athan_playing
    icon: "mdi:volume-high"
    lambda: return id(athan_playing);
    web_server:
      sorting_group_id: grp_now
      sorting_weight: 2

# ---------------------------------------------------------------------------------------------------------------------
# Switches. Template switches that mirror a global MUST use restore_mode: DISABLED (any other mode runs their
# actions inside setup(), before the display exists: the V6 boot loop). The lambda reports the state.
# ---------------------------------------------------------------------------------------------------------------------
switch:
  - platform: gpio
    id: external_relay
    name: "External Relay"
    pin: ${pin_relay}
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 5
  - platform: template
    name: "Fajr Athan"
    id: web_athan_fajr
    icon: "mdi:bell-ring"
    restore_mode: DISABLED
    lambda: return id(athan_enabled)[0];
    turn_on_action: [lambda: 'id(athan_enabled)[0] = true; id(update_display).execute();']
    turn_off_action: [lambda: 'id(athan_enabled)[0] = false; id(update_display).execute();']
    web_server: {sorting_group_id: grp_prayers, sorting_weight: 1}
  - platform: template
    name: "Dhuhr Athan"
    id: web_athan_dhuhr
    icon: "mdi:bell-ring"
    restore_mode: DISABLED
    lambda: return id(athan_enabled)[3];
    turn_on_action: [lambda: 'id(athan_enabled)[3] = true; id(update_display).execute();']
    turn_off_action: [lambda: 'id(athan_enabled)[3] = false; id(update_display).execute();']
    web_server: {sorting_group_id: grp_prayers, sorting_weight: 2}
  - platform: template
    name: "Asr Athan"
    id: web_athan_asr
    icon: "mdi:bell-ring"
    restore_mode: DISABLED
    lambda: return id(athan_enabled)[4];
    turn_on_action: [lambda: 'id(athan_enabled)[4] = true; id(update_display).execute();']
    turn_off_action: [lambda: 'id(athan_enabled)[4] = false; id(update_display).execute();']
    web_server: {sorting_group_id: grp_prayers, sorting_weight: 3}
  - platform: template
    name: "Maghrib Athan"
    id: web_athan_maghrib
    icon: "mdi:bell-ring"
    restore_mode: DISABLED
    lambda: return id(athan_enabled)[5];
    turn_on_action: [lambda: 'id(athan_enabled)[5] = true; id(update_display).execute();']
    turn_off_action: [lambda: 'id(athan_enabled)[5] = false; id(update_display).execute();']
    web_server: {sorting_group_id: grp_prayers, sorting_weight: 4}
  - platform: template
    name: "Isha Athan"
    id: web_athan_isha
    icon: "mdi:bell-ring"
    restore_mode: DISABLED
    lambda: return id(athan_enabled)[6];
    turn_on_action: [lambda: 'id(athan_enabled)[6] = true; id(update_display).execute();']
    turn_off_action: [lambda: 'id(athan_enabled)[6] = false; id(update_display).execute();']
