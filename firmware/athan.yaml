# =====================================================================================================================
# Athan clock, version 3: ESP32-S3-WROOM-1-N16R8 + MAX98357A. ESPHome 2026.9 or newer.
#
#   Build:   esphome run firmware/athan.yaml        (first flash over USB-C: it also writes partitions.csv)
#   Docs:    README.md (owners), DEVELOPER.md (internals), version3_planning.md (design), CLAUDE.md (agents)
#
# Before the first build, put the two menu tones in firmware/sounds/ (README "Building"):
#   sounds/click.mp3   (menu click,   V2 file C3)      sounds/volume.mp3  (volume tone, V2 file C2)
#
# Behaviour lives here (menus, schedule, web entities). What ESPHome lacks (replaceable sounds in flash, the
# GitHub lists, radio subscriptions, yearly prayer files, runtime time zone, the /audio page) is the custom
# component in components/athan/.
# =====================================================================================================================

substitutions:
  device_name: athan
  friendly_name: Athan
  project_version: "3.0.0"
  # This repository's docs/ folder over HTTPS (lists, stations, yearly prayer files)
  data_url: "https://raw.githubusercontent.com/et7ad/esp32_athan/main/docs"
  # Firmware updates: manifest attached to the latest GitHub Release (scripts/make_release_manifest.py)
  update_manifest: "https://github.com/et7ad/esp32_athan/releases/latest/download/manifest.json"

  # Serial log level. DEBUG while testing: the log is how a crash or restart gets explained. For a finished build,
  # WARN keeps only warnings and errors (smaller, a little less work per event); NONE removes the log entirely.
  # Choices: NONE, ERROR, WARN, INFO, DEBUG, VERBOSE.
  log_level: DEBUG

  # Pins: HARDWARE.md 3.2 (also version3_planning.md section 3.3)
  pin_i2s_bclk: GPIO5
  pin_i2s_lrclk: GPIO6
  pin_i2s_dout: GPIO7
  pin_amp_sd: GPIO15       # MAX98357A SD_MODE through 4.7 kOhm: high = on (left channel), low/floating = off
  pin_sda: GPIO8
  pin_scl: GPIO9
  # The 5-way switch: each direction and the centre push switch to GND (internal pull-ups). Any of the five
  # may be swapped here to suit the board's routing.
  pin_up: GPIO14
  pin_down: GPIO10
  pin_left: GPIO21
  pin_right: GPIO47
  pin_select: GPIO11       # centre push
  pin_relay: GPIO12
  pin_led: GPIO13

  # OLED orientation / contrast
  oled_flip_x: "true"
  oled_flip_y: "true"
  oled_contrast: "1.0"

  # Volume curve: 10 % plays this many dB below full, rising evenly to 100 % = full (0 % = silent).
  # Larger = quieter low end. ESPHome's own curve spans 49 dB, which made 50 % only -24.5 dB.
  volume_range_db: "30"

  # Pre-Fajr Tawashih: minutes before Fajr, and how long the relay stays on
  prefajr_offset_min: "25"
  prefajr_relay_min: "15"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: et7ad.esp32_athan
    version: ${project_version}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // First boot: Fajr volume starts equal to the main volume.
          if (id(fajr_volume_level) < 0) id(fajr_volume_level) = id(volume_level);
          id(athan_core).set_location(id(selected_location_key));
          // Previews set their own volume before they start: Fajr volume for the Fajr and Tawashih lists.
          id(athan_core).set_preview_volume_callback([](int list) {
            if (list == 1 || list == 2) id(apply_fajr_volume).execute();
            else id(apply_volume).execute();
          });
          // Stopping a preview (browsing to the next one, the /audio page's Stop) silences at once (hard_mute).
          id(athan_core).set_hard_stop_callback([]() { id(hard_mute).execute(); });
      - script.execute: menu_setup
      # Wi-Fi reset: power up holding Select (the centre push). Overwrites the saved network, so setup mode starts
      # (Bluetooth, then the hotspot).
      - if:
          condition:
            binary_sensor.is_on: ui_select
          then:
            - logger.log: "Select held at power-up: forgetting Wi-Fi"
            - lambda: |-
                wifi::global_wifi_component->clear_sta();
                wifi::global_wifi_component->save_wifi_sta("doesntexist", "passwordfornonetwork");
            - repeat:
                count: 3
                then:
                  - output.turn_on: led_output
                  - delay: 300ms
                  - output.turn_off: led_output
                  - delay: 300ms
            - button.press: web_restart
      # Button unlock: power up holding any of the four directions.
      - if:
          condition:
            lambda: 'return id(buttons_locked) && (id(ui_up).state || id(ui_down).state || id(ui_left).state || id(ui_right).state);'
          then:
            - lambda: |-
                id(buttons_locked) = false;
                ESP_LOGI("ui", "Buttons unlocked (a direction held at power-up)");
            - repeat:
                count: 3
                then:
                  - output.turn_on: led_output
                  - delay: 150ms
                  - output.turn_off: led_output
                  - delay: 150ms
      - script.execute: apply_volume
      - script.execute: update_display

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  partitions: partitions.csv
  framework:
    type: esp-idf
    sdkconfig_options:
      # TLS buffers (about 40 KB per HTTPS stream or download, more while two overlap) in PSRAM instead of the
      # scarce internal RAM, which Wi-Fi, the web server and the audio drivers need.
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      # Wi-Fi at ESP-IDF's own defaults. ESPHome's media player asks for "high performance networking" (64 receive
      # and transmit buffers kept in PSRAM, block-ack windows of 32 frames, 64 KB TCP windows), sized for lossless
      # music. A 128 kbps station needs none of it, and the router dropped the clock only while the radio played
      # (2026-10-07): with the radio, Wi-Fi's buffers then compete with the audio for PSRAM. These are the values
      # most tested with routers, in internal RAM. network: enable_high_performance: false (below) covers the TCP
      # half; ESPHome's Wi-Fi component ignores that switch, so its half is set here. Delete these six lines and that
      # switch to go back.
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "n"
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "10"
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_TX_BA_WIN: "6"
      CONFIG_ESP_WIFI_RX_BA_WIN: "6"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: ${log_level}   # set at the top (substitutions)
  # UART0 = TXD0/RXD0 on the J6 programming header. The board's 6-pin USB-C carries power only, so ESPHome's S3
  # default (native USB) would print nowhere. On a DevKitC prototype these logs come out of its "UART" port.
  hardware_uart: UART0

# Home Assistant native API (optional; the web page works without it)
api:
  reboot_timeout: 0s
  encryption:
    key: "/A5YakHWYfXLiBWI5Z92v0FWiaMsWbCUCWD41zlLPYk="

web_server:
  version: 3
  log: false
  # Makes the "Change Sounds At" value a clickable link (ESPHome shows values as plain text). This page only.
  js_include: web_audio_link.js
  sorting_groups:
    - id: grp_now
      name: "Now"
      sorting_weight: 10
    - id: grp_athan
      name: "Athan"
      sorting_weight: 20
    - id: grp_prayers
      name: "Athan On/Off per Prayer"
      sorting_weight: 30
    - id: grp_sounds
      name: "Sounds (change them at /audio)"
      sorting_weight: 35
    - id: grp_radio
      name: "Radio"
      sorting_weight: 40
    - id: grp_stations
      name: "Radio Stations"
      sorting_weight: 45
    - id: grp_location
      name: "Location and Prayer Times"
      sorting_weight: 50
    - id: grp_system
      name: "System"
      sorting_weight: 60

ota:
  - platform: esphome
    encryption:
      key: "/A5YakHWYfXLiBWI5Z92v0FWiaMsWbCUCWD41zlLPYk="   # same key as the api (ESPHome's recommendation)
  - platform: http_request
  # The web page's firmware upload form. Also REQUIRED for the /audio page's file upload: ESPHome only routes
  # multipart uploads to handlers when this platform is present.
  - platform: web_server

http_request:
  verify_ssl: true
  timeout: 20s

update:
  - platform: http_request
    id: fw_update
    name: "Firmware"
    source: ${update_manifest}
    update_interval: 6h
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 1

# No network is compiled in: Wi-Fi is set over Bluetooth (esp32_improv) or the fallback hotspot.
wifi:
  ap:
    ssid: "AthanFallbackHotspot"
    password: "athan404"
    ap_timeout: 3min
  on_connect:
    - logger.log: "Wi-Fi connected"
    - script.stop: ble_when_offline
    - ble.disable:
    - script.execute: update_display
    # No Wi-Fi modem sleep once Bluetooth is really off: streams start faster and play steadier. ESP-IDF needs
    # modem sleep while Bluetooth runs, so it comes back before ble.enable below.
    - wait_until:
        condition:
          lambda: 'return !esp32_ble::global_ble->is_active();'
        timeout: 15s
    - lambda: 'if (!esp32_ble::global_ble->is_active()) id(athan_core).set_wifi_low_latency(true);'
  # Bluetooth setup only once Wi-Fi has been gone for 15 s (ble_when_offline): routers drop a client now and then
  # and it is back within seconds, and starting Bluetooth for that costs memory and Wi-Fi airtime while it reconnects.
  on_disconnect:
    - script.execute: ble_when_offline

captive_portal:

# ESP-IDF's standard Wi-Fi and TCP settings, not ESPHome's "high performance networking" (see sdkconfig_options
# under esp32: for the Wi-Fi half, which this switch alone does not reach).
network:
  enable_high_performance: false

esp32_ble:
  use_psram: true
  max_connections: 1

# Wi-Fi setup over Bluetooth (Improv). Starts when there is no working Wi-Fi; pressing Select on the device
# authorises the phone for a minute.
esp32_improv:
  id: improv_ble
  authorizer: ui_select
  authorized_duration: 1min
  wifi_timeout: 15s
  status_indicator: led_output
  on_state:
    - script.execute: update_display   # "BT: press Select" / "BT: allowed" (update_display guards is_ready())

i2c:
  sda: ${pin_sda}
  scl: ${pin_scl}
  frequency: 400kHz
  scan: true

# ---------------------------------------------------------------------------------------------------------------------
# Audio: media player -> resamplers -> mixer -> I2S -> MAX98357A
# 44.1 kHz: the stations and tones are 44.1 kHz MP3s, so the resamplers pass them through without resampling.
# Left channel only. The mono mixer keeps channel 0 of a stereo source, and channel: mono sends that sample in
# both I2S slots. The amp plays the left slot (SD_MODE through 4.7 kOhm): its (L+R)/2 mode gave artifacts in testing.
# So every sound needs its whole content in the left channel (README 1.5).
# ---------------------------------------------------------------------------------------------------------------------
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: ${pin_i2s_lrclk}
    i2s_bclk_pin: ${pin_i2s_bclk}

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: ${pin_i2s_dout}
    dac_type: external
    sample_rate: 44100
    bits_per_sample: 16bit
    channel: mono
  # The mixer's and resamplers' task stacks (4 + 3 + 3 KB) in PSRAM, like the media player's: created at every
  # start and freed at every stop, they would otherwise come and go in internal RAM. None of them writes flash.
  - platform: mixer
    id: audio_mixer
    output_speaker: i2s_speaker
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      - id: announce_mixer_input
        timeout: never
      - id: media_mixer_input
        timeout: never
  - platform: resampler
    id: announce_resampler
    output_speaker: announce_mixer_input
    task_stack_in_psram: true
  - platform: resampler
    id: media_resampler
    output_speaker: media_mixer_input
    task_stack_in_psram: true

media_player:
  - platform: speaker
    id: player
    name: "Speaker"
    task_stack_in_psram: true
    volume_min: 0.0
    volume_max: 1.0
    volume_initial: 0.5
    volume_increment: 0.1
    # Athan, tawashih, tick and menu tones (stored MP3s)
    announcement_pipeline:
      speaker: announce_resampler
      format: MP3
      num_channels: 1
      sample_rate: 44100
    # Radio and previews: every codec (MP3, Opus, FLAC, WAV)
    media_pipeline:
      speaker: media_resampler
      format: NONE
      num_channels: 1
      sample_rate: 44100
    files:
      - id: tone_click
        file: sounds/click.mp3
      - id: tone_volume
        file: sounds/volume.mp3
    on_play:
      - output.turn_on: amp_enable
      - script.stop: amp_idle_off
    on_announcement:
      - output.turn_on: amp_enable
      - script.stop: amp_idle_off
    on_idle:
      - script.execute: amp_idle_off

athan:
  id: athan_core
  media_player: player
  # Every start waits for its pipeline's first speaker to stop, then checks the format it was given: a sound
  # started on a chain still set up for the one before plays at the wrong speed and pitch.
  media_speaker: media_resampler
  announcement_speaker: announce_resampler
  time_id: sntp_time
  data_url: ${data_url}
  # Own links of radio slots 1..10 (the text entities below), used when a slot does not follow the project list
  radio_urls: [radio_url_1, radio_url_2, radio_url_3, radio_url_4, radio_url_5,
               radio_url_6, radio_url_7, radio_url_8, radio_url_9, radio_url_10]

external_components:
  - source:
      type: local
      path: components
    components: [athan]

output:
  - platform: gpio
    id: amp_enable
    pin: ${pin_amp_sd}
  - platform: gpio
    id: led_output
    pin: ${pin_led}

# ---------------------------------------------------------------------------------------------------------------------
# The 5-way switch: Up, Down, Left, Right and Select (the centre push). Every press goes to script ui_key, the one
# place that decides what a key does:
#   Clock screen: Left/Right = volume of what plays (never stops it). Up = radio on/off (the slot chosen last).
#     Down = relay on/off. Select = menu. While the athan, the tawashih, the tick or a preview plays, Up, Down and
#     Select stop it (the radio plays on).
#   Menu: Up/Down = rows, Left/Right = the row's items, Select = take it, or done. The rows are script menu_setup;
#     navigation is components/athan/menu.h, drawing menu_view.h.
#   Buttons locked: every key only silences.
# Debounce on each key: a press is reported at once and contact bounce for 40 ms after it is ignored, so one press
# is one event (bounce read as extra presses multiplied previews and media commands).
# ---------------------------------------------------------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    id: ui_up
    name: "ui_up"
    internal: true
    pin: {number: "${pin_up}", mode: INPUT_PULLUP, inverted: true}
    filters: [settle: 40ms]
    on_press: [script.execute: {id: ui_key, button: 0}]   # athan::MenuKey::UP
  - platform: gpio
    id: ui_down
    name: "ui_down"
    internal: true
    pin: {number: "${pin_down}", mode: INPUT_PULLUP, inverted: true}
    filters: [settle: 40ms]
    on_press: [script.execute: {id: ui_key, button: 1}]   # DOWN
  - platform: gpio
    id: ui_left
    name: "ui_left"
    internal: true
    pin: {number: "${pin_left}", mode: INPUT_PULLUP, inverted: true}
    filters: [settle: 40ms]
    on_press: [script.execute: {id: ui_key, button: 2}]   # LEFT
  - platform: gpio
    id: ui_right
    name: "ui_right"
    internal: true
    pin: {number: "${pin_right}", mode: INPUT_PULLUP, inverted: true}
    filters: [settle: 40ms]
    on_press: [script.execute: {id: ui_key, button: 3}]   # RIGHT
  # Also the Bluetooth setup's authorizer (esp32_improv) and, held at power-up, the Wi-Fi reset.
  - platform: gpio
    id: ui_select
    name: "ui_select"
    internal: true
    pin: {number: "${pin_select}", mode: INPUT_PULLUP, inverted: true}
    filters: [settle: 40ms]
    on_press: [script.execute: {id: ui_key, button: 4}]   # SELECT

  - platform: template
    name: "Athan Playing"
    id: web_athan_playing
    icon: "mdi:volume-high"
    lambda: return id(athan_playing);
    web_server:
      sorting_group_id: grp_now
      sorting_weight: 2

# ---------------------------------------------------------------------------------------------------------------------
# Switches. Template switches that mirror a global MUST use restore_mode: DISABLED (any other mode runs their
# actions inside setup(), before the display exists: the V6 boot loop). The lambda reports the state.
# ---------------------------------------------------------------------------------------------------------------------
switch:
  - platform: gpio
    id: external_relay
    name: "External Relay"
    pin: ${pin_relay}
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 5
  - platform: template
    name: "Fajr Athan"
    id: web_athan_fajr
    icon: "mdi:bell-ring"
    restore_mode: DISABLED
    lambda: return id(athan_enabled)[0];
    turn_on_action: [lambda: 'id(athan_enabled)[0] = true; id(update_display).execute();']
    turn_off_action: [lambda: 'id(athan_enabled)[0] = false; id(update_display).execute();']
    web_server: {sorting_group_id: grp_prayers, sorting_weight: 1}
  - platform: template
    name: "Dhuhr Athan"
    id: web_athan_dhuhr
    icon: "mdi:bell-ring"
    restore_mode: DISABLED
    lambda: return id(athan_enabled)[3];
    turn_on_action: [lambda: 'id(athan_enabled)[3] = true; id(update_display).execute();']
    turn_off_action: [lambda: 'id(athan_enabled)[3] = false; id(update_display).execute();']
    web_server: {sorting_group_id: grp_prayers, sorting_weight: 2}
  - platform: template
    name: "Asr Athan"
    id: web_athan_asr
    icon: "mdi:bell-ring"
    restore_mode: DISABLED
    lambda: return id(athan_enabled)[4];
    turn_on_action: [lambda: 'id(athan_enabled)[4] = true; id(update_display).execute();']
    turn_off_action: [lambda: 'id(athan_enabled)[4] = false; id(update_display).execute();']
    web_server: {sorting_group_id: grp_prayers, sorting_weight: 3}
  - platform: template
    name: "Maghrib Athan"
    id: web_athan_maghrib
    icon: "mdi:bell-ring"
    restore_mode: DISABLED
    lambda: return id(athan_enabled)[5];
    turn_on_action: [lambda: 'id(athan_enabled)[5] = true; id(update_display).execute();']
    turn_off_action: [lambda: 'id(athan_enabled)[5] = false; id(update_display).execute();']
    web_server: {sorting_group_id: grp_prayers, sorting_weight: 4}
  - platform: template
    name: "Isha Athan"
    id: web_athan_isha
    icon: "mdi:bell-ring"
    restore_mode: DISABLED
    lambda: return id(athan_enabled)[6];
    turn_on_action: [lambda: 'id(athan_enabled)[6] = true; id(update_display).execute();']
    turn_off_action: [lambda: 'id(athan_enabled)[6] = false; id(update_display).execute();']
    web_server: {sorting_group_id: grp_prayers, sorting_weight: 5}
  - platform: template
    name: "Pre-Fajr Tawashih"
    id: web_prefajr
    icon: "mdi:weather-night"
    restore_mode: DISABLED
    lambda: return id(prefajr_enabled);
    turn_on_action: [lambda: 'id(prefajr_enabled) = true; id(update_display).execute();']
    turn_off_action: [lambda: 'id(prefajr_enabled) = false; id(update_display).execute();']
    web_server: {sorting_group_id: grp_athan, sorting_weight: 6}
  - platform: template
    name: "Hourly Tick"
    id: web_htick_enabled
    icon: "mdi:bell-outline"
    restore_mode: DISABLED
    lambda: return id(htick_enabled);
    turn_on_action: [lambda: 'id(htick_enabled) = true;']
    turn_off_action: [lambda: 'id(htick_enabled) = false;']
    web_server: {sorting_group_id: grp_athan, sorting_weight: 7}
  - platform: template
    name: "Buttons Locked"
    id: web_buttons_locked
    icon: "mdi:lock"
    restore_mode: DISABLED
    lambda: return id(buttons_locked);
    turn_on_action: [lambda: 'id(buttons_locked) = true; id(athan_core).menu().close(); id(update_display).execute();']
    turn_off_action: [lambda: 'id(buttons_locked) = false; id(update_display).execute();']
    web_server: {sorting_group_id: grp_now, sorting_weight: 5}
  - platform: template
    name: "12-hour Clock"
    id: web_clock_12h
    icon: "mdi:clock-time-four-outline"
    restore_mode: DISABLED
    lambda: return id(clock_12h);
    turn_on_action: [lambda: 'id(clock_12h) = true; id(update_display).execute();']
    turn_off_action: [lambda: 'id(clock_12h) = false; id(update_display).execute();']
    web_server: {sorting_group_id: grp_now, sorting_weight: 6}
  # Radio slots: ON = follow the project's station list (docs/radio/stations.json, kept in memory and
  # refreshed every 6 h); OFF = play the slot's own link below.
  - {platform: template, name: "Radio 1 follows project list", id: radio_sub_1, icon: "mdi:playlist-check", restore_mode: DISABLED, lambda: 'return id(radio_subscribed)[0];', turn_on_action: [lambda: 'id(radio_subscribed)[0] = true;'], turn_off_action: [lambda: 'id(radio_subscribed)[0] = false;'], web_server: {sorting_group_id: grp_stations, sorting_weight: 1}}
  - {platform: template, name: "Radio 2 follows project list", id: radio_sub_2, icon: "mdi:playlist-check", restore_mode: DISABLED, lambda: 'return id(radio_subscribed)[1];', turn_on_action: [lambda: 'id(radio_subscribed)[1] = true;'], turn_off_action: [lambda: 'id(radio_subscribed)[1] = false;'], web_server: {sorting_group_id: grp_stations, sorting_weight: 3}}
  - {platform: template, name: "Radio 3 follows project list", id: radio_sub_3, icon: "mdi:playlist-check", restore_mode: DISABLED, lambda: 'return id(radio_subscribed)[2];', turn_on_action: [lambda: 'id(radio_subscribed)[2] = true;'], turn_off_action: [lambda: 'id(radio_subscribed)[2] = false;'], web_server: {sorting_group_id: grp_stations, sorting_weight: 5}}
  - {platform: template, name: "Radio 4 follows project list", id: radio_sub_4, icon: "mdi:playlist-check", restore_mode: DISABLED, lambda: 'return id(radio_subscribed)[3];', turn_on_action: [lambda: 'id(radio_subscribed)[3] = true;'], turn_off_action: [lambda: 'id(radio_subscribed)[3] = false;'], web_server: {sorting_group_id: grp_stations, sorting_weight: 7}}
  - {platform: template, name: "Radio 5 follows project list", id: radio_sub_5, icon: "mdi:playlist-check", restore_mode: DISABLED, lambda: 'return id(radio_subscribed)[4];', turn_on_action: [lambda: 'id(radio_subscribed)[4] = true;'], turn_off_action: [lambda: 'id(radio_subscribed)[4] = false;'], web_server: {sorting_group_id: grp_stations, sorting_weight: 9}}
  - {platform: template, name: "Radio 6 follows project list", id: radio_sub_6, icon: "mdi:playlist-check", restore_mode: DISABLED, lambda: 'return id(radio_subscribed)[5];', turn_on_action: [lambda: 'id(radio_subscribed)[5] = true;'], turn_off_action: [lambda: 'id(radio_subscribed)[5] = false;'], web_server: {sorting_group_id: grp_stations, sorting_weight: 11}}
  - {platform: template, name: "Radio 7 follows project list", id: radio_sub_7, icon: "mdi:playlist-check", restore_mode: DISABLED, lambda: 'return id(radio_subscribed)[6];', turn_on_action: [lambda: 'id(radio_subscribed)[6] = true;'], turn_off_action: [lambda: 'id(radio_subscribed)[6] = false;'], web_server: {sorting_group_id: grp_stations, sorting_weight: 13}}
