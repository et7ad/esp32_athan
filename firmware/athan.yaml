time:
  - platform: sntp
    id: sntp_time
    # Placeholder: the mosque's own zone comes from its yearly prayer file and replaces this at runtime.
    timezone: "PST8PDT,M3.2.0,M11.1.0"
    on_time_sync:
      - script.execute: update_display
    on_time:
      # Hourly tick at HH:00 inside the window [start, end) (start == end: all day). An end may be a prayer
      # (day_window.h: Fajr or Dhuhr to Maghrib or Isha), at today's time.
      - minutes: 0
        seconds: 0
        then:
          - lambda: |-
              const int h = id(sntp_time).now().hour;
              const bool in_window = athan::in_window(id(htick_start_hour), id(htick_end_hour), h * 60,
                                                      id(prayer_hours), id(prayer_minutes));
              // Not over the athan, the Pre-Fajr Tawashih (Random streams it: then no stored sound plays), another
              // stored sound or a preview: it would set the normal volume over the Fajr one.
              if (id(htick_enabled) && in_window && !id(athan_playing) && !id(prefajr_playing) &&
                  !id(athan_core).slot_playing() && id(athan_core).preview_list() < 0)
                id(play_tick).execute();
      - seconds: 0
        then:
          - script.execute: update_display
      # Firmware: one check a day (the other is after each start: fw_check_after_start). Only a check.
      - hours: 3
        minutes: 0
        seconds: 0
        then:
          - update.check: fw_update

# ---------------------------------------------------------------------------------------------------------------------
# Globals. Persisted ones live in NVS keyed by id: adding or removing one does not disturb the others.
# ---------------------------------------------------------------------------------------------------------------------
globals:
  - {id: volume_level, type: int, initial_value: "50", restore_value: true}
  - {id: fajr_volume_level, type: int, initial_value: "-1", restore_value: true}
  - {id: athan_enabled, type: "bool[7]", initial_value: "{true, true, true, true, true, true, true}", restore_value: true}
  - {id: buttons_locked, type: bool, initial_value: "false", restore_value: true}
  - {id: clock_12h, type: bool, initial_value: "false", restore_value: true}
  - {id: htick_enabled, type: bool, initial_value: "true", restore_value: true}
  - {id: htick_start_hour, type: int, initial_value: "0", restore_value: true}
  - {id: htick_end_hour, type: int, initial_value: "0", restore_value: true}
  - {id: prefajr_enabled, type: bool, initial_value: "false", restore_value: true}
  - {id: selected_location_key, type: std::string, initial_value: '"davis"', restore_value: true, max_restore_data_length: 31}
  - {id: radio_subscribed, type: "bool[10]", initial_value: "{true, true, true, true, true, true, true, true, true, true}", restore_value: true}
  - {id: radio_slot, type: int, initial_value: "0", restore_value: true}
  # The screen (script screen_refresh): Brightness 10-100 %, Screen at Night 0 Normal / 1 Dim / 2 Turned off, night hours
  - {id: screen_brightness, type: int, initial_value: "100", restore_value: true}
  - {id: screen_night, type: int, initial_value: "0", restore_value: true}
  - {id: night_from_hour, type: int, initial_value: "22", restore_value: true}
  - {id: night_until_hour, type: int, initial_value: "6", restore_value: true}
  # not persisted
  - {id: ui_last_activity, type: uint32_t, initial_value: "0"}  # last key press (the menu closes after 60 s)
  - {id: last_tone_ms, type: uint32_t, initial_value: "0"}      # tone rate limit (play_tone_click / play_tone_volume)
  - {id: output_muted, type: bool, initial_value: "false"}      # hard_mute holds the I2S output silent
  - {id: volume_pending, type: bool, initial_value: "false"}    # a volume change waiting for hard_mute to end
  - {id: toast_kind, type: int, initial_value: "0"}             # clock pop-up: 0 none, 1 volume, 2 Fajr volume, 3 relay
  - {id: fajr_sound_on, type: bool, initial_value: "false"}     # check_fajr_sound's answer
  - {id: menu_radio_resume, type: int, initial_value: "-1"}     # radio a menu preview replaced: back when the menu closes
  - {id: menu_download_slot, type: int, initial_value: "-1"}    # sound row whose download the menu shows under the item
  - {id: radio_resume, type: int, initial_value: "-1"}
  - {id: athan_playing, type: bool, initial_value: "false"}
  - {id: current_athan_prayer_index, type: int, initial_value: "0"}
  - {id: times_loaded, type: bool, initial_value: "false"}
  - {id: schedule_seen, type: uint32_t, initial_value: "0"}
  # Today's times and the next prayer survive a power cut (a restart keeps the time; a power cut loses it until SNTP
  # answers): the screen shows them, struck through, until the clock is set again. Written when they change: the
  # times once a day, the next prayer a few times.
  - {id: prayer_hours, type: "uint8_t[7]", initial_value: "{5, 6, 7, 12, 15, 17, 18}", restore_value: true}
  - {id: prayer_minutes, type: "uint8_t[7]", initial_value: "{0, 0, 0, 0, 0, 0, 0}", restore_value: true}
  - {id: next_prayer_index, type: int, initial_value: "0", restore_value: true}
  - {id: next_prayer_hour, type: int, initial_value: "0", restore_value: true}
  - {id: next_prayer_minute, type: int, initial_value: "0", restore_value: true}
  - {id: prefajr_next_hour, type: int, initial_value: "0"}
  - {id: prefajr_next_minute, type: int, initial_value: "0"}
  # What was already called, by a day number that counts up by one a day (across New Year too): the prayer as
  # day * 8 + its index, the Pre-Fajr Tawashih as the day of its Fajr. A reload of the times in a prayer's minute (Refresh,
  # a year stored) or a restart finds that prayer again; these keep it from being called twice. Saved: a restart too.
  - {id: prayer_called, type: int, initial_value: "0", restore_value: true}
  - {id: prefajr_called, type: int, initial_value: "0", restore_value: true}
  - {id: prefajr_playing, type: bool, initial_value: "false"}   # the Pre-Fajr Tawashih sound is playing
  # The relay is on because of Pre-Fajr, its timer running (the relay itself restores its state after a restart, the
  # timer does not): on_boot switches it off.
  - {id: relay_by_prefajr, type: bool, initial_value: "false", restore_value: true}
  # The menu's Update row: 1 its check runs, 2 it got no answer (offline: ESPHome skips the check, no error). What a
  # check found, and an install, is fw_update's own state.
  - {id: update_check_state, type: int, initial_value: "0"}
  - {id: fw_checked_after_start, type: bool, initial_value: "false"}
  - {id: fw_failed_version, type: std::string}                  # the version whose install failed (ota on_error)
  - {id: screen_woken_ms, type: uint32_t, initial_value: "0"}  # last key press: a dark screen stays lit after it
  - {id: screen_pct_applied, type: int, initial_value: "-1"}  # the level the display has now (0 = dark, -1 = not set)
  - {id: screen_dark_in, type: int, initial_value: "-1"}      # seconds until a lit screen goes dark (-1: it stays)
  - {id: screen_force_dark, type: bool, initial_value: "false"}  # Brightness just set to 0 %: dark now, until a key

script:
  # ---------------- audio helpers ----------------
  - id: apply_volume
    mode: restart
    then:
      - lambda: |-
          id(volume_level) = std::max(0, std::min(100, id(volume_level)));
          // While hard_mute holds the output silent, a volume change would undo it (ESPHome's I2S speaker
          // recomputes its gain without checking mute): hard_mute applies it when it lets go.
          if (id(output_muted)) { id(volume_pending) = true; return; }
          // Owner volume (0-100 %) -> player volume. ESPHome's I2S speaker turns the player volume v into
          // -49 dB x (1 - v), so here 10 % = -${volume_range_db} dB rising evenly to 100 % = 0 dB; 0 % is silent.
          const int pct = id(volume_level);
          float db = -${volume_range_db}.0f * (100 - std::max(10, pct)) / 90.0f;
          float v = pct <= 0 ? 0.0f : std::max(0.0f, std::min(1.0f, 1.0f + db / 49.0f));
          id(player).make_call().set_volume(v).perform();
  - id: apply_fajr_volume
    mode: restart
    then:
      - lambda: |-
          if (id(output_muted)) { id(volume_pending) = true; return; }   // see apply_volume
          const int pct = id(fajr_volume_level) < 0 ? id(volume_level) : std::min(100, id(fajr_volume_level));
          float db = -${volume_range_db}.0f * (100 - std::max(10, pct)) / 90.0f;   // same curve as apply_volume
          float v = pct <= 0 ? 0.0f : std::max(0.0f, std::min(1.0f, 1.0f + db / 49.0f));
          id(player).make_call().set_volume(v).perform();
  # Whether a Fajr-volume sound plays now: the Fajr athan, the Pre-Fajr Tawashih, a Fajr or Tawashih preview.
  # The one test for "which volume" (sets fajr_sound_on at once): apply_playing_volume and the volume keys use it.
  - id: check_fajr_sound
    then:
      - lambda: |-
          const int pl = id(athan_core).preview_list();
          id(fajr_sound_on) = (id(athan_playing) && id(current_athan_prayer_index) == 0) || id(prefajr_playing) ||
                              pl == 1 || pl == 2;
  # The volume for whatever is playing now: Fajr volume for a Fajr sound (check_fajr_sound), the normal volume for
  # everything else, and when nothing plays. Every "back to normal" uses this, so stopping or leaving something
  # never drops a Fajr athan that is still playing to the normal volume.
  - id: apply_playing_volume
    mode: restart
    then:
      - lambda: |-
          id(check_fajr_sound).execute();
          if (id(fajr_sound_on)) id(apply_fajr_volume).execute();
          else id(apply_volume).execute();
  # Left/Right on the clock screen: the volume of what plays (the Fajr volume during a Fajr sound) by 10 %, shown
  # for 2 s. Never stops or pauses anything. The keys stop at 10 %: 0 % (silent) only from the menu or the web.
  - id: volume_step
    parameters:
      delta: int
    then:
      - lambda: |-
          id(check_fajr_sound).execute();
          const bool fajr = id(fajr_sound_on);
          int &level = fajr ? id(fajr_volume_level) : id(volume_level);
          const int v = level < 0 ? id(volume_level) : level;
          int nv = std::min(100, v + 10 * delta);
          if (delta < 0) nv = std::max(nv, std::min(v, 10));
          level = nv;
          id(apply_playing_volume).execute();
          id(show_toast).execute(fajr ? 2 : 1);
          // A short tone at the new level when nothing plays; over a sound, that sound is the feedback.
          if (!id(athan_playing) && !id(prefajr_playing) && !id(athan_core).slot_playing() &&
              id(athan_core).preview_list() < 0 && id(athan_core).radio_active() < 0)
            id(play_tone_volume).execute();
  # Pop-up over the clock for 2 s (toast_kind): the volume a Left/Right press set, the relay a Down press switched.
  - id: show_toast
    mode: restart
    parameters:
      kind: int
    then:
      - lambda: 'id(toast_kind) = kind; id(update_display).execute();'
      - delay: 2s
      - lambda: 'id(toast_kind) = 0; id(update_display).execute();'

  # Menu click and volume tone: at the normal volume when nothing else plays (over something, they share its volume).
  - id: play_tone_click
    mode: restart
    then:
      - if:
          condition:
            # At most one tone per 90 ms, however fast the presses or slider events come.
            lambda: 'return !id(athan_playing) && !id(athan_core).slot_playing() && millis() - id(last_tone_ms) >= 90;'
          then:
            - lambda: |-
                id(last_tone_ms) = millis();
                if (id(player).state == media_player::MEDIA_PLAYER_STATE_IDLE) id(apply_playing_volume).execute();
            - script.execute: amp_wake
            - lambda: 'id(athan_core).play_tone(id(tone_click));'   # waits for a sound before it to stop
  - id: play_tone_volume
    mode: restart
    then:
      - if:
          condition:
            # At most one tone per 90 ms, however fast the presses or slider events come.
            lambda: 'return !id(athan_playing) && !id(athan_core).slot_playing() && millis() - id(last_tone_ms) >= 90;'
          then:
            - lambda: |-
                id(last_tone_ms) = millis();
                if (id(player).state == media_player::MEDIA_PLAYER_STATE_IDLE) id(apply_playing_volume).execute();
            - script.execute: amp_wake
            - lambda: 'id(athan_core).play_tone(id(tone_volume));'
  # Fajr volume changed (menu or web slider): play the volume tone at the new Fajr level, then go back to the volume
  # of whatever is playing. While something plays (an athan, the tawashih, a stored sound, the radio, a preview), only
  # the volume of what plays is applied: the player has one volume, so the tone at the Fajr level would take the radio
  # or a normal preview to that level too.
  - id: fajr_volume_feedback
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(athan_playing) || id(prefajr_playing) || id(athan_core).slot_playing() ||
                     id(athan_core).radio_active() >= 0 || id(athan_core).preview_list() >= 0;
          then:
            - script.execute: apply_playing_volume
          else:
            - script.execute: apply_fajr_volume
            - if:
                condition:
                  lambda: 'return millis() - id(last_tone_ms) >= 90;'   # a dragged web slider sends many events
                then:
                  - lambda: 'id(last_tone_ms) = millis();'
                  - script.execute: amp_wake
                  - lambda: 'id(athan_core).play_tone(id(tone_volume));'
            - delay: 1500ms
            - script.execute: apply_playing_volume
  # Amplifier on ahead of a sound, with the idle timer running: a sound that never starts (a radio slot without a
  # link, an empty tawashih or tick slot) never changes the player's state, so on_idle would not fire and the amp
  # would stay on. on_play / on_announcement stop the timer once something really plays; on_idle restarts it.
  - id: amp_wake
    then:
      - output.turn_on: amp_enable
      - script.execute: amp_idle_off
  # Instant silence for a stop the owner asked for. Stopping a pipeline leaves up to 500 ms of audio in the I2S
  # speaker's buffer (plus the mixer's and resampler's), which used to keep playing after the press. The I2S
  # speaker applies its volume as audio leaves that buffer, so muting it here (directly, not through the media
  # player's command queue) is silent within its 50 ms of DMA, without the pop of cutting the amp mid-sound. The
  # pipelines stop behind it, and the output is unmuted once that audio has played out: the I2S speaker stopped
  # (500 ms after its last data), or every pipeline that was playing has stopped (audio_drained()). A fixed 800 ms
  # ended as much as 0.3 s before the radio's audio did, on the prototype. The amp still goes off 5 s after idle.
  - id: hard_mute
    mode: restart
    then:
      - lambda: |-
          id(output_muted) = true;
          id(i2s_speaker)->set_mute_state(true);
          id(athan_core).begin_drain_watch();
      - wait_until:
          condition:
            lambda: 'return id(i2s_speaker)->is_stopped() || id(athan_core).audio_drained();'
          timeout: 2s
      - lambda: |-
          id(output_muted) = false;
          id(i2s_speaker)->set_mute_state(false);
          if (id(volume_pending)) {
            id(volume_pending) = false;
            id(apply_playing_volume).execute();
          }
  # Wi-Fi gone for 15 s (esp32_improv's wifi_timeout): Bluetooth on for the Improv setup, modem sleep back on first
  # (ESP-IDF needs it with Bluetooth). A drop that ends sooner never starts Bluetooth (wifi on_connect stops this).
  - id: ble_when_offline
    mode: restart
    then:
      - delay: 15s
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - lambda: 'id(athan_core).set_wifi_low_latency(false);'
            - ble.enable:
  # Amplifier off a few seconds after the player goes idle (no idle hiss).
  - id: amp_idle_off
    mode: restart
    then:
      - delay: 5s
      - if:
          condition:
            lambda: 'return id(player).state == media_player::MEDIA_PLAYER_STATE_IDLE;'
          then:
            - output.turn_off: amp_enable

  # Stop everything: athan, tawashih, tick, preview, radio. Buttons, the web Stop button, the lock.
  - id: silence_audio
    mode: restart
    then:
      - script.execute: hard_mute   # silent at once; everything below stops behind it
      - script.stop: make_athan
      - script.stop: run_prefajr
      - script.stop: play_tick
      - mixer_speaker.apply_ducking:   # a tick stopped while it lowered the radio would leave the next radio low
          id: media_mixer_input
          decibel_reduction: 0
          duration: 0.3s
      - lambda: |-
          id(menu_radio_resume) = -1;
          id(athan_core).stop_media();
          // Sends a STOP only when something plays there (this runs on every press while the buttons are locked),
          // and drops a sound still waiting to start.
          id(athan_core).stop_announcements();
          id(athan_playing) = false;
          id(prefajr_playing) = false;
          id(radio_resume) = -1;
          id(led_output).turn_off();
          id(apply_playing_volume).execute();
          id(update_display).execute();

  # Stop the athan, the tawashih, the tick or a preview, and leave the radio playing: Up, Down or Select on the clock
  # while one of them plays. Silent at once when no radio plays (with the radio on, the mute would cut it too; then
  # only the tick's buffered half second plays out).
  - id: stop_sound
    then:
      - lambda: 'if (id(athan_core).radio_active() < 0) id(hard_mute).execute();'
      - script.stop: make_athan
      - script.stop: run_prefajr
      - script.stop: play_tick
      - mixer_speaker.apply_ducking:   # a tick stopped while it lowered the radio
          id: media_mixer_input
          decibel_reduction: 0
          duration: 0.3s
      - lambda: |-
          id(athan_core).stop_preview();
          id(athan_core).stop_tawashih();   // the random one (streamed)
          id(athan_core).stop_announcements();
          id(athan_playing) = false;
          id(prefajr_playing) = false;
          id(radio_resume) = -1;   // stopped on purpose: a radio the athan paused stays off
          id(led_output).turn_off();
          id(apply_playing_volume).execute();
          id(update_display).execute();

  # ---------------- keys ----------------
  # Every key of the 5-way switch (button = athan::MenuKey: 0 Up, 1 Down, 2 Left, 3 Right, 4 Select). What each
  # one does is in the binary_sensor section's header.
  - id: ui_key
    parameters:
      button: int
    then:
      - lambda: |-
          using athan::MenuKey;
          const MenuKey k = static_cast<MenuKey>(button);
          id(ui_last_activity) = millis();
          // A dark screen (Brightness 0 %, Screen at Night: Turned off): this press only lights it, dim, for
          // ${screen_wake_s} s after the last press (screen_refresh counts them down on the screen).
          const bool dark = id(screen_pct_applied) == 0;
          id(screen_woken_ms) = millis();
          if (dark) {
            id(screen_force_dark) = false;
            id(screen_refresh).execute();
            return;
          }
          if (id(buttons_locked)) {
            id(silence_audio).execute();
            return;
          }
          auto &menu = id(athan_core).menu();
          if (menu.is_open()) {
            menu.key(k);
            // A click for rows and Select; Left/Right sound through their row (preview, volume tone or nothing).
            if (k == MenuKey::UP || k == MenuKey::DOWN || k == MenuKey::SELECT) id(play_tone_click).execute();
            id(update_display).execute();
            return;
          }
          // ---- clock screen ----
          if (k == MenuKey::LEFT || k == MenuKey::RIGHT) {
            id(volume_step).execute(k == MenuKey::RIGHT ? 1 : -1);
            return;
          }
          const bool sound_on = id(athan_playing) || id(prefajr_playing) || id(athan_core).slot_playing() ||
                                id(athan_core).preview_list() >= 0;
          if (sound_on) {
            id(stop_sound).execute();   // anything but the radio
            return;
          }
          if (k == MenuKey::UP) {
            if (id(athan_core).radio_active() >= 0) id(radio_off).execute();
            else id(radio_start).execute();   // the slot chosen last (radio_slot): its number shows by the play mark
          } else if (k == MenuKey::DOWN) {
            id(external_relay).toggle();
            id(show_toast).execute(3);
          } else {
            if (!id(sntp_time).now().is_valid() && id(improv_ble).is_active() &&
                !wifi::global_wifi_component->is_connected()) {
              id(update_display).execute();   // setup screen: this press only authorises the phone (esp32_improv)
              return;
            }
            if (!id(athan_core).catalog_ready()) id(athan_core).fetch_catalog();   // for the sound rows
            if (id(update_check_state) == 2) id(update_check_state) = 0;   // an old "Check failed", not a running check
            id(play_tone_click).execute();
            menu.open();
          }
          id(update_display).execute();

  # ---------------- screen ----------------
  # The screen's level: Brightness by day (0 % = dark); from Night From to Night Until (Screen at Night) the same
  # (Normal), dim (${screen_dim_pct} %), or dark (Turned off). A screen that would be dark is lit dim for ${screen_wake_s} s after a key press
  # (ui_key: the press that lights it does nothing else), and while the athan or the Pre-Fajr Tawashih plays (the
  # ${screen_wake_s} s start when it ends); screen_dark_in counts those seconds down, and the display files show them
  # in a corner. Setting Brightness to 0 % darkens it at once (screen_force_dark) until the next key. Runs every second
  # and at once after a change; the display hears only of a new level: apply_screen, in each display file (the OLED's
  # contrast or panel off, the TFT's backlight).
  - id: screen_refresh
    then:
      - lambda: |-
          const uint32_t wake_ms = ${screen_wake_s} * 1000UL;
          const bool sound = id(athan_playing) || id(prefajr_playing);
          if (sound) {
            id(screen_woken_ms) = millis();   // the wait to dark starts when it ends
            id(screen_force_dark) = false;    // Brightness set to 0 %: the athan lights it too, as after a restart
          }
          const int bright = std::max(0, std::min(100, id(screen_brightness)));
          const int dim = bright > 0 ? std::min(bright, ${screen_dim_pct}) : ${screen_dim_pct};
          auto now = id(sntp_time).now();
          // the night's ends may be prayers (day_window.h: Maghrib or Isha to Fajr or Dhuhr), at today's times.
          // Screen at Night: Normal never looks at the window: the screen is exactly as by day (night_level()).
          const bool night = id(screen_night) != athan::NIGHT_NORMAL && now.is_valid() &&
                             athan::in_window(id(night_from_hour), id(night_until_hour), now.hour * 60 + now.minute,
                                              id(prayer_hours), id(prayer_minutes));
          int pct = night ? athan::night_level(id(screen_night), bright, dim) : bright;
          int dark_in = -1;
          if (pct == 0 && !id(screen_force_dark)) {
            const uint32_t since = millis() - id(screen_woken_ms);
            if (sound) {
              pct = dim;
            } else if (since < wake_ms) {
              pct = dim;
              dark_in = (int) ((wake_ms - since + 999) / 1000);
            }
          }
          const bool count_changed = dark_in != id(screen_dark_in);
          id(screen_dark_in) = dark_in;
          if (pct != id(screen_pct_applied)) {
            const bool was_dark = id(screen_pct_applied) == 0;
            id(screen_pct_applied) = pct;
            id(apply_screen).execute(pct);
            if (was_dark) id(update_display).execute();   // what it shows may be a minute old
          }
          if (count_changed && pct > 0) id(update_display).execute();   // the countdown's new second

  # ---------------- device menu ----------------
  # The menu's rows, top to bottom, each defined once (navigation: components/athan/menu.h, drawing: menu_view.h;
  # rows only one display has come from its display file: menu_display_rows). Kinds: CHOICE = Left/Right show the
  # choices, Select takes the one shown (on the one in use: closes the menu). VALUE = Left/Right change it at once,
  # Select closes. ACTION = Select runs the item shown. Up/Down go round the rows; the last row, Exit, returns to the
  # clock (Select, Left or Right), as does 60 s without a press.
  - id: menu_setup
    then:
      - lambda: |-
          using athan::MenuRow;
          using athan::RowKind;
          auto &menu = id(athan_core).menu();
          // "06:00", or "6 AM" with the 12-hour clock
          auto hour_text = [](int h) -> std::string {
            char b[8];
            if (id(clock_12h)) snprintf(b, sizeof(b), "%d %s", (h % 12) ? h % 12 : 12, h < 12 ? "AM" : "PM");
            else snprintf(b, sizeof(b), "%02d:00", h);
            return b;
          };
          // The tick's and the night's window ends (day_window.h): the night from Maghrib or Isha until Fajr or Dhuhr,
          // the tick's day window from Fajr or Dhuhr until Maghrib or Isha, each end also any hour. A prayer end moves
          // with the prayer times every day.
          auto end_text = [hour_text](int v) -> std::string {
            const char *pn = athan::window_prayer_name(v);
            return pn ? std::string(pn) : hour_text(v);
          };
          // The line under From / Until: the other end and today's length ("until Fajr, 10 h"); equal ends = all day.
          // The rows pass the end under the cursor, so the line shows the window Select would make.
          auto window_caption = [end_text](int from, int until, bool is_until) -> std::string {
            const int len = athan::window_length(from, until, id(prayer_hours), id(prayer_minutes));
            if (len == 1440) return "All day";
            return (is_until ? "from " + end_text(from) : "until " + end_text(until)) + ", " +
                   std::to_string((len + 30) / 60) + " h";
          };

          // Radio: the ten slots. Select plays the one shown (the check mark: what Up on the clock plays), or stops
          // it if it is the one playing, and returns to the clock.
          {
            MenuRow r;
            r.title = "Radio";
            r.symbol = athan::sym::RADIO;   // the TFT's icon (tft_theme.h); the OLED shows none for this row
            r.kind = RowKind::ACTION;
            r.count = []() { return 10; };
            r.label = [](int i) -> std::string {
              if (!id(radio_subscribed)[i]) return std::to_string(i + 1) + " own link";
              const std::string nm = id(athan_core).station_name(i);
              return nm.empty() ? "Radio " + std::to_string(i + 1) : std::to_string(i + 1) + " " + nm;
            };
            r.active = []() { return std::max(0, std::min(9, id(radio_slot))); };
            r.playing = []() { return id(athan_core).radio_active(); };
            r.caption = [](int i) -> std::string {
              return (i < 0 || id(athan_core).station_available(i, id(radio_subscribed)[i])) ? "" : "No link here";
            };
            r.apply = [](int i) {
              if (!id(athan_core).station_available(i, id(radio_subscribed)[i])) return false;
              id(menu_radio_resume) = -1;   // chosen now: nothing to bring back when the menu closes
              if (id(athan_core).radio_active() == i) {
                id(radio_off).execute();
              } else {
                id(radio_slot) = i;
                id(radio_start).execute();
              }
              return true;
            };
            menu.add_row(std::move(r));
          }

          // Sound rows: "Off" (tick only), "Random" (tawashih only, first: one list entry a day, streamed, nothing
          // stored), "Custom" (an uploaded sound), then the suggested list, numbered ("2. Abdul Basit"), as long as
          // docs/audio/catalog.json has it. They open on the sound in use; a pause on an item plays a preview (from
          // flash for the stored one). Select on another entry downloads it (its progress shows under it, the check
          // mark moves when it is stored).
          auto sound_row = [](const char *title, int slot) {
            const bool off = slot == 3;
            // Where `item` sits in the row (-1: not there). menu_index() works it out directly, and menu_item()
            // confirms it: the menu asks on every draw, and a list can have hundreds of entries.
            auto pos_of = [=](int item) {
              const int p = id(athan_core).menu_index(slot, off, item);
              return id(athan_core).menu_item(slot, off, p) == item ? p : -1;
            };
            MenuRow r;
            r.title = title;
            r.count = [=]() { return id(athan_core).menu_size(slot, off); };
            r.id_at = [=](int i) { return id(athan_core).menu_item(slot, off, i); };
            r.find = pos_of;
            r.label = [=](int i) -> std::string {
              const int it = id(athan_core).menu_item(slot, off, i);
              if (it == athan::MENU_OFF) return "Off";
              if (it == athan::MENU_RANDOM) return "Random";
              if (it == athan::MENU_CUSTOM) return "Custom";
              return athan::numbered(it, id(athan_core).catalog_name(slot, it));
            };
            r.active = [=]() {
              if (off && !id(htick_enabled)) return pos_of(athan::MENU_OFF);
              if (slot == 2 && id(athan_core).tawashih_random()) return pos_of(athan::MENU_RANDOM);
              return pos_of(id(athan_core).has_custom(slot) ? athan::MENU_CUSTOM : id(athan_core).selected_entry(slot));
            };
            r.caption = [=](int i) -> std::string {
              if (slot == 2 && id(menu_download_slot) != slot && i >= 0 &&
                  id(athan_core).menu_item(slot, off, i) == athan::MENU_RANDOM)
                return "Random one every day";   // also before the list has loaded
              if (!id(athan_core).catalog_ready())
                return wifi::global_wifi_component->is_connected() ? "Loading list..." : "No internet";
              if (i < 0) return "List is empty";
              if (id(menu_download_slot) == slot) return id(athan_core).sound_status();   // what Select started
              if (id(athan_core).menu_item(slot, off, i) == athan::MENU_CUSTOM) return id(athan_core).slot_label(slot);
              return "";
            };
            r.show = [=](int i, bool entered) {
              if (entered) id(athan_core).refresh_catalog();   // the list, loaded again if over 2 hours old
              if (id(athan_playing) || id(prefajr_playing)) return;   // never preview over the athan
              const int it = id(athan_core).menu_item(slot, off, i);
              if (it < 0 && it != athan::MENU_CUSTOM) {
                id(athan_core).stop_preview();   // "Off"
                return;
              }
              const int radio = id(athan_core).radio_active();
              if (radio >= 0) {
                if (entered) return;   // scrolling past with the radio on: no preview cuts it
                id(menu_radio_resume) = radio;   // a preview replaces the radio; it is back when the menu closes
              }
              // After a pause on the item: skipping through items or rows opens one stream, not one per press.
              id(athan_core).request_preview(slot, it, entered ? 800 : 500);
            };
            r.apply = [=](int i) {
              const int it = id(athan_core).menu_item(slot, off, i);
              id(athan_core).stop_preview();
              id(apply_playing_volume).execute();
              if (it == athan::MENU_OFF) {
                id(htick_enabled) = false;
                return false;
              }
              if (off) id(htick_enabled) = true;
              if (it == athan::MENU_RANDOM) {
                id(athan_core).set_tawashih_random(true);   // frees the stored tawashih
                return false;
              }
              if (slot == 2 && it == athan::MENU_CUSTOM) {
                id(athan_core).set_tawashih_random(false);   // the uploaded one, still stored
                return false;
              }
              if (it >= 0) {
                id(menu_download_slot) = slot;
                id(athan_core).download_from_catalog(slot, it);
              }
              return false;   // stays: the check mark shows when it is in use
            };
            r.leave = []() {
              id(athan_core).stop_preview();
              id(apply_playing_volume).execute();
            };
            return r;
          };
          // The left pane shows each row's short_title (after its icon) where the full title is too wide; the right
          // pane's header shows the full title.
          {
            MenuRow r = sound_row("Athan", 0);
            r.symbol = athan::sym::MOSQUE;
            menu.add_row(std::move(r));
          }
          {
            MenuRow r = sound_row("Fajr Athan", 1);
            r.short_title = "Fajr";
            r.symbol = athan::sym::TWILIGHT;
            menu.add_row(std::move(r));
          }
          {
            MenuRow r = sound_row("Tawashih", 2);
            r.short_title = "Tawsh";
            r.symbol = athan::sym::QUEUE_MUSIC;
            menu.add_row(std::move(r));
          }

          {
            MenuRow r;
            r.title = "Pre-Fajr";
            r.symbol = athan::sym::ALARM;
            r.style = athan::RowStyle::CHOICES;   // Off  On, side by side
            r.count = []() { return 2; };
            r.label = [](int i) { return std::string(i ? "On" : "Off"); };
            r.active = []() { return id(prefajr_enabled) ? 1 : 0; };
            r.caption = [](int) { return std::string("Tawashih ${prefajr_offset_min} min before Fajr"); };
            r.apply = [](int i) {
              id(prefajr_enabled) = i == 1;
              ESP_LOGI("ui", "Pre-Fajr Tawashih %s", i ? "ON" : "OFF");
              return false;
            };
            menu.add_row(std::move(r));
          }

          {
            MenuRow r = sound_row("Hourly Tick", 3);
            r.short_title = "Tick";
            r.icon = athan::RowIcon::CLOCK;   // with Tick From and Tick Until
            r.symbol = athan::sym::TIMER;
            menu.add_row(std::move(r));
          }

          // Tick From / Tick Until: the hourly tick's window [from, until); equal = all day. By day: From Fajr, Dhuhr or
          // an hour; Until Maghrib, Isha or an hour (the night's the other way round). Like the other choices:
          // Left/Right browse, Select takes the one shown (the check mark), and the line under it shows the window it
          // would make.
          for (int w = 0; w < 2; w++) {
            MenuRow r;
            r.title = w == 0 ? "Tick From" : "Tick Until";
            r.short_title = w == 0 ? "From" : "Until";
            r.icon = athan::RowIcon::CLOCK;
            r.symbol = athan::sym::SCHEDULE;
            r.kind = RowKind::CHOICE;
            r.count = []() { return athan::WINDOW_CHOICES; };
            r.label = [end_text, w](int i) { return end_text(athan::window_value(athan::WindowKind::TICK, w == 1, i)); };
            r.active = [w]() { return athan::window_choice(athan::WindowKind::TICK, w == 1, w == 0 ? id(htick_start_hour) : id(htick_end_hour)); };
            r.caption = [window_caption, w](int i) {
              const int v = athan::window_value(athan::WindowKind::TICK, w == 1, std::max(0, i));
              return w == 0 ? window_caption(v, id(htick_end_hour), false) : window_caption(id(htick_start_hour), v, true);
            };
            r.apply = [w](int i) {
              (w == 0 ? id(htick_start_hour) : id(htick_end_hour)) = athan::window_value(athan::WindowKind::TICK, w == 1, i);
              return false;
            };
            menu.add_row(std::move(r));
          }

          // Athan On/Off: Select switches the prayer shown.
          {
            static const char *const names[5] = {"Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"};
            static const char *const shorts[5] = {"Fajr", "Dhuhr", "Asr", "Magh", "Isha"};
            static const int prayer_of[5] = {0, 3, 4, 5, 6};
            MenuRow r;
            r.title = "Athan On/Off";
            r.short_title = "On/Off";
            r.icon = athan::RowIcon::SPEAKER;   // which athans sound
            r.symbol = athan::sym::TOGGLE_ON;
            r.kind = RowKind::ACTION;
            r.style = athan::RowStyle::TOGGLES;   // all five at once, each with a box (filled when on)
            r.short_label = [](int i) { return std::string(shorts[i]); };
            r.on = [](int i) { return id(athan_enabled)[prayer_of[i]]; };
            r.count = []() { return 5; };
            r.label = [](int i) { return std::string(names[i]) + (id(athan_enabled)[prayer_of[i]] ? ": On" : ": Off"); };
            r.apply = [](int i) {
              id(athan_enabled)[prayer_of[i]] = !id(athan_enabled)[prayer_of[i]];
              return false;
            };
            menu.add_row(std::move(r));
          }

          // Volume, Fajr Volume: 0-100 % in steps of 10, at once, with a tone at the new level (Volume: over the radio
          // too, at its new level; Fajr Volume: fajr_volume_feedback).
          {
            MenuRow r;
            r.title = "Volume";
            r.short_title = "Vol";   // "Volume" after the speaker is wider than the list
            r.icon = athan::RowIcon::SPEAKER;
            r.symbol = athan::sym::VOLUME_UP;
            r.kind = RowKind::VALUE;
            r.style = athan::RowStyle::LEVEL;
            r.wrap = false;
            r.count = []() { return 11; };
            r.label = [](int i) { return std::to_string(i * 10) + "%"; };
            r.active = []() { return std::max(0, std::min(10, (id(volume_level) + 5) / 10)); };
            r.apply = [](int i) {
              id(volume_level) = i * 10;
              id(apply_playing_volume).execute();   // a Fajr athan playing keeps the Fajr volume
              id(play_tone_volume).execute();
              return false;
            };
            menu.add_row(std::move(r));
          }
          {
            MenuRow r;
            r.title = "Fajr Volume";
            r.short_title = "Fajr";
            r.icon = athan::RowIcon::SPEAKER;
            r.symbol = athan::sym::VOLUME_UP;
            r.kind = RowKind::VALUE;
            r.style = athan::RowStyle::LEVEL;
            r.wrap = false;
            r.count = []() { return 11; };
            r.label = [](int i) { return std::to_string(i * 10) + "%"; };
            r.active = []() {
              const int v = id(fajr_volume_level) < 0 ? id(volume_level) : id(fajr_volume_level);
              return std::max(0, std::min(10, (v + 5) / 10));
            };
            r.apply = [](int i) {
              id(fajr_volume_level) = i * 10;
              id(fajr_volume_feedback).execute();
              return false;
            };
            menu.add_row(std::move(r));
          }

          {
            MenuRow r;
            r.title = "Location";
            r.short_title = "Masjid";
            r.symbol = athan::sym::LOCATION;
            r.style = athan::RowStyle::CHOICES;   // side by side while the names fit
            // The mosques of docs/athantimes/mosques.json, numbered and by name: the select's options (sync_web_state),
            // whose keys the component keeps. Choosing one stores its key. Entering the row loads the list again if it
            // is over 2 hours old, so it can change while the row is open: the cursor keeps its mosque by key.
            r.show = [](int, bool entered) {
              if (entered) id(athan_core).refresh_mosques();
            };
            r.id_at = [](int i) { return (int) fnv1_hash(id(athan_core).location_key(i)); };
            r.find = [](int key_id) {
              for (int i = 0; i < (int) id(web_location_select).size(); i++)
                if ((int) fnv1_hash(id(athan_core).location_key(i)) == key_id) return i;
              return -1;
            };
            r.count = []() { return (int) id(web_location_select).size(); };
            r.label = [](int i) -> std::string {
              auto name = id(web_location_select).at(i);
              return name.has_value() ? name.value() : std::string("?");
            };
            r.active = []() { return id(athan_core).location_index(id(selected_location_key)); };
            if (${menu_mosque_coords}) {
              // Where the mosque is, as a map gives it ("38.5465, -121.7563"), grey at the bottom of the pane: the
              // colour screen has room (menu_mosque_coords in displays/*.yaml). Four decimals (about 11 m) keep it on
              // one line: the caption has about 118 px, and five decimals (about 125 px) wrapped after the comma.
              r.caption = [](int i) -> std::string {
                double lat, lon;
                if (!id(athan_core).location_coords(i, &lat, &lon)) return "";
                char buf[40];
                snprintf(buf, sizeof(buf), "%.4f, %.4f", lat, lon);
                return buf;
              };
            }
            r.apply = [](int i) {
              const std::string key = id(athan_core).location_key(i);
              if (!key.empty()) {
                id(selected_location_key) = key;
                id(athan_core).set_location(key);
              }
              return false;
            };
            menu.add_row(std::move(r));
          }

          {
            MenuRow r;
            r.title = "Clock";
            r.symbol = athan::sym::CLOCK;
            r.style = athan::RowStyle::CHOICES;
            r.count = []() { return 2; };
            r.label = [](int i) { return std::string(i ? "12-hour" : "24-hour"); };
            r.active = []() { return id(clock_12h) ? 1 : 0; };
            r.apply = [](int i) {
              id(clock_12h) = i == 1;
              return false;
            };
            menu.add_row(std::move(r));
          }

          // Brightness: 0-100 % at once (screen_refresh: the TFT's backlight, the OLED's contrast; 0 % = dark).
          {
            MenuRow r;
            r.title = "Brightness";
            r.short_title = "Bright";
            r.icon = athan::RowIcon::SUN;
            r.symbol = athan::sym::BRIGHTNESS;
            r.kind = RowKind::VALUE;
            r.style = athan::RowStyle::LEVEL;
            r.wrap = false;
            r.count = []() { return 11; };
            r.label = [](int i) { return std::to_string(i * 10) + "%"; };
            r.active = []() { return std::max(0, std::min(10, id(screen_brightness) / 10)); };
            r.caption = [](int i) { return std::string(i == 0 ? "Dark till a key" : ""); };
            r.apply = [](int i) {
              id(screen_brightness) = i * 10;
              id(screen_force_dark) = i == 0;   // 0 %: dark at once; the next key lights it, dim, counting down
              id(screen_refresh).execute();
              return false;
            };
            menu.add_row(std::move(r));
          }

          // Screen at Night: from Night From to Night Until the screen stays as by day (Normal), dims, or is turned
          // off (dark until a key).
          {
            static const char *const modes[3] = {"Normal", "Dim", "Turned off"};
            MenuRow r;
            r.title = "Screen at Night";
            r.short_title = "Night";
            r.icon = athan::RowIcon::MOON;
            r.symbol = athan::sym::DARK_MODE;
            r.style = athan::RowStyle::CHOICES;   // Normal Dim Turned off, side by side when they fit
            r.count = []() { return 3; };
            r.label = [](int i) { return std::string(modes[i]); };
            r.active = []() { return std::max(0, std::min(2, id(screen_night))); };
            r.caption = [end_text](int i) -> std::string {
              if (i <= athan::NIGHT_NORMAL) return "Same as by day";
              const int a = id(night_from_hour), b = id(night_until_hour);
              const bool all = athan::window_length(a, b, id(prayer_hours), id(prayer_minutes)) == 1440;
              return all ? std::string("All day") : end_text(a) + " to " + end_text(b);   // when it is dim or off
            };
            r.apply = [](int i) {
              id(screen_night) = i;
              id(screen_refresh).execute();
              return false;
            };
            menu.add_row(std::move(r));
          }

          // Night From / Night Until: the screen's night [from, until), like the tick hours but the other way round:
          // From Maghrib, Isha or an hour; Until Fajr, Dhuhr or an hour; Select takes the one shown; equal = all day.
          for (int w = 0; w < 2; w++) {
            MenuRow r;
            r.title = w == 0 ? "Night From" : "Night Until";
            r.short_title = w == 0 ? "From" : "Until";
            r.icon = athan::RowIcon::MOON;
            r.symbol = athan::sym::BEDTIME;
            r.kind = RowKind::CHOICE;
            r.count = []() { return athan::WINDOW_CHOICES; };
            r.label = [end_text, w](int i) { return end_text(athan::window_value(athan::WindowKind::NIGHT, w == 1, i)); };
            r.active = [w]() { return athan::window_choice(athan::WindowKind::NIGHT, w == 1, w == 0 ? id(night_from_hour) : id(night_until_hour)); };
            r.caption = [window_caption, w](int i) {
              const int v = athan::window_value(athan::WindowKind::NIGHT, w == 1, std::max(0, i));
              return w == 0 ? window_caption(v, id(night_until_hour), false) : window_caption(id(night_from_hour), v, true);
            };
            r.apply = [w](int i) {
              (w == 0 ? id(night_from_hour) : id(night_until_hour)) = athan::window_value(athan::WindowKind::NIGHT, w == 1, i);
              id(screen_refresh).execute();
              return false;
            };
            menu.add_row(std::move(r));
          }

          // The display's own rows (displays/*.yaml, script menu_display_rows): the TFT's Screen Colour.
          id(menu_display_rows).execute();

          // Update: Select installs an update that is there (found by any check: after a start, the daily one, the web
          // page's or this row's), else checks now. It reads fw_update's own state, so an install that fails offers
          // the update again.
          {
            MenuRow r;
            r.title = "Update";
            r.symbol = athan::sym::SYSTEM_UPDATE;
            r.kind = RowKind::ACTION;
            r.count = []() { return 1; };
            r.label = [](int) -> std::string {
              const auto st = id(fw_update).state;
              if (st == update::UPDATE_STATE_INSTALLING) return "Installing...";
              if (id(update_check_state) == 1) return "Checking...";
              if (st == update::UPDATE_STATE_AVAILABLE) return "Install " + id(fw_update).update_info.latest_version;
              return "Check now";
            };
            r.caption = [](int) -> std::string {
              const auto st = id(fw_update).state;
              if (st == update::UPDATE_STATE_AVAILABLE)
                return id(fw_failed_version) == id(fw_update).update_info.latest_version ? "Install failed: try again"
                                                                                           : "Installed: V${project_version}";
              if (id(fw_update).status_has_error() || id(update_check_state) == 2) return "Check failed (offline?)";
              if (st == update::UPDATE_STATE_NO_UPDATE) return "V${project_version} is the latest";
              return "Installed: V${project_version}";
            };
            r.apply = [](int) {
              const auto st = id(fw_update).state;
              if (st == update::UPDATE_STATE_AVAILABLE)
                id(fw_update).perform(false);
              else if (st != update::UPDATE_STATE_INSTALLING && id(update_check_state) != 1)
                id(check_update).execute();
              return false;
            };
            menu.add_row(std::move(r));
          }

          {
            MenuRow r;
            r.title = "Lock Buttons";
            r.short_title = "Lock";
            r.icon = athan::RowIcon::LOCK;
            r.symbol = athan::sym::LOCK;
            r.kind = RowKind::ACTION;
            r.count = []() { return 1; };
            r.label = [](int) { return std::string("Lock now"); };
            r.caption = [](int) { return std::string("Unlock: hold arrow at boot"); };
            r.apply = [](int) {
              id(buttons_locked) = true;
              return true;
            };
            menu.add_row(std::move(r));
          }

          // Info: one page (the caption), Select closes.
          {
            MenuRow r;
            r.title = "Info";
            r.symbol = athan::sym::INFO;
            r.kind = RowKind::ACTION;
            r.count = []() { return 1; };
            // One screen: the IP address, and under it the web page's name and the firmware version side by side.
            r.label = [](int) -> std::string {
              auto ips = network::get_ip_addresses();
              char ip[48] = "No Wi-Fi";
              if (wifi::global_wifi_component->is_connected() && ips[0].is_set()) ips[0].str_to(ip);
              return ip;
            };
            r.caption = [](int) -> std::string { return "athan.local\tV${project_version}"; };
            r.apply = [](int) { return true; };
            menu.add_row(std::move(r));
          }

          // Exit, last: one Up from Radio (the rows go round). Select, Left and Right return to the clock; the right
          // pane previews it: the time (label) and the next prayer (caption).
          {
            static const char *const names[7] = {"Fajr", "Sunrise", "Doha", "Dhuhr", "Asr", "Maghrib", "Isha"};
            MenuRow r;
            r.title = "Exit";
            r.icon = athan::RowIcon::EXIT;
            r.symbol = athan::sym::ARROW_BACK;
            r.kind = RowKind::ACTION;
            r.exit = true;
            r.count = []() { return 1; };
            r.label = [](int) -> std::string {
              auto now = id(sntp_time).now();
              char b[8];
              if (!now.is_valid()) return "--:--";
              if (id(clock_12h)) snprintf(b, sizeof(b), "%d:%02d", (now.hour % 12) ? now.hour % 12 : 12, now.minute);
              else snprintf(b, sizeof(b), "%02d:%02d", now.hour, now.minute);
              return b;
            };
            r.caption = [](int) -> std::string {
              const int i = id(next_prayer_index), h = id(next_prayer_hour), m = id(next_prayer_minute);
              if (!id(sntp_time).now().is_valid() || !id(times_loaded) || i < 0 || i > 6) return "";
              char b[24];
              if (id(clock_12h)) snprintf(b, sizeof(b), "%s %d:%02d", names[i], (h % 12) ? h % 12 : 12, m);
              else snprintf(b, sizeof(b), "%s %02d:%02d", names[i], h, m);
              return b;
            };
            menu.add_row(std::move(r));
          }

          menu.set_on_close([]() {
            id(menu_download_slot) = -1;
            id(apply_playing_volume).execute();
            // A preview replaced the radio: it comes back.
            const int r = id(menu_radio_resume);
            id(menu_radio_resume) = -1;
            if (r >= 0 && id(athan_core).radio_active() < 0 && !id(athan_playing) && !id(prefajr_playing)) {
              id(radio_slot) = r;
              id(radio_start).execute();
            }
          });

  # Radio off on purpose (Up on the clock, the menu, the web Stop Radio): silent at once unless a stored sound plays
  # (the mute would cut it too), and no radio comes back after an athan or a menu preview.
  - id: radio_off
    then:
      - lambda: |-
          id(radio_resume) = -1;
          id(menu_radio_resume) = -1;
          if (id(athan_core).radio_active() >= 0 && !id(athan_core).slot_playing()) id(hard_mute).execute();
          id(athan_core).radio_stop();
          id(update_display).execute();

  # ---------------- radio ----------------
  - id: radio_start
    mode: restart
    then:
      - lambda: |-
          int s = std::max(0, std::min(9, id(radio_slot)));
          if (id(athan_playing) || id(prefajr_playing)) {
            id(radio_resume) = s;   // started when the athan or the tawashih ends, at the normal volume
            return;
          }
          id(apply_volume).execute();
          id(amp_wake).execute();
          id(athan_core).radio_play(s, id(radio_subscribed)[s]);
          id(update_display).execute();

  # ---------------- stored sounds ----------------
  # Athan (Fajr file at Fajr). Pauses the radio and resumes the same slot afterwards.
  - id: make_athan
    mode: single
    then:
      - lambda: |-
          // The radio to bring back afterwards: the one playing, or the one a menu preview replaced (closing the menu
          // brings that back only when no athan plays, and the preview has already taken the radio's place).
          int r = id(athan_core).radio_active();
          if (r < 0) r = id(menu_radio_resume);
          id(radio_resume) = r;
          id(athan_playing) = true;
          id(athan_core).menu().close();   // the athan screen shows, and Up/Down/Select stop it
          id(athan_core).stop_media();     // the radio or a preview, if any
          id(amp_wake).execute();
          id(led_output).turn_on();
      - if:
          condition:
            lambda: 'return id(current_athan_prayer_index) == 0;'
          then:
            - script.execute: apply_fajr_volume
          else:
            - script.execute: apply_volume
      - delay: 100ms
      - if:
          condition:
            lambda: |-
              // Fajr plays the Fajr athan, or the regular one while the Fajr slot is empty (being rewritten, or a power
              // cut while writing): the call without its Fajr line rather than three tones. Never the other way round:
              // the Fajr athan's "as-salatu khayrun min an-nawm" belongs to Fajr only.
              const bool fajr = id(current_athan_prayer_index) == 0;
              return id(athan_core).play_slot(fajr ? 1 : 0) || (fajr && id(athan_core).play_slot(0));
          else:
            # Empty slot (new device offline, or a power cut while writing): mark the time with three tones.
            - repeat:
                count: 3
                then:
                  - lambda: 'id(athan_core).play_tone(id(tone_click));'
                  - delay: 1500ms
      - script.execute: update_display
      - wait_until:
          condition:
            lambda: 'return !id(athan_core).slot_playing() && id(player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING;'
          timeout: 7min
      - lambda: |-
          id(athan_playing) = false;
          id(led_output).turn_off();
          id(apply_playing_volume).execute();
          int r = id(radio_resume);
          id(radio_resume) = -1;
          if (r >= 0) {
            id(radio_slot) = r;
            id(radio_start).execute();
          }
          id(update_display).execute();

  # What was called (prayer_called, prefajr_called) is saved at once, not at ESPHome's next write (every 60 s): a crash
  # or a watchdog reset in that time keeps the clock's time and would call it again. A few writes a day.
  - id: save_called
    mode: restart
    then:
      - delay: 1500ms   # a global hands its new value to the preferences within a second
      - lambda: 'global_preferences->sync();'

  # Pre-Fajr Tawashih: relay on, tawashih at the Fajr volume, relay off ${prefajr_relay_min} min after it ends.
  - id: run_prefajr
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("prefajr", "Pre-Fajr Tawashih");
          // The radio to bring back afterwards (as in make_athan). prefajr_playing before closing the menu: closing it
          // would otherwise start the radio a menu preview replaced, only to stop it again here.
          int r = id(athan_core).radio_active();
          if (r < 0) r = id(menu_radio_resume);
          id(radio_resume) = r;
          id(prefajr_playing) = true;
          id(athan_core).menu().close();   // Up/Down/Select on the clock stop it
          id(athan_core).stop_media();     // the radio or a preview, if any
          id(amp_wake).execute();
      - switch.turn_on: external_relay
      # Until the tawashih ends, the relay's timer allows for the longest one (the 7 min wait below): a tawashih
      # stopped by a key or the web Stop (which stops this script) must not leave the relay on. A restart loses the
      # timer: relay_by_prefajr (saved) switches the relay off at boot.
      - lambda: |-
          id(relay_by_prefajr) = true;
          id(prefajr_relay_off).execute((${prefajr_relay_min} + 7) * 60000);
      - script.execute: apply_fajr_volume
      - delay: 100ms
      - lambda: |-
          // Random: a list entry streamed (another than last time); without internet nothing plays (the relay
          // still switches). Otherwise the tawashih stored on the clock.
          if (id(athan_core).tawashih_random()) id(athan_core).play_random_tawashih();
          else if (!id(athan_core).play_slot(2)) ESP_LOGW("prefajr", "No tawashih selected");
      - wait_until:
          condition:
            lambda: |-
              return !id(athan_core).slot_playing() && !id(athan_core).tawashih_streaming() &&
                     id(player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING;
          timeout: 7min
      - lambda: |-
          id(prefajr_playing) = false;
          id(apply_playing_volume).execute();
          int r = id(radio_resume);
          id(radio_resume) = -1;
          if (r >= 0 && !id(athan_playing)) { id(radio_slot) = r; id(radio_start).execute(); }
          id(prefajr_relay_off).execute(${prefajr_relay_min} * 60000 - 7000);
  # The Pre-Fajr relay's own timer (restart: the last call counts), apart from run_prefajr so that stopping that
  # script never leaves the relay on.
  - id: prefajr_relay_off
    mode: restart
    parameters:
      after_ms: int
    then:
      - delay: !lambda 'return after_ms;'
      - switch.turn_off: external_relay
      - lambda: 'id(relay_by_prefajr) = false;'

  # Hourly tick: plays over the radio with the radio lowered (mixer ducking).
  - id: play_tick
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(athan_core).radio_active() >= 0;'
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixer_input
                decibel_reduction: 20
                duration: 0.3s
      - lambda: |-
          id(apply_volume).execute();
          id(amp_wake).execute();
          if (!id(athan_core).play_slot(3)) ESP_LOGW("tick", "No tick selected");
      - wait_until:
          condition:
            lambda: 'return !id(athan_core).slot_playing();'
          timeout: 70s
      - mixer_speaker.apply_ducking:
          id: media_mixer_input
          decibel_reduction: 0
          duration: 0.5s

  # ---------------- firmware update (GitHub Releases) ----------------
  - id: check_update
    mode: single
    then:
      - lambda: 'id(update_check_state) = 1; id(update_display).execute();'
      - update.check: fw_update
      - delay: 8s
      - lambda: |-
          // The answer is fw_update's state. Still UNKNOWN without an error: the check never ran (offline).
          id(update_check_state) =
              id(fw_update).state == update::UPDATE_STATE_UNKNOWN && !id(fw_update).status_has_error() ? 2 : 0;
          id(update_display).execute();

  # The firmware check after a start: 30 s after Wi-Fi first connects (the time, the prayer times and the lists go
  # first). A Wi-Fi that drops in those 30 s leaves it for the next connection.
  - id: fw_check_after_start
    mode: single
    then:
      - delay: 30s
      - if:
          condition: wifi.connected
          then:
            - lambda: 'id(fw_checked_after_start) = true;'
            - update.check: fw_update

  # ---------------- schedule ----------------
  # Today's times from the athan component (stored yearly file, or last year's as a stand-in).
  - id: load_today
    mode: restart
    then:
      - lambda: |-
          uint8_t h[7], m[7];
          if (!id(athan_core).today_times(h, m)) {
            id(times_loaded) = false;
            return;
          }
          for (int i = 0; i < 7; i++) { id(prayer_hours)[i] = h[i]; id(prayer_minutes)[i] = m[i]; }
          id(times_loaded) = true;
          ESP_LOGI("prayer", "Today: Fajr %02d:%02d Sunrise %02d:%02d Doha %02d:%02d Dhuhr %02d:%02d Asr %02d:%02d Maghrib %02d:%02d Isha %02d:%02d%s",
                   h[0], m[0], h[1], m[1], h[2], m[2], h[3], m[3], h[4], m[4], h[5], m[5], h[6], m[6],
                   id(athan_core).times_standin() ? " (stand-in from last year)" : "");
          id(compute_coming_prayer).execute();
          id(update_display).execute();

  # Next prayer at or after now (equal minute counts: a reload in a prayer's minute finds it again, and the 1 s interval
  # does not call it twice: prayer_called).
  - id: compute_coming_prayer
    mode: restart
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid() || !id(times_loaded)) return;
          int cur = now.hour * 60 + now.minute;
          int idx = 0;   // all passed -> tomorrow's Fajr
          for (int i = 0; i < 7; i++) {
            if (id(prayer_hours)[i] * 60 + id(prayer_minutes)[i] >= cur) { idx = i; break; }
          }
          id(next_prayer_index) = idx;
          id(next_prayer_hour) = id(prayer_hours)[idx];
          id(next_prayer_minute) = id(prayer_minutes)[idx];
          if (idx == 0) {
            int t = id(next_prayer_hour) * 60 + id(next_prayer_minute) - ${prefajr_offset_min};
            if (t < 0) t += 1440;
            id(prefajr_next_hour) = t / 60;
            id(prefajr_next_minute) = t % 60;
          }

  # After a prayer time is reached: the next one strictly later.
  - id: jump_to_next_prayer
    mode: restart
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid() || !id(times_loaded)) return;
          int cur = now.hour * 60 + now.minute;
          int idx = 0;
          for (int i = 0; i < 7; i++) {
            if (id(prayer_hours)[i] * 60 + id(prayer_minutes)[i] > cur) { idx = i; break; }
          }
          id(next_prayer_index) = idx;
          id(next_prayer_hour) = id(prayer_hours)[idx];
          id(next_prayer_minute) = id(prayer_minutes)[idx];
          if (idx == 0) {
            int t = id(next_prayer_hour) * 60 + id(next_prayer_minute) - ${prefajr_offset_min};
            if (t < 0) t += 1440;
            id(prefajr_next_hour) = t / 60;
            id(prefajr_next_minute) = t % 60;
          }

  # ---------------- web / Home Assistant entities (publish on change) ----------------
  - id: sync_web_state
    mode: restart
    then:
      - lambda: |-
          // Runs every second: values are formatted into buf and compared in place, and only a change is published.
          // The component's status lines and sound names are copied each second (short strings, under its lock).
          char buf[320];
          auto pub = [](text_sensor::TextSensor *t, const char *s) { if (t->state != s) t->publish_state(s); };
          {
            // Location: the mosques of docs/athantimes/mosques.json by name, as the component loaded them, with this
            // clock's mosque added when the list lacks it. New options only when the list changed or the mosque is not
            // among them: the web server's task may read a select's options (a GET of it), so swapping them stays
            // rare. The select shows the stored key's choice, by position.
            static uint32_t bound_gen = UINT32_MAX;
            const std::string &loc = id(selected_location_key);
            auto *sel = id(web_location_select);
            int at = id(athan_core).location_index(loc);
            if (bound_gen != id(athan_core).mosques_gen() || at < 0) {
              bound_gen = id(athan_core).mosques_gen();
              sel->traits.set_options(id(athan_core).location_choices(loc));
              at = id(athan_core).location_index(loc);
              if (at >= 0) sel->publish_state((size_t) at);   // its position may have moved
            } else {
              auto cur = sel->active_index();
              if (!sel->has_state() || !cur.has_value() || cur.value() != (size_t) at) sel->publish_state((size_t) at);
            }
          }
          {
            // Radio Station options: "Radio 1 Cairo Quran" from the station list in memory, "Radio 4 (own link)" for
            // a slot with its own link, plain "Radio N" until the list has loaded. The labels live in fixed
            // buffers the select points at (set once); their text is rewritten in place only when it changes.
            static char labels[10][40];
            static bool attached = false;
            bool changed = !attached;
            for (int k = 0; k < 10; k++) {
              char want[40];
              std::string nm = id(athan_core).station_name(k);
              if (!id(radio_subscribed)[k]) snprintf(want, sizeof(want), "Radio %d (own link)", k + 1);
              else if (!nm.empty()) snprintf(want, sizeof(want), "Radio %d %s", k + 1, nm.c_str());
              else snprintf(want, sizeof(want), "Radio %d", k + 1);
              if (strcmp(want, labels[k]) != 0) { memcpy(labels[k], want, sizeof(want)); changed = true; }
            }
            if (!attached) {
              id(web_radio_slot).traits.set_options({labels[0], labels[1], labels[2], labels[3], labels[4],
                                                     labels[5], labels[6], labels[7], labels[8], labels[9]});
              attached = true;
            }
            // By index: the labels change, the slot does not. A changed label is republished for the web page.
            const size_t slot = (size_t) std::max(0, std::min(9, id(radio_slot)));
            auto cur = id(web_radio_slot).active_index();
            if (changed || !id(web_radio_slot).has_state() || !cur.has_value() || cur.value() != slot)
              id(web_radio_slot).publish_state(slot);
          }
          if (!id(web_volume).has_state() || (int) id(web_volume).state != id(volume_level)) id(web_volume).publish_state(id(volume_level));
          if (id(fajr_volume_level) >= 0 && (!id(web_fajr_volume).has_state() || (int) id(web_fajr_volume).state != id(fajr_volume_level))) id(web_fajr_volume).publish_state(id(fajr_volume_level));
          // The windows' selects (day_window.h: a prayer end, or an hour; each window offers its own prayers)
          auto sync_window = [](esphome::select::Select *s, athan::WindowKind k, bool until, int v) {
            const int choice = athan::window_choice(k, until, v);
            if (choice < 0) return;  // an end this window does not offer: on_boot turned it into an hour already
            const size_t want = (size_t) choice;
            auto cur = s->active_index();
            if (!s->has_state() || !cur.has_value() || cur.value() != want) s->publish_state(want);
          };
          sync_window(id(web_htick_start), athan::WindowKind::TICK, false, id(htick_start_hour));
          sync_window(id(web_htick_end), athan::WindowKind::TICK, true, id(htick_end_hour));
          sync_window(id(web_night_from), athan::WindowKind::NIGHT, false, id(night_from_hour));
          sync_window(id(web_night_until), athan::WindowKind::NIGHT, true, id(night_until_hour));
          if (!id(web_screen_brightness).has_state() || (int) id(web_screen_brightness).state != id(screen_brightness)) id(web_screen_brightness).publish_state(id(screen_brightness));
          {
            auto cur = id(web_screen_night).active_index();
            const size_t want = (size_t) std::max(0, std::min(2, id(screen_night)));
            if (!id(web_screen_night).has_state() || !cur.has_value() || cur.value() != want) id(web_screen_night).publish_state(want);
          }
          auto fmt_time = [&](char *out, size_t n, int h, int m) {
            if (id(clock_12h)) {
              int h12 = h % 12; if (h12 == 0) h12 = 12;
              snprintf(out, n, "%d:%02d %s", h12, m, (h < 12) ? "AM" : "PM");
            } else {
              snprintf(out, n, "%02d:%02d", h, m);
            }
          };
          char t1[12], t2[12];
          {
            // The windows as the web page shows them, under their selects: "Fajr to Isha (14 h)", "07:00 to 22:00
            // (15 h)", "all day", or off. An end is a prayer (day_window.h) or an hour.
            auto end_text = [&](char *out, size_t n, int v) {
              const char *pn = athan::window_prayer_name(v);
              if (pn) snprintf(out, n, "%s", pn);
              else fmt_time(out, n, v, 0);
            };
            auto window_text = [&](bool on, const char *off, int s, int e) {
              const int len = athan::window_length(s, e, id(prayer_hours), id(prayer_minutes));
              if (!on) snprintf(buf, sizeof(buf), "%s", off);
              else if (len == 1440) snprintf(buf, sizeof(buf), "all day");
              else { end_text(t1, sizeof(t1), s); end_text(t2, sizeof(t2), e); snprintf(buf, sizeof(buf), "%s to %s (%d h)", t1, t2, (len + 30) / 60); }
            };
            window_text(id(htick_enabled), "tick off", id(htick_start_hour), id(htick_end_hour));
            pub(id(web_htick_window), buf);
            window_text(id(screen_night) != athan::NIGHT_NORMAL, "same as day", id(night_from_hour), id(night_until_hour));
            pub(id(web_night_window), buf);
          }
          static const char *names[7] = {"Fajr", "Sunrise", "Doha", "Dhuhr", "Asr", "Maghrib", "Isha"};
          auto now = id(sntp_time).now();
          if (now.is_valid() && id(times_loaded)) {
            int npi = id(next_prayer_index);
            int total = id(next_prayer_hour) * 60 + id(next_prayer_minute) - (now.hour * 60 + now.minute);
            if (total < 0) total += 1440;
            bool muted = (npi != 1 && npi != 2) && !id(athan_enabled)[npi];
            fmt_time(t1, sizeof(t1), id(next_prayer_hour), id(next_prayer_minute));
            snprintf(buf, sizeof(buf), "%s %s (in %dh %02dm)%s%s", names[npi], t1, total / 60, total % 60,
                     muted ? " [athan off]" : "", id(athan_core).times_standin() ? " [estimated]" : "");
            pub(id(web_next_prayer), buf);
            int pos = 0;
            for (int i = 0; i < 7 && pos < (int) sizeof(buf) - 1; i++) {
              fmt_time(t1, sizeof(t1), id(prayer_hours)[i], id(prayer_minutes)[i]);
              pos += snprintf(buf + pos, sizeof(buf) - pos, "%s%s %s", i ? ", " : "", names[i], t1);
            }
            pub(id(web_today_times), buf);
          } else {
            pub(id(web_next_prayer), "waiting for the clock and prayer data");
            pub(id(web_today_times), "not loaded yet");
          }
          {
            static const char *slot_names[4] = {"Athan", "Fajr", "Tawashih", "Tick"};
            int pos = 0;
            for (int i = 0; i < 4 && pos < (int) sizeof(buf) - 1; i++) {
              const std::string l = (i == 2 && id(athan_core).tawashih_random()) ? std::string("Random")
                                                                                  : id(athan_core).sound_name(i);
              pos += snprintf(buf + pos, sizeof(buf) - pos, "%s%s: %s", i ? "; " : "", slot_names[i],
                              l.empty() ? "none" : l.c_str());
            }
            pub(id(web_sounds), buf);
          }
          {
            static uint32_t drops_seen = UINT32_MAX;   // rebuilt only after a drop
            const uint32_t drops = id(athan_core).wifi_drop_count();
            if (drops != drops_seen) {
              drops_seen = drops;
              pub(id(web_wifi_drops), id(athan_core).wifi_drops_text().c_str());
            }
          }
          pub(id(web_sound_status), id(athan_core).sound_status().c_str());
          pub(id(web_radio_status), id(athan_core).radio_status().c_str());
          pub(id(web_prayer_data), id(athan_core).prayer_status().c_str());
          {
            auto ips = network::get_ip_addresses();
            char ip[48] = "";
            if (ips[0].is_set()) ips[0].str_to(ip);
            snprintf(buf, sizeof(buf), "http://%s/audio", ip[0] ? ip : "athan.local");
            pub(id(web_audio_page), buf);
          }
          {
            // This build's version (project_version) and what the last check of the GitHub Release said.
            const char *latest = id(fw_update).update_info.latest_version.c_str();
            const auto st = id(fw_update).state;
            // A failed install also sets the entity's error: tell it apart from a failed check (fw_failed_version).
            const bool install_failed = st == update::UPDATE_STATE_AVAILABLE &&
                                        id(fw_failed_version) == id(fw_update).update_info.latest_version;
            if (st == update::UPDATE_STATE_INSTALLING) snprintf(buf, sizeof(buf), "${project_version} (installing %s)", latest);
            else if (install_failed) snprintf(buf, sizeof(buf), "${project_version} (installing %s failed, try again)", latest);
            else if (id(fw_update).status_has_error()) snprintf(buf, sizeof(buf), "${project_version} (no release found on GitHub, or no internet)");
            else if (st == update::UPDATE_STATE_AVAILABLE) snprintf(buf, sizeof(buf), "${project_version} (%s available)", latest);
            else if (st == update::UPDATE_STATE_NO_UPDATE) snprintf(buf, sizeof(buf), "${project_version} (latest)");
            else snprintf(buf, sizeof(buf), "${project_version} (not checked yet)");
            pub(id(web_fw_version), buf);
          }

# ---------------------------------------------------------------------------------------------------------------------
interval:
  # Every second: reload today's times when they change, call the athan, Pre-Fajr Tawashih.
  - interval: 1s
    then:
      - script.execute: screen_refresh   # night hours, the 30 s after a key, the athan (a no-op when unchanged)
      - lambda: |-
          if (id(athan_core).schedule_version() != id(schedule_seen)) {
            id(schedule_seen) = id(athan_core).schedule_version();
            id(load_today).execute();
          }
          auto now = id(sntp_time).now();
          // No clock yet: on_time does not fire, so redraw every 5 s (Wi-Fi mark, setup mode, struck-through rows).
          static uint8_t waiting_ticks = 0;
          if (!now.is_valid() && ++waiting_ticks % 5 == 0) id(update_display).execute();
          if (!now.is_valid() || !id(times_loaded)) return;
          int cur = now.hour * 60 + now.minute;
          int next = id(next_prayer_hour) * 60 + id(next_prayer_minute);
          int isha = id(prayer_hours)[6] * 60 + id(prayer_minutes)[6];
          const int y = now.year - 1;
          const int day = 365 * now.year + y / 4 - y / 100 + y / 400 + now.day_of_year;   // +1 a day, across New Year too
          // Reached the next prayer (after Isha the next one is tomorrow's Fajr: wait until midnight passes). Called
          // once: a reload of the times in its minute, or a restart, finds the same prayer again (prayer_called).
          if (cur >= next && (id(next_prayer_index) == 6 || cur < isha)) {
            int pi = id(next_prayer_index);
            bool main_prayer = (pi != 1 && pi != 2);
            const bool again = id(prayer_called) == day * 8 + pi;
            if (!again) {
              id(prayer_called) = day * 8 + pi;
              id(save_called).execute();
            }
            if (main_prayer && id(athan_enabled)[pi] && !again) {
              id(current_athan_prayer_index) = pi;
              id(make_athan).execute();
            }
            ESP_LOGI("prayer", "Prayer time reached: %d%s", pi, again ? " (called already)" : "");
            id(jump_to_next_prayer).execute();
            id(update_display).execute();
          }
          // Pre-Fajr Tawashih: in its minute, or up to 5 min late (a minute the loop missed, a clock that jumped, an
          // athan that was still playing), never at or after Fajr; once for each Fajr (prefajr_called: a reload or a
          // restart in that time). Its minute after Fajr's on the clock: it starts before midnight, for tomorrow's Fajr.
          if (id(prefajr_enabled) && id(next_prayer_index) == 0 && !id(athan_playing)) {
            const int pf = id(prefajr_next_hour) * 60 + id(prefajr_next_minute);
            const int fajr = id(next_prayer_hour) * 60 + id(next_prayer_minute);   // again: the jump above moves it
            const int late = (cur - pf + 1440) % 1440, span = (fajr - pf + 1440) % 1440;
            const int fajr_day = cur > fajr ? day + 1 : day;
            if (late < std::min(5, span) && id(prefajr_called) != fajr_day) {
              id(prefajr_called) = fajr_day;
              id(save_called).execute();
              id(run_prefajr).execute();
            }
          }
  # The web page's Tick Window and Night Window lines follow a change of what they show at once, from anywhere (the web
  # page, the menu, Home Assistant), instead of at the next second: a fingerprint of their settings is compared every
  # 100 ms (a few microseconds), and sync_web_state runs when it differs. The prayer times move them only once a day,
  # which the 1 s sync covers.
  - interval: 100ms
    then:
      - lambda: |-
          static uint32_t seen = 0;
          uint32_t h = 2166136261u;
          for (int v : {(int) id(htick_enabled), id(htick_start_hour), id(htick_end_hour), id(screen_night),
                        id(night_from_hour), id(night_until_hour), (int) id(clock_12h)})
            h = (h ^ (uint32_t) v) * 16777619u;
          if (h != seen) {
            seen = h;
            id(sync_web_state).execute();
          }
  - interval: 1s
    then:
      - lambda: |-
          // Redraw when the radio starts or stops from anywhere (web buttons, /audio previews, a stream that
          // gave up), so the OLED's radio mark never waits for the minute redraw.
          static int shown = -2;
          const int r = id(athan_core).radio_active();
          if (r != shown) { shown = r; id(update_display).execute(); }
          // Menu: back to the clock after 60 s without a press. While open it is redrawn when what it shows has
          // changed (download progress, a list that loaded, the update check): menu_changed() reads the same hooks
          // as the drawing without touching the display.
          auto &menu = id(athan_core).menu();
          if (menu.is_open()) {
            if (millis() - id(ui_last_activity) >= 60000) {
              menu.close();
              id(update_display).execute();
            } else if (athan::menu_changed(menu)) {
              id(update_display).execute();
            }
          }
      - script.execute: sync_web_state
