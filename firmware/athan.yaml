    min_value: 0
    max_value: 100
    step: 10
    mode: slider
    set_action:
      - lambda: |-
          int v = ((int) (x + 0.5f) + 5) / 10 * 10;
          id(fajr_volume_level) = std::max(0, std::min(100, v));
          id(web_fajr_volume).publish_state(id(fajr_volume_level));
