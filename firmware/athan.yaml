# ---------------------------------------------------------------------------------------------------------------------
# Display (optional: a missing OLED marks itself failed and everything else runs)
# ---------------------------------------------------------------------------------------------------------------------
display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x64"
    address: 0x3C
    flip_x: ${oled_flip_x}
    flip_y: ${oled_flip_y}
    contrast: ${oled_contrast}
    update_interval: never     # drawn by the update_display script

font:
  - file: "gfonts://Roboto"
    id: font1
    size: 20
  - file: "gfonts://Roboto"
    id: font2
    size: 14
  - file: "gfonts://Roboto"
    id: font3
    size: 10   # AM/PM, the radio slot number next to the play mark, the menu's faded previews and captions

time:
  - platform: sntp
    id: sntp_time
    # Placeholder: the mosque's own zone comes from its yearly prayer file and replaces this at runtime.
    timezone: "PST8PDT,M3.2.0,M11.1.0"
    on_time_sync:
      - script.execute: update_display
    on_time:
      # Hourly tick at HH:00 inside the window [start, end) (start == end: all day)
      - minutes: 0
        seconds: 0
        then:
          - lambda: |-
              int h = id(sntp_time).now().hour;
              int s = id(htick_start_hour), e = id(htick_end_hour);
              bool in_window = (s == e) || (s < e ? (h >= s && h < e) : (h >= s || h < e));
              if (id(htick_enabled) && in_window && !id(athan_playing) && !id(athan_core).slot_playing() &&
                  id(athan_core).preview_list() < 0)
                id(play_tick).execute();
      - seconds: 0
        then:
          - script.execute: update_display

# ---------------------------------------------------------------------------------------------------------------------
# Globals. Persisted ones live in NVS keyed by id: adding or removing one does not disturb the others.
# ---------------------------------------------------------------------------------------------------------------------
globals:
  - {id: volume_level, type: int, initial_value: "50", restore_value: true}
  - {id: fajr_volume_level, type: int, initial_value: "-1", restore_value: true}
  - {id: athan_enabled, type: "bool[7]", initial_value: "{true, true, true, true, true, true, true}", restore_value: true}
  - {id: buttons_locked, type: bool, initial_value: "false", restore_value: true}
  - {id: clock_12h, type: bool, initial_value: "false", restore_value: true}
  - {id: htick_enabled, type: bool, initial_value: "true", restore_value: true}
  - {id: htick_start_hour, type: int, initial_value: "0", restore_value: true}
  - {id: htick_end_hour, type: int, initial_value: "0", restore_value: true}
  - {id: prefajr_enabled, type: bool, initial_value: "false", restore_value: true}
  - {id: selected_location_key, type: std::string, initial_value: '"davis"', restore_value: true, max_restore_data_length: 31}
  - {id: radio_subscribed, type: "bool[10]", initial_value: "{true, true, true, true, true, true, true, true, true, true}", restore_value: true}
  - {id: radio_slot, type: int, initial_value: "0", restore_value: true}
  # not persisted
  - {id: ui_last_activity, type: uint32_t, initial_value: "0"}  # last key press (the menu closes after 60 s)
  - {id: last_tone_ms, type: uint32_t, initial_value: "0"}      # tone rate limit (play_tone_click / play_tone_volume)
  - {id: output_muted, type: bool, initial_value: "false"}      # hard_mute holds the I2S output silent
  - {id: volume_pending, type: bool, initial_value: "false"}    # a volume change waiting for hard_mute to end
  - {id: toast_kind, type: int, initial_value: "0"}             # clock pop-up: 0 none, 1 volume, 2 Fajr volume, 3 relay
  - {id: fajr_sound_on, type: bool, initial_value: "false"}     # check_fajr_sound's answer
  - {id: menu_radio_resume, type: int, initial_value: "-1"}     # radio a menu preview replaced: back when the menu closes
  - {id: menu_download_slot, type: int, initial_value: "-1"}    # sound row whose download the menu shows under the item
  - {id: radio_resume, type: int, initial_value: "-1"}
  - {id: athan_playing, type: bool, initial_value: "false"}
  - {id: current_athan_prayer_index, type: int, initial_value: "0"}
  - {id: times_loaded, type: bool, initial_value: "false"}
  - {id: schedule_seen, type: uint32_t, initial_value: "0"}
  - {id: prayer_hours, type: "uint8_t[7]", initial_value: "{5, 6, 7, 12, 15, 17, 18}"}
  - {id: prayer_minutes, type: "uint8_t[7]", initial_value: "{0, 0, 0, 0, 0, 0, 0}"}
  - {id: next_prayer_index, type: int, initial_value: "0"}
  - {id: next_prayer_hour, type: int, initial_value: "0"}
  - {id: next_prayer_minute, type: int, initial_value: "0"}
  - {id: prefajr_next_hour, type: int, initial_value: "0"}
  - {id: prefajr_next_minute, type: int, initial_value: "0"}
  - {id: prefajr_triggered, type: bool, initial_value: "false"}
  - {id: prefajr_playing, type: bool, initial_value: "false"}   # the Pre-Fajr Tawashih sound is playing
  - {id: update_check_state, type: int, initial_value: "0"}   # 0 idle, 1 up to date, 2 available, 3 checking, 4 installing, 5 check failed

script:
  # ---------------- audio helpers ----------------
  - id: apply_volume
    mode: restart
    then:
      - lambda: |-
          id(volume_level) = std::max(0, std::min(100, id(volume_level)));
          // While hard_mute holds the output silent, a volume change would undo it (ESPHome's I2S speaker
          // recomputes its gain without checking mute): hard_mute applies it when it lets go.
          if (id(output_muted)) { id(volume_pending) = true; return; }
          // Owner volume (0-100 %) -> player volume. ESPHome's I2S speaker turns the player volume v into
          // -49 dB x (1 - v), so here 10 % = -${volume_range_db} dB rising evenly to 100 % = 0 dB; 0 % is silent.
          const int pct = id(volume_level);
          float db = -${volume_range_db}.0f * (100 - std::max(10, pct)) / 90.0f;
          float v = pct <= 0 ? 0.0f : std::max(0.0f, std::min(1.0f, 1.0f + db / 49.0f));
          id(player).make_call().set_volume(v).perform();
  - id: apply_fajr_volume
    mode: restart
    then:
      - lambda: |-
          if (id(output_muted)) { id(volume_pending) = true; return; }   // see apply_volume
          const int pct = id(fajr_volume_level) < 0 ? id(volume_level) : std::min(100, id(fajr_volume_level));
          float db = -${volume_range_db}.0f * (100 - std::max(10, pct)) / 90.0f;   // same curve as apply_volume
          float v = pct <= 0 ? 0.0f : std::max(0.0f, std::min(1.0f, 1.0f + db / 49.0f));
          id(player).make_call().set_volume(v).perform();
  # Whether a Fajr-volume sound plays now: the Fajr athan, the Pre-Fajr Tawashih, a Fajr or Tawashih preview.
  # The one test for "which volume" (sets fajr_sound_on at once): apply_playing_volume and the volume keys use it.
  - id: check_fajr_sound
    then:
      - lambda: |-
          const int pl = id(athan_core).preview_list();
          id(fajr_sound_on) = (id(athan_playing) && id(current_athan_prayer_index) == 0) || id(prefajr_playing) ||
                              pl == 1 || pl == 2;
  # The volume for whatever is playing now: Fajr volume for a Fajr sound (check_fajr_sound), the normal volume for
  # everything else, and when nothing plays. Every "back to normal" uses this, so stopping or leaving something
  # never drops a Fajr athan that is still playing to the normal volume.
  - id: apply_playing_volume
    mode: restart
    then:
      - lambda: |-
          id(check_fajr_sound).execute();
          if (id(fajr_sound_on)) id(apply_fajr_volume).execute();
          else id(apply_volume).execute();
  # Left/Right on the clock screen: the volume of what plays (the Fajr volume during a Fajr sound) by 10 %, shown
  # for 2 s. Never stops or pauses anything. The keys stop at 10 %: 0 % (silent) only from the menu or the web.
  - id: volume_step
    parameters:
      delta: int
    then:
      - lambda: |-
          id(check_fajr_sound).execute();
          const bool fajr = id(fajr_sound_on);
          int &level = fajr ? id(fajr_volume_level) : id(volume_level);
          const int v = level < 0 ? id(volume_level) : level;
          int nv = std::min(100, v + 10 * delta);
          if (delta < 0) nv = std::max(nv, std::min(v, 10));
          level = nv;
          id(apply_playing_volume).execute();
          id(show_toast).execute(fajr ? 2 : 1);
          // A short tone at the new level when nothing plays; over a sound, that sound is the feedback.
          if (!id(athan_playing) && !id(athan_core).slot_playing() && id(athan_core).preview_list() < 0 &&
              id(athan_core).radio_active() < 0)
            id(play_tone_volume).execute();
  # Pop-up over the clock for 2 s (toast_kind): the volume a Left/Right press set, the relay a Down press switched.
  - id: show_toast
    mode: restart
    parameters:
      kind: int
    then:
      - lambda: 'id(toast_kind) = kind; id(update_display).execute();'
      - delay: 2s
      - lambda: 'id(toast_kind) = 0; id(update_display).execute();'

  # Menu click and volume tone: at the normal volume when nothing else plays (over something, they share its volume).
  - id: play_tone_click
    mode: restart
    then:
      - if:
          condition:
            # At most one tone per 90 ms, however fast the presses or slider events come.
            lambda: 'return !id(athan_playing) && !id(athan_core).slot_playing() && millis() - id(last_tone_ms) >= 90;'
          then:
            - lambda: |-
                id(last_tone_ms) = millis();
                if (id(player).state == media_player::MEDIA_PLAYER_STATE_IDLE) id(apply_playing_volume).execute();
            - script.execute: amp_wake
            - lambda: 'id(athan_core).play_tone(id(tone_click));'   # waits for a sound before it to stop
  - id: play_tone_volume
    mode: restart
    then:
      - if:
          condition:
            # At most one tone per 90 ms, however fast the presses or slider events come.
            lambda: 'return !id(athan_playing) && !id(athan_core).slot_playing() && millis() - id(last_tone_ms) >= 90;'
          then:
            - lambda: |-
                id(last_tone_ms) = millis();
                if (id(player).state == media_player::MEDIA_PLAYER_STATE_IDLE) id(apply_playing_volume).execute();
            - script.execute: amp_wake
            - lambda: 'id(athan_core).play_tone(id(tone_volume));'
  # Fajr volume changed (menu or web slider): play the volume tone at the new Fajr level, then go back to the volume
  # of whatever is playing. While the Fajr athan or the Pre-Fajr Tawashih plays, it just takes the new level.
  - id: fajr_volume_feedback
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(athan_playing) || id(prefajr_playing) || id(athan_core).slot_playing();'
          then:
            - script.execute: apply_playing_volume
          else:
            - script.execute: apply_fajr_volume
            - if:
                condition:
                  lambda: 'return millis() - id(last_tone_ms) >= 90;'   # a dragged web slider sends many events
                then:
                  - lambda: 'id(last_tone_ms) = millis();'
                  - script.execute: amp_wake
                  - lambda: 'id(athan_core).play_tone(id(tone_volume));'
            - delay: 1500ms
            - script.execute: apply_playing_volume
  # Amplifier on ahead of a sound, with the idle timer running: a sound that never starts (a radio slot without a
  # link, an empty tawashih or tick slot) never changes the player's state, so on_idle would not fire and the amp
  # would stay on. on_play / on_announcement stop the timer once something really plays; on_idle restarts it.
  - id: amp_wake
    then:
      - output.turn_on: amp_enable
      - script.execute: amp_idle_off
  # Instant silence for a stop the owner asked for. Stopping a pipeline leaves up to 500 ms of audio in the I2S
  # speaker's buffer (plus the mixer's and resampler's), which used to keep playing after the press. The I2S
  # speaker applies its volume as audio leaves that buffer, so muting it here (directly, not through the media
  # player's command queue) is silent within its 50 ms of DMA, without the pop of cutting the amp mid-sound. The
  # pipelines stop behind it; once the buffer has drained (800 ms) the output is unmuted. The amp still goes off
  # 5 s after idle (amp_idle_off).
  - id: hard_mute
    mode: restart
    then:
      - lambda: |-
          id(output_muted) = true;
          id(i2s_speaker)->set_mute_state(true);
      - delay: 800ms
      - lambda: |-
          id(output_muted) = false;
          id(i2s_speaker)->set_mute_state(false);
          if (id(volume_pending)) {
            id(volume_pending) = false;
            id(apply_playing_volume).execute();
          }
  # Wi-Fi gone for 15 s (esp32_improv's wifi_timeout): Bluetooth on for the Improv setup, modem sleep back on first
  # (ESP-IDF needs it with Bluetooth). A drop that ends sooner never starts Bluetooth (wifi on_connect stops this).
  - id: ble_when_offline
    mode: restart
    then:
      - delay: 15s
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - lambda: 'id(athan_core).set_wifi_low_latency(false);'
            - ble.enable:
  # Amplifier off a few seconds after the player goes idle (no idle hiss).
  - id: amp_idle_off
    mode: restart
    then:
      - delay: 5s
      - if:
          condition:
            lambda: 'return id(player).state == media_player::MEDIA_PLAYER_STATE_IDLE;'
          then:
            - output.turn_off: amp_enable

  # Stop everything: athan, tawashih, tick, preview, radio. Buttons, the web Stop button, the lock.
  - id: silence_audio
    mode: restart
    then:
      - script.execute: hard_mute   # silent at once; everything below stops behind it
      - script.stop: make_athan
      - script.stop: run_prefajr
      - script.stop: play_tick
      - mixer_speaker.apply_ducking:   # a tick stopped while it lowered the radio would leave the next radio low
          id: media_mixer_input
          decibel_reduction: 0
          duration: 0.3s
      - lambda: |-
          id(menu_radio_resume) = -1;
          id(athan_core).stop_media();
          // Sends a STOP only when something plays there (this runs on every press while the buttons are locked),
          // and drops a sound still waiting to start.
          id(athan_core).stop_announcements();
          id(athan_playing) = false;
          id(prefajr_playing) = false;
          id(radio_resume) = -1;
          id(led_output).turn_off();
          id(apply_playing_volume).execute();
          id(update_display).execute();

  # Stop the athan, the tawashih, the tick or a preview, and leave the radio playing: Up, Down or Select on the clock
  # while one of them plays. Silent at once when no radio plays (with the radio on, the mute would cut it too; then
  # only the tick's buffered half second plays out).
  - id: stop_sound
    then:
      - lambda: 'if (id(athan_core).radio_active() < 0) id(hard_mute).execute();'
      - script.stop: make_athan
      - script.stop: run_prefajr
      - script.stop: play_tick
      - mixer_speaker.apply_ducking:   # a tick stopped while it lowered the radio
          id: media_mixer_input
          decibel_reduction: 0
          duration: 0.3s
      - lambda: |-
          id(athan_core).stop_preview();
          id(athan_core).stop_announcements();
          id(athan_playing) = false;
          id(prefajr_playing) = false;
          id(radio_resume) = -1;   // stopped on purpose: a radio the athan paused stays off
          id(led_output).turn_off();
          id(apply_playing_volume).execute();
          id(update_display).execute();

  # ---------------- keys ----------------
  # Every key of the 5-way switch (button = athan::MenuKey: 0 Up, 1 Down, 2 Left, 3 Right, 4 Select). What each
  # one does is in the binary_sensor section's header.
  - id: ui_key
    parameters:
      button: int
    then:
      - lambda: |-
          using athan::MenuKey;
          const MenuKey k = static_cast<MenuKey>(button);
          id(ui_last_activity) = millis();
          if (id(buttons_locked)) {
            id(silence_audio).execute();
            return;
          }
          auto &menu = id(athan_core).menu();
          if (menu.is_open()) {
            menu.key(k);
            // A click for rows and Select; Left/Right sound through their row (preview, volume tone or nothing).
            if (k == MenuKey::UP || k == MenuKey::DOWN || k == MenuKey::SELECT) id(play_tone_click).execute();
            id(update_display).execute();
            return;
          }
          // ---- clock screen ----
          if (k == MenuKey::LEFT || k == MenuKey::RIGHT) {
            id(volume_step).execute(k == MenuKey::RIGHT ? 1 : -1);
            return;
          }
          const bool sound_on = id(athan_playing) || id(prefajr_playing) || id(athan_core).slot_playing() ||
                                id(athan_core).preview_list() >= 0;
          if (sound_on) {
            id(stop_sound).execute();   // anything but the radio
            return;
          }
          if (k == MenuKey::UP) {
            if (id(athan_core).radio_active() >= 0) id(radio_off).execute();
            else id(radio_start).execute();   // the slot chosen last (radio_slot): its number shows by the play mark
          } else if (k == MenuKey::DOWN) {
            id(external_relay).toggle();
            id(show_toast).execute(3);
          } else {
            if (!id(sntp_time).now().is_valid() && id(improv_ble).is_active() &&
                !wifi::global_wifi_component->is_connected()) {
              id(update_display).execute();   // setup screen: this press only authorises the phone (esp32_improv)
              return;
            }
            if (!id(athan_core).catalog_ready()) id(athan_core).fetch_catalog();   // for the sound rows
            id(update_check_state) = 0;
            id(play_tone_click).execute();
            menu.open();
          }
          id(update_display).execute();

  # ---------------- device menu ----------------
  # The OLED menu's rows, top to bottom, each defined once (navigation: components/athan/menu.h, drawing:
  # menu_view.h). Kinds: CHOICE = Left/Right show the choices, Select takes the one shown (on the one in use: closes
  # the menu). VALUE = Left/Right change it at once, Select closes. ACTION = Select runs the item shown. Up past the
  # first row or Down past the last returns to the clock, as does 60 s without a press.
  - id: menu_setup
    then:
      - lambda: |-
          using athan::MenuRow;
          using athan::RowKind;
          auto &menu = id(athan_core).menu();
          // "06:00", or "6 AM" with the 12-hour clock
          auto hour_text = [](int h) -> std::string {
            char b[8];
            if (id(clock_12h)) snprintf(b, sizeof(b), "%d %s", (h % 12) ? h % 12 : 12, h < 12 ? "AM" : "PM");
            else snprintf(b, sizeof(b), "%02d:00", h);
            return b;
          };

          // Radio: the ten slots. Select plays the one shown (the check mark: what Up on the clock plays), or stops
          // it if it is the one playing, and returns to the clock.
          {
            MenuRow r;
            r.title = "Radio";
            r.kind = RowKind::ACTION;
            r.count = []() { return 10; };
            r.label = [](int i) -> std::string {
              if (!id(radio_subscribed)[i]) return std::to_string(i + 1) + " own link";
              const std::string nm = id(athan_core).station_name(i);
              return nm.empty() ? "Radio " + std::to_string(i + 1) : std::to_string(i + 1) + " " + nm;
            };
            r.active = []() { return std::max(0, std::min(9, id(radio_slot))); };
            r.playing = []() { return id(athan_core).radio_active(); };
            r.caption = [](int i) -> std::string {
              return (i < 0 || id(athan_core).station_available(i, id(radio_subscribed)[i])) ? "" : "No link here";
            };
            r.apply = [](int i) {
              if (!id(athan_core).station_available(i, id(radio_subscribed)[i])) return false;
              id(menu_radio_resume) = -1;   // chosen now: nothing to bring back when the menu closes
              if (id(athan_core).radio_active() == i) {
                id(radio_off).execute();
              } else {
                id(radio_slot) = i;
                id(radio_start).execute();
              }
              return true;
            };
            menu.add_row(std::move(r));
          }

          // Sound rows: "Off" (tick only), "Custom" (an uploaded sound), then the suggested list. They open on the
          // sound in use; a pause on an item plays a preview (from flash for the stored one). Select on another
          // entry downloads it (its progress shows under it, the check mark moves when it is stored).
          auto sound_row = [](const char *title, int slot) {
            const bool off = slot == 3;
            auto pos_of = [=](int item) {
              for (int p = 0; p < id(athan_core).menu_size(slot, off); p++)
                if (id(athan_core).menu_item(slot, off, p) == item) return p;
              return -1;
            };
            MenuRow r;
            r.title = title;
            r.count = [=]() { return id(athan_core).menu_size(slot, off); };
            r.id_at = [=](int i) { return id(athan_core).menu_item(slot, off, i); };
            r.find = pos_of;
            r.label = [=](int i) -> std::string {
              const int it = id(athan_core).menu_item(slot, off, i);
              if (it == athan::MENU_OFF) return "Off";
              if (it == athan::MENU_CUSTOM) return "Custom";
              return id(athan_core).catalog_name(slot, it);
            };
            r.active = [=]() {
              if (off && !id(htick_enabled)) return pos_of(athan::MENU_OFF);
              return pos_of(id(athan_core).has_custom(slot) ? athan::MENU_CUSTOM : id(athan_core).selected_entry(slot));
            };
            r.caption = [=](int i) -> std::string {
              if (!id(athan_core).catalog_ready())
                return wifi::global_wifi_component->is_connected() ? "Loading list..." : "No internet";
              if (i < 0) return "List is empty";
              if (id(menu_download_slot) == slot) return id(athan_core).sound_status();   // what Select started
              if (id(athan_core).menu_item(slot, off, i) == athan::MENU_CUSTOM) return id(athan_core).slot_label(slot);
              return "";
            };
            r.show = [=](int i, bool entered) {
              if (id(athan_playing) || id(prefajr_playing)) return;   // never preview over the athan
              const int it = id(athan_core).menu_item(slot, off, i);
              if (it < 0 && it != athan::MENU_CUSTOM) {
                id(athan_core).stop_preview();   // "Off"
                return;
              }
              const int radio = id(athan_core).radio_active();
              if (radio >= 0) {
                if (entered) return;   // scrolling past with the radio on: no preview cuts it
                id(menu_radio_resume) = radio;   // a preview replaces the radio; it is back when the menu closes
              }
              // After a pause on the item: skipping through items or rows opens one stream, not one per press.
              id(athan_core).request_preview(slot, it, entered ? 800 : 500);
            };
            r.apply = [=](int i) {
              const int it = id(athan_core).menu_item(slot, off, i);
              id(athan_core).stop_preview();
              id(apply_playing_volume).execute();
              if (it == athan::MENU_OFF) {
                id(htick_enabled) = false;
                return false;
              }
              if (off) id(htick_enabled) = true;
              if (it >= 0) {
                id(menu_download_slot) = slot;
                id(athan_core).download_from_catalog(slot, it);
              }
              return false;   // stays: the check mark shows when it is in use
            };
            r.leave = []() {
              id(athan_core).stop_preview();
              id(apply_playing_volume).execute();
            };
            return r;
          };
          menu.add_row(sound_row("Athan", 0));
          menu.add_row(sound_row("Fajr Athan", 1));
          menu.add_row(sound_row("Tawashih", 2));

          {
            MenuRow r;
            r.title = "Pre-Fajr";
            r.count = []() { return 2; };
            r.label = [](int i) { return std::string(i ? "On" : "Off"); };
            r.active = []() { return id(prefajr_enabled) ? 1 : 0; };
            r.caption = [](int) { return std::string("Tawashih ${prefajr_offset_min} min before Fajr"); };
            r.apply = [](int i) {
              id(prefajr_enabled) = i == 1;
              ESP_LOGI("ui", "Pre-Fajr Tawashih %s", i ? "ON" : "OFF");
              return false;
            };
            menu.add_row(std::move(r));
          }

          menu.add_row(sound_row("Hourly Tick", 3));

          // Tick From / Tick Until: the hourly tick's window [from, until), at once; equal = all day.
          for (int w = 0; w < 2; w++) {
            MenuRow r;
            r.title = w == 0 ? "Tick From" : "Tick Until";
            r.kind = RowKind::VALUE;
            r.count = []() { return 24; };
            r.label = hour_text;
            r.active = [w]() { return w == 0 ? id(htick_start_hour) : id(htick_end_hour); };
            r.caption = [hour_text](int) -> std::string {
              const int a = id(htick_start_hour), b = id(htick_end_hour);
              if (a == b) return "All day";
              return hour_text(a) + " to " + hour_text(b) + " (" + std::to_string((b - a + 24) % 24) + " h)";
            };
            r.apply = [w](int i) {
              (w == 0 ? id(htick_start_hour) : id(htick_end_hour)) = i;
              return false;
            };
            menu.add_row(std::move(r));
          }

          // Athan On/Off: Select switches the prayer shown.
          {
            static const char *const names[5] = {"Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"};
            static const int prayer_of[5] = {0, 3, 4, 5, 6};
            MenuRow r;
            r.title = "Athan On/Off";
            r.kind = RowKind::ACTION;
            r.count = []() { return 5; };
            r.label = [](int i) { return std::string(names[i]) + (id(athan_enabled)[prayer_of[i]] ? ": On" : ": Off"); };
            r.apply = [](int i) {
              id(athan_enabled)[prayer_of[i]] = !id(athan_enabled)[prayer_of[i]];
              return false;
            };
            menu.add_row(std::move(r));
          }

          // Volume, Fajr Volume: 0-100 % in steps of 10, at once (with a tone at the new level when nothing plays).
          {
            MenuRow r;
            r.title = "Volume";
            r.kind = RowKind::VALUE;
            r.wrap = false;
            r.count = []() { return 11; };
            r.label = [](int i) { return std::to_string(i * 10) + "%"; };
            r.active = []() { return std::max(0, std::min(10, (id(volume_level) + 5) / 10)); };
            r.apply = [](int i) {
              id(volume_level) = i * 10;
              id(apply_playing_volume).execute();   // a Fajr athan playing keeps the Fajr volume
              id(play_tone_volume).execute();
              return false;
            };
            menu.add_row(std::move(r));
          }
          {
            MenuRow r;
            r.title = "Fajr Volume";
            r.kind = RowKind::VALUE;
            r.wrap = false;
            r.count = []() { return 11; };
            r.label = [](int i) { return std::to_string(i * 10) + "%"; };
            r.active = []() {
              const int v = id(fajr_volume_level) < 0 ? id(volume_level) : id(fajr_volume_level);
              return std::max(0, std::min(10, (v + 5) / 10));
            };
            r.apply = [](int i) {
              id(fajr_volume_level) = i * 10;
              id(fajr_volume_feedback).execute();
              return false;
            };
            menu.add_row(std::move(r));
          }

          {
            MenuRow r;
            r.title = "Location";
            r.count = []() { return (int) id(web_location_select).size(); };
            r.label = [](int i) -> std::string {
              auto k = id(web_location_select).at(i);
              return k.has_value() ? std::string(k.value()) : std::string("?");
            };
            r.active = []() {
              for (int i = 0; i < (int) id(web_location_select).size(); i++) {
                auto k = id(web_location_select).at(i);
                if (k.has_value() && std::string(k.value()) == id(selected_location_key)) return i;
              }
              return -1;
            };
            r.apply = [](int i) {
              auto k = id(web_location_select).at(i);
              if (k.has_value()) {
                id(selected_location_key) = std::string(k.value());
                id(athan_core).set_location(id(selected_location_key));
              }
              return false;
            };
            menu.add_row(std::move(r));
          }

          {
            MenuRow r;
            r.title = "Clock";
            r.count = []() { return 2; };
            r.label = [](int i) { return std::string(i ? "12-hour" : "24-hour"); };
            r.active = []() { return id(clock_12h) ? 1 : 0; };
            r.apply = [](int i) {
              id(clock_12h) = i == 1;
              return false;
            };
            menu.add_row(std::move(r));
          }

          // Update: Select checks the GitHub Release, then installs a newer version.
          {
            MenuRow r;
            r.title = "Update";
            r.kind = RowKind::ACTION;
            r.count = []() { return 1; };
            r.label = [](int) -> std::string {
              switch (id(update_check_state)) {
                case 2: return "Install " + id(fw_update).update_info.latest_version;
                case 3: return "Checking...";
                case 4: return "Installing...";
                default: return "Check now";
              }
            };
            r.caption = [](int) -> std::string {
              switch (id(update_check_state)) {
                case 1: return "V${project_version} is the latest";
                case 5: return "Check failed (offline?)";
                default: return "Installed: V${project_version}";
              }
            };
            r.apply = [](int) {
              if (id(update_check_state) == 2) {
                id(update_check_state) = 4;
                id(fw_update).perform(false);
              } else if (id(update_check_state) != 3 && id(update_check_state) != 4) {
                id(check_update).execute();
              }
              return false;
            };
            menu.add_row(std::move(r));
          }

          {
            MenuRow r;
            r.title = "Lock Buttons";
            r.kind = RowKind::ACTION;
            r.count = []() { return 1; };
            r.label = [](int) { return std::string("Lock now"); };
            r.caption = [](int) { return std::string("Unlock: hold arrow at boot"); };
            r.apply = [](int) {
              id(buttons_locked) = true;
              return true;
            };
            menu.add_row(std::move(r));
          }

          // Info: Left/Right page through it, Select closes.
          {
            MenuRow r;
            r.title = "Info";
            r.kind = RowKind::ACTION;
            r.count = []() { return 3; };
            r.label = [](int i) -> std::string {
              if (i == 1) return "athan.local";
              if (i == 2) return "V${project_version}";
              auto ips = network::get_ip_addresses();
              char ip[48] = "No Wi-Fi";
              if (wifi::global_wifi_component->is_connected() && ips[0].is_set()) ips[0].str_to(ip);
              return ip;
            };
            r.caption = [](int i) -> std::string {
              static const char *const what[3] = {"IP address", "Web page", "Firmware"};
              return (i >= 0 && i < 3) ? what[i] : "";
            };
            r.apply = [](int) { return true; };
            menu.add_row(std::move(r));
          }

          menu.set_on_close([]() {
            id(menu_download_slot) = -1;
            id(apply_playing_volume).execute();
            // A preview replaced the radio: it comes back.
            const int r = id(menu_radio_resume);
            id(menu_radio_resume) = -1;
            if (r >= 0 && id(athan_core).radio_active() < 0 && !id(athan_playing) && !id(prefajr_playing)) {
              id(radio_slot) = r;
              id(radio_start).execute();
            }
          });

  # Radio off on purpose (Up on the clock, the menu, the web Stop Radio): silent at once unless a stored sound plays
  # (the mute would cut it too), and no radio comes back after an athan or a menu preview.
  - id: radio_off
    then:
      - lambda: |-
          id(radio_resume) = -1;
          id(menu_radio_resume) = -1;
          if (id(athan_core).radio_active() >= 0 && !id(athan_core).slot_playing()) id(hard_mute).execute();
          id(athan_core).radio_stop();
          id(update_display).execute();

  # ---------------- radio ----------------
  - id: radio_start
    mode: restart
    then:
      - lambda: |-
          int s = std::max(0, std::min(9, id(radio_slot)));
          if (id(athan_playing) || id(prefajr_playing)) {
            id(radio_resume) = s;   // started when the athan or the tawashih ends, at the normal volume
            return;
          }
          id(apply_volume).execute();
          id(amp_wake).execute();
          id(athan_core).radio_play(s, id(radio_subscribed)[s]);
          id(update_display).execute();

  # ---------------- stored sounds ----------------
  # Athan (Fajr file at Fajr). Pauses the radio and resumes the same slot afterwards.
  - id: make_athan
    mode: single
    then:
      - lambda: |-
          id(athan_playing) = true;
          id(athan_core).menu().close();   // the athan screen shows, and Up/Down/Select stop it
          int r = id(athan_core).radio_active();
          id(radio_resume) = r;
          if (r >= 0) id(athan_core).radio_stop();
          else id(athan_core).stop_media();   // a preview, if any
          id(amp_wake).execute();
          id(led_output).turn_on();
      - if:
          condition:
            lambda: 'return id(current_athan_prayer_index) == 0;'
          then:
            - script.execute: apply_fajr_volume
          else:
            - script.execute: apply_volume
      - delay: 100ms
      - if:
          condition:
            lambda: 'return id(athan_core).play_slot(id(current_athan_prayer_index) == 0 ? 1 : 0);'
          else:
            # Empty slot (new device offline, or a power cut while writing): mark the time with three tones.
            - repeat:
                count: 3
                then:
                  - lambda: 'id(athan_core).play_tone(id(tone_click));'
                  - delay: 1500ms
      - script.execute: update_display
      - wait_until:
          condition:
            lambda: 'return !id(athan_core).slot_playing() && id(player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING;'
          timeout: 7min
      - lambda: |-
          id(athan_playing) = false;
          id(led_output).turn_off();
          id(apply_playing_volume).execute();
          int r = id(radio_resume);
          id(radio_resume) = -1;
          if (r >= 0) {
            id(radio_slot) = r;
            id(radio_start).execute();
          }
          id(update_display).execute();

  # Pre-Fajr Tawashih: relay on, tawashih at the Fajr volume, relay off ${prefajr_relay_min} min after it ends.
  - id: run_prefajr
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("prefajr", "Pre-Fajr Tawashih");
          id(athan_core).menu().close();   // Up/Down/Select on the clock stop it
          int r = id(athan_core).radio_active();
          id(radio_resume) = r;
          if (r >= 0) id(athan_core).radio_stop();
          id(amp_wake).execute();
      - switch.turn_on: external_relay
      # Until the tawashih ends, the relay's timer allows for the longest one (the 7 min wait below): a tawashih
      # stopped by a key or the web Stop (which stops this script) must not leave the relay on.
      - lambda: 'id(prefajr_relay_off).execute((${prefajr_relay_min} + 7) * 60000);'
      - lambda: 'id(prefajr_playing) = true;'
      - script.execute: apply_fajr_volume
      - delay: 100ms
      - lambda: |-
          if (!id(athan_core).play_slot(2)) ESP_LOGW("prefajr", "No tawashih selected");
      - wait_until:
          condition:
            lambda: 'return !id(athan_core).slot_playing() && id(player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING;'
          timeout: 7min
      - lambda: |-
          id(prefajr_playing) = false;
          id(apply_playing_volume).execute();
          int r = id(radio_resume);
          id(radio_resume) = -1;
          if (r >= 0 && !id(athan_playing)) { id(radio_slot) = r; id(radio_start).execute(); }
          id(prefajr_relay_off).execute(${prefajr_relay_min} * 60000 - 7000);
  # The Pre-Fajr relay's own timer (restart: the last call counts), apart from run_prefajr so that stopping that
  # script never leaves the relay on.
  - id: prefajr_relay_off
    mode: restart
    parameters:
      after_ms: int
    then:
      - delay: !lambda 'return after_ms;'
      - switch.turn_off: external_relay

  # Hourly tick: plays over the radio with the radio lowered (mixer ducking).
  - id: play_tick
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(athan_core).radio_active() >= 0;'
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixer_input
                decibel_reduction: 20
                duration: 0.3s
      - lambda: |-
          id(apply_volume).execute();
          id(amp_wake).execute();
          if (!id(athan_core).play_slot(3)) ESP_LOGW("tick", "No tick selected");
      - wait_until:
          condition:
            lambda: 'return !id(athan_core).slot_playing();'
          timeout: 70s
      - mixer_speaker.apply_ducking:
          id: media_mixer_input
          decibel_reduction: 0
          duration: 0.5s

  # ---------------- firmware update (GitHub Releases) ----------------
  - id: check_update
    mode: single
    then:
      - lambda: 'id(update_check_state) = 3; id(update_display).execute();'
      - update.check: fw_update
      - delay: 8s
      - lambda: |-
          // A failed check (no release published yet, no internet) leaves the state UNKNOWN: not "up to date".
          if (id(fw_update).status_has_error() || id(fw_update).state == update::UPDATE_STATE_UNKNOWN)
            id(update_check_state) = 5;
          else
            id(update_check_state) = (id(fw_update).state == update::UPDATE_STATE_AVAILABLE) ? 2 : 1;
          id(update_display).execute();

  # ---------------- schedule ----------------
  # Today's times from the athan component (stored yearly file, or last year's as a stand-in).
  - id: load_today
    mode: restart
    then:
      - lambda: |-
          uint8_t h[7], m[7];
          if (!id(athan_core).today_times(h, m)) {
            id(times_loaded) = false;
            return;
          }
          for (int i = 0; i < 7; i++) { id(prayer_hours)[i] = h[i]; id(prayer_minutes)[i] = m[i]; }
          id(times_loaded) = true;
          ESP_LOGI("prayer", "Today: Fajr %02d:%02d Sunrise %02d:%02d Doha %02d:%02d Dhuhr %02d:%02d Asr %02d:%02d Maghrib %02d:%02d Isha %02d:%02d%s",
                   h[0], m[0], h[1], m[1], h[2], m[2], h[3], m[3], h[4], m[4], h[5], m[5], h[6], m[6],
                   id(athan_core).times_standin() ? " (stand-in from last year)" : "");
          id(compute_coming_prayer).execute();
          id(update_display).execute();

  # Next prayer at or after now (equal minute counts: used after a reload, the athan script is mode: single).
  - id: compute_coming_prayer
    mode: restart
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid() || !id(times_loaded)) return;
          int cur = now.hour * 60 + now.minute;
          int idx = 0;   // all passed -> tomorrow's Fajr
          for (int i = 0; i < 7; i++) {
            if (id(prayer_hours)[i] * 60 + id(prayer_minutes)[i] >= cur) { idx = i; break; }
          }
          id(next_prayer_index) = idx;
          id(next_prayer_hour) = id(prayer_hours)[idx];
          id(next_prayer_minute) = id(prayer_minutes)[idx];
          if (idx == 0) {
            int t = id(next_prayer_hour) * 60 + id(next_prayer_minute) - ${prefajr_offset_min};
            if (t < 0) t += 1440;
            id(prefajr_next_hour) = t / 60;
            id(prefajr_next_minute) = t % 60;
            id(prefajr_triggered) = false;
          }

  # After a prayer time is reached: the next one strictly later.
  - id: jump_to_next_prayer
    mode: restart
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid() || !id(times_loaded)) return;
          int cur = now.hour * 60 + now.minute;
          int idx = 0;
          for (int i = 0; i < 7; i++) {
            if (id(prayer_hours)[i] * 60 + id(prayer_minutes)[i] > cur) { idx = i; break; }
          }
          id(next_prayer_index) = idx;
          id(next_prayer_hour) = id(prayer_hours)[idx];
          id(next_prayer_minute) = id(prayer_minutes)[idx];
          if (idx == 0) {
            int t = id(next_prayer_hour) * 60 + id(next_prayer_minute) - ${prefajr_offset_min};
            if (t < 0) t += 1440;
            id(prefajr_next_hour) = t / 60;
            id(prefajr_next_minute) = t % 60;
            id(prefajr_triggered) = false;
          }

  # ---------------- web / Home Assistant entities (publish on change) ----------------
  - id: sync_web_state
    mode: restart
    then:
      - lambda: |-
          // Runs every second: values are formatted into buf and compared in place, so an unchanged one (nearly all
          // of them, nearly always) costs no heap allocation. Only a change is published.
          char buf[320];
          auto pub = [](text_sensor::TextSensor *t, const char *s) { if (t->state != s) t->publish_state(s); };
          {
            auto loc = id(selected_location_key);
            if (id(web_location_select).current_option() != loc) {
              for (size_t i = 0; i < id(web_location_select).size(); i++)
                if (std::string(id(web_location_select).at(i).value()) == loc) id(web_location_select).publish_state(loc);
            }
          }
          {
            // Radio Station options: "Radio 1 Cairo Quran" from the station list in memory, "Radio 4 (own link)" for
            // a slot with its own link, plain "Radio N" until the list has loaded. The labels live in fixed
            // buffers the select points at (set once); their text is rewritten in place only when it changes.
            static char labels[10][40];
            static bool attached = false;
            bool changed = !attached;
            for (int k = 0; k < 10; k++) {
              char want[40];
              std::string nm = id(athan_core).station_name(k);
              if (!id(radio_subscribed)[k]) snprintf(want, sizeof(want), "Radio %d (own link)", k + 1);
              else if (!nm.empty()) snprintf(want, sizeof(want), "Radio %d %s", k + 1, nm.c_str());
              else snprintf(want, sizeof(want), "Radio %d", k + 1);
              if (strcmp(want, labels[k]) != 0) { memcpy(labels[k], want, sizeof(want)); changed = true; }
            }
            if (!attached) {
              id(web_radio_slot).traits.set_options({labels[0], labels[1], labels[2], labels[3], labels[4],
                                                     labels[5], labels[6], labels[7], labels[8], labels[9]});
              attached = true;
            }
            // By index: the labels change, the slot does not. A changed label is republished for the web page.
            const size_t slot = (size_t) std::max(0, std::min(9, id(radio_slot)));
            auto cur = id(web_radio_slot).active_index();
            if (changed || !id(web_radio_slot).has_state() || !cur.has_value() || cur.value() != slot)
              id(web_radio_slot).publish_state(slot);
          }
          if (!id(web_volume).has_state() || (int) id(web_volume).state != id(volume_level)) id(web_volume).publish_state(id(volume_level));
          if (id(fajr_volume_level) >= 0 && (!id(web_fajr_volume).has_state() || (int) id(web_fajr_volume).state != id(fajr_volume_level))) id(web_fajr_volume).publish_state(id(fajr_volume_level));
          if (!id(web_htick_start).has_state() || (int) id(web_htick_start).state != id(htick_start_hour)) id(web_htick_start).publish_state(id(htick_start_hour));
          if (!id(web_htick_end).has_state() || (int) id(web_htick_end).state != id(htick_end_hour)) id(web_htick_end).publish_state(id(htick_end_hour));
          auto fmt_time = [&](char *out, size_t n, int h, int m) {
            if (id(clock_12h)) {
              int h12 = h % 12; if (h12 == 0) h12 = 12;
              snprintf(out, n, "%d:%02d %s", h12, m, (h < 12) ? "AM" : "PM");
            } else {
              snprintf(out, n, "%02d:%02d", h, m);
            }
          };
          char t1[12], t2[12];
          {
            int s = id(htick_start_hour), e = id(htick_end_hour);
            if (!id(htick_enabled)) snprintf(buf, sizeof(buf), "tick off");
            else if (s == e) snprintf(buf, sizeof(buf), "all day");
            else { fmt_time(t1, sizeof(t1), s, 0); fmt_time(t2, sizeof(t2), e, 0); snprintf(buf, sizeof(buf), "%s to %s (%d h)", t1, t2, (e - s + 24) % 24); }
            pub(id(web_htick_window), buf);
          }
          static const char *names[7] = {"Fajr", "Sunrise", "Doha", "Dhuhr", "Asr", "Maghrib", "Isha"};
          auto now = id(sntp_time).now();
          if (now.is_valid() && id(times_loaded)) {
            int npi = id(next_prayer_index);
            int total = id(next_prayer_hour) * 60 + id(next_prayer_minute) - (now.hour * 60 + now.minute);
            if (total < 0) total += 1440;
            bool muted = (npi != 1 && npi != 2) && !id(athan_enabled)[npi];
            fmt_time(t1, sizeof(t1), id(next_prayer_hour), id(next_prayer_minute));
            snprintf(buf, sizeof(buf), "%s %s (in %dh %02dm)%s%s", names[npi], t1, total / 60, total % 60,
                     muted ? " [athan off]" : "", id(athan_core).times_standin() ? " [estimated]" : "");
            pub(id(web_next_prayer), buf);
            int pos = 0;
            for (int i = 0; i < 7 && pos < (int) sizeof(buf) - 1; i++) {
              fmt_time(t1, sizeof(t1), id(prayer_hours)[i], id(prayer_minutes)[i]);
              pos += snprintf(buf + pos, sizeof(buf) - pos, "%s%s %s", i ? ", " : "", names[i], t1);
            }
            pub(id(web_today_times), buf);
          } else {
            pub(id(web_next_prayer), "waiting for the clock and prayer data");
            pub(id(web_today_times), "not loaded yet");
          }
          {
            static const char *slot_names[4] = {"Athan", "Fajr", "Tawashih", "Tick"};
            int pos = 0;
            for (int i = 0; i < 4 && pos < (int) sizeof(buf) - 1; i++) {
              const std::string l = id(athan_core).slot_label(i);
              pos += snprintf(buf + pos, sizeof(buf) - pos, "%s%s: %s", i ? "; " : "", slot_names[i],
                              l.empty() ? "none" : l.c_str());
            }
            pub(id(web_sounds), buf);
          }
          {
            static uint32_t drops_seen = UINT32_MAX;   // rebuilt only after a drop
            const uint32_t drops = id(athan_core).wifi_drop_count();
            if (drops != drops_seen) {
              drops_seen = drops;
              pub(id(web_wifi_drops), id(athan_core).wifi_drops_text().c_str());
            }
          }
          pub(id(web_sound_status), id(athan_core).sound_status().c_str());
          pub(id(web_radio_status), id(athan_core).radio_status().c_str());
          pub(id(web_prayer_data), id(athan_core).prayer_status().c_str());
          {
            auto ips = network::get_ip_addresses();
            char ip[48] = "";
            if (ips[0].is_set()) ips[0].str_to(ip);
            snprintf(buf, sizeof(buf), "http://%s/audio", ip[0] ? ip : "athan.local");
            pub(id(web_audio_page), buf);
          }
          {
            // This build's version (project_version) and what the last check of the GitHub Release said.
            const char *latest = id(fw_update).update_info.latest_version.c_str();
            const auto st = id(fw_update).state;
            if (st == update::UPDATE_STATE_INSTALLING) snprintf(buf, sizeof(buf), "${project_version} (installing %s)", latest);
            else if (id(fw_update).status_has_error()) snprintf(buf, sizeof(buf), "${project_version} (no release found on GitHub, or no internet)");
            else if (st == update::UPDATE_STATE_AVAILABLE) snprintf(buf, sizeof(buf), "${project_version} (%s available)", latest);
            else if (st == update::UPDATE_STATE_NO_UPDATE) snprintf(buf, sizeof(buf), "${project_version} (latest)");
            else snprintf(buf, sizeof(buf), "${project_version} (not checked yet)");
            pub(id(web_fw_version), buf);
          }

  # ---------------- OLED ----------------
  # Redraws the OLED. A draw blocks the main loop for about 23 ms (1 KB over I2C at 400 kHz), and one key press
  # often asks for several (a stop, a pop-up, the key itself). The delay of 0 moves the draw to the next pass of the
  # loop and mode: restart folds every request made before it into that one draw.
  - id: update_display
    mode: restart
    then:
      - delay: 0ms
      - lambda: |-
          // Never touch the OLED before its setup() allocated the buffer, or when it failed (see CLAUDE.md).
          if (!id(oled).is_ready()) return;
          auto &d = *id(oled);
          d.clear();
          auto now = id(sntp_time).now();
          const bool wifi_ok = wifi::global_wifi_component->is_connected();

          // The menu draws itself (components/athan/menu_view.h).
          auto &menu = id(athan_core).menu();
          if (menu.is_open()) {
            athan::draw_menu(d, menu, {id(font1), id(font2), id(font3)});
            d.display();
            return;
          }

          static const char *names[7] = {"Fajr", "Sunrise", "Doha", "Dhuhr", "Asr", "Maghrib", "Isha"};
          static const char *months[12] = {"Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"};

          auto time_width = [&](int h, int m) -> int {
            char b[8]; int x1, y1, w = 0, w2 = 0, hh;
            if (id(clock_12h)) {
              int h12 = h % 12; if (h12 == 0) h12 = 12;
              snprintf(b, sizeof(b), "%d:%02d", h12, m);
              d.get_text_bounds(0, 0, b, id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &w, &hh);
              d.get_text_bounds(0, 0, (h < 12) ? "AM" : "PM", id(font3), display::TextAlign::TOP_LEFT, &x1, &y1, &w2, &hh);
              return w + 1 + w2;
            }
            snprintf(b, sizeof(b), "%02d:%02d", h, m);
            d.get_text_bounds(0, 0, b, id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &w, &hh);
            return w;
          };
          auto draw_time = [&](int x, int y, int h, int m) -> int {
            char b[8]; int x1, y1, w, hh;
            if (id(clock_12h)) {
              int h12 = h % 12; if (h12 == 0) h12 = 12;
              snprintf(b, sizeof(b), "%d:%02d", h12, m);
              d.print(x, y, id(font1), b);
              d.get_text_bounds(x, y, b, id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &w, &hh);
              x += w + 1;
              const char *ap = (h < 12) ? "AM" : "PM";
              d.print(x, y + 9, id(font3), ap);
              d.get_text_bounds(x, y, ap, id(font3), display::TextAlign::TOP_LEFT, &x1, &y1, &w, &hh);
              return x + w;
            }
            snprintf(b, sizeof(b), "%02d:%02d", h, m);
            d.print(x, y, id(font1), b);
            d.get_text_bounds(x, y, b, id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &w, &hh);
            return x + w;
          };
          auto draw_lock = [&](int x, int y) { d.circle(x + 3, y + 2, 2); d.filled_rectangle(x, y + 4, 7, 5); };
          // Radio playing: the play mark and the slot number (1-10), right-aligned before the lock (and the
          // no-Wi-Fi mark), so "10" fits too.
          auto draw_radio = [&]() {
            const int r = id(athan_core).radio_active();
            if (r < 0) return;
            char num[4];
            snprintf(num, sizeof(num), "%d", r + 1);
            int x1, y1, wn, hn;
            d.get_text_bounds(0, 0, num, id(font3), display::TextAlign::TOP_LEFT, &x1, &y1, &wn, &hn);
            const int right = wifi_ok ? (id(buttons_locked) ? 119 : 127) : (id(buttons_locked) ? 94 : 103);
            const int x = right - (7 + 1 + wn) + 1;   // mark 7 px wide, 1 px gap, then the number
            d.filled_triangle(x, 55, x, 63, x + 6, 59);
            d.print(x + 8, 63, id(font3), display::TextAlign::BASELINE_LEFT, num);
          };
          auto draw_nowifi = [&]() { d.circle(116, 52, 10); d.print(107, 41, id(font1), "W"); d.line(105, 43, 125, 63); };
          char line[48];

          // Pop-up over the clock for 2 s after Left/Right (volume) or Down (relay): script show_toast.
          auto draw_toast = [&]() {
            const int k = id(toast_kind);
            if (k == 0) return;
            d.filled_rectangle(14, 11, 100, 42, display::COLOR_OFF);
            d.rectangle(14, 11, 100, 42);
            if (k == 3) {
              d.print(64, 27, id(font2), display::TextAlign::BASELINE_CENTER, "Relay");
              d.print(64, 47, id(font1), display::TextAlign::BASELINE_CENTER, id(external_relay).state ? "ON" : "OFF");
              return;
            }
            const int pct = std::max(0, std::min(100, k == 2 ? id(fajr_volume_level) : id(volume_level)));
            d.print(64, 22, id(font3), display::TextAlign::BASELINE_CENTER, k == 2 ? "Fajr volume" : "Volume");
            snprintf(line, sizeof(line), "%d%%", pct);
            d.print(64, 41, id(font1), display::TextAlign::BASELINE_CENTER, line);
            d.rectangle(22, 45, 84, 4);
            d.filled_rectangle(22, 45, 84 * pct / 100, 4);
          };
          auto finish = [&]() {
            draw_toast();
            d.display();
          };

          // ---- normal screen ----
          const bool time_ok = now.is_valid();
          // Wi-Fi setup open (Bluetooth or hotspot) and no clock yet: say how to connect (README "Wi-Fi setup").
          // The hotspot's name is too wide for the screen; it is in the README.
          if (!time_ok && !wifi_ok && (id(improv_ble).is_active() || wifi::global_wifi_component->is_ap_active())) {
            d.print(0, 0, id(font2), "Wi-Fi setup:");
            const auto st = id(improv_ble).get_improv_state();
            const char *bt = !id(improv_ble).is_active() ? "BT: starting.."
                           : st == improv::STATE_AWAITING_AUTHORIZATION ? "BT: press Select"
                           : st == improv::STATE_AUTHORIZED ? "BT: allowed"
                           : st == improv::STATE_PROVISIONING ? "BT: joining.." : "BT: on";
            d.print(0, 20, id(font2), bt);
            d.print(0, 40, id(font2), wifi::global_wifi_component->is_ap_active() ? "Hotspot: on" : "Hotspot: soon");
            finish();
            return;
          }
          if (time_ok && id(athan_playing)) {
            d.print(0, 0, id(font1), "Athan Time:");
            snprintf(line, sizeof(line), "%s prayer", names[id(current_athan_prayer_index)]);
            d.print(0, 22, id(font1), line);
            int x1, y1, wd, hd;
            snprintf(line, sizeof(line), "%02d%s", now.day_of_month, months[now.month - 1]);
            d.get_text_bounds(0, 44, line, id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &wd, &hd);
            int gap = std::max(2, std::min(10, 128 - time_width(now.hour, now.minute) - wd));
            int x = draw_time(0, 44, now.hour, now.minute);
            d.print(x + gap, 44, id(font1), line);
            finish();
            return;
          }
          // As on V2: until the clock is set the three rows are drawn and struck through (lines at y 11, 33, 55
          // cross rows 1-3); until today's prayer times are loaded, rows 2 and 3 are. Unknown values show as dashes.
          const bool times_ok = time_ok && id(times_loaded);
          if (!time_ok) d.line(0, 11, 127, 11);
          if (!times_ok) { d.line(0, 33, 127, 33); d.line(0, 55, 127, 55); }
          // Line 1: time and date
          {
            int x1, y1, wd, hd;
            if (time_ok) {
              snprintf(line, sizeof(line), "%02d%s", now.day_of_month, months[now.month - 1]);
              d.get_text_bounds(0, 0, line, id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &wd, &hd);
              int gap = std::max(2, std::min(10, 128 - time_width(now.hour, now.minute) - wd));
              int x = draw_time(0, 0, now.hour, now.minute);
              d.print(x + gap, 0, id(font1), line);
            } else {
              d.print(0, 0, id(font1), "--:--");
              d.get_text_bounds(0, 0, "--:--", id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &wd, &hd);
              d.print(wd + 10, 0, id(font1), "-----");
            }
          }
          if (!times_ok) {
            d.print(0, 22, id(font1), "Next --:--");
            d.print(0, 44, id(font1), "Rem --:--");
            if (!wifi_ok) draw_nowifi();
            if (id(buttons_locked)) draw_lock(wifi_ok ? 121 : 96, 55);
            draw_radio();
            finish();
            return;
          }
          // Line 2: next prayer and its time
          const char *npn = names[id(next_prayer_index)];
          {
            int x1, y1, wn, hn;
            d.get_text_bounds(0, 22, npn, id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &wn, &hn);
            int gap = std::max(1, std::min(5, 128 - wn - time_width(id(next_prayer_hour), id(next_prayer_minute))));
            d.print(0, 22, id(font1), npn);
            int xe = draw_time(wn + gap, 22, id(next_prayer_hour), id(next_prayer_minute));
            // Stand-in mark (times from last year until this year's timetable is published): a small hollow square
            if (id(athan_core).times_standin()) d.rectangle(std::min(xe + 2, 123), 24, 4, 4);
          }
          // Line 3: time remaining
          {
            int total = id(next_prayer_hour) * 60 + id(next_prayer_minute) - (now.hour * 60 + now.minute);
            if (total < 0) total += 1440;
            snprintf(line, sizeof(line), "Rem %02d:%02d", total / 60, total % 60);
            d.print(0, 44, id(font1), line);
          }
          if (!wifi_ok) draw_nowifi();
          if (id(buttons_locked)) draw_lock(wifi_ok ? 121 : 96, 55);
          draw_radio();
          // Muted next prayer: strike through the last two letters of its name
          {
            int npi = id(next_prayer_index);
            if (npi != 1 && npi != 2 && !id(athan_enabled)[npi]) {
              int x1, y1, wf, hf, wh, hh;
              std::string nm(npn), head = nm.substr(0, nm.size() - 2);
              d.get_text_bounds(0, 22, nm.c_str(), id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &wf, &hf);
              d.get_text_bounds(0, 22, head.c_str(), id(font1), display::TextAlign::TOP_LEFT, &x1, &y1, &wh, &hh);
              int sy = 22 + hf / 2 + 2;
              d.line(wh, sy, wf - 1, sy);
            }
          }
          finish();

# ---------------------------------------------------------------------------------------------------------------------
interval:
  # Every second: reload today's times when they change, call the athan, Pre-Fajr Tawashih.
  - interval: 1s
    then:
      - lambda: |-
          if (id(athan_core).schedule_version() != id(schedule_seen)) {
            id(schedule_seen) = id(athan_core).schedule_version();
            id(load_today).execute();
          }
          auto now = id(sntp_time).now();
          // No clock yet: on_time does not fire, so redraw every 5 s (Wi-Fi mark, setup mode, struck-through rows).
          static uint8_t waiting_ticks = 0;
          if (!now.is_valid() && ++waiting_ticks % 5 == 0) id(update_display).execute();
          if (!now.is_valid() || !id(times_loaded)) return;
          int cur = now.hour * 60 + now.minute;
          int next = id(next_prayer_hour) * 60 + id(next_prayer_minute);
          int isha = id(prayer_hours)[6] * 60 + id(prayer_minutes)[6];
          // Reached the next prayer (after Isha the next one is tomorrow's Fajr: wait until midnight passes).
          if (cur >= next && (id(next_prayer_index) == 6 || cur < isha)) {
            int pi = id(next_prayer_index);
            bool main_prayer = (pi != 1 && pi != 2);
            if (main_prayer && id(athan_enabled)[pi]) {
              id(current_athan_prayer_index) = pi;
              id(make_athan).execute();
            }
            ESP_LOGI("prayer", "Prayer time reached: %d", pi);
            id(jump_to_next_prayer).execute();
            id(update_display).execute();
          }
          if (id(prefajr_enabled) && !id(prefajr_triggered) && id(next_prayer_index) == 0 &&
              now.hour == id(prefajr_next_hour) && now.minute == id(prefajr_next_minute)) {
            id(prefajr_triggered) = true;
            id(run_prefajr).execute();
          }
  - interval: 1s
    then:
      - lambda: |-
          // Redraw when the radio starts or stops from anywhere (web buttons, /audio previews, a stream that
          // gave up), so the OLED's radio mark never waits for the minute redraw.
          static int shown = -2;
          const int r = id(athan_core).radio_active();
          if (r != shown) { shown = r; id(update_display).execute(); }
          // Menu: back to the clock after 60 s without a press. While open it is redrawn when what it shows has
          // changed (download progress, a list that loaded, the update check): menu_changed() reads the same hooks
          // as the drawing without touching the display.
          auto &menu = id(athan_core).menu();
          if (menu.is_open()) {
            if (millis() - id(ui_last_activity) >= 60000) {
              menu.close();
              id(update_display).execute();
            } else if (athan::menu_changed(menu)) {
              id(update_display).execute();
            }
          }
      - script.execute: sync_web_state
  # OLED hot-plug watchdog (V2 behaviour): the device NEVER restarts because of the display.
  - interval: 10s
    then:
      - lambda: |-
          static bool lost = false;
          static uint8_t back_ticks = 0, reinits = 0;
          bool ack = (id(oled).write(nullptr, 0) == i2c::ERROR_OK);
          if (id(oled).is_failed()) {
            if (ack) {
              id(oled).reset_to_construction_state();
              id(oled).call();
              if (!id(oled).is_failed()) id(update_display).execute();
            }
            return;
          }
          if (!ack) { lost = true; back_ticks = 0; return; }
          if (!lost || ++back_ticks < 2) return;
          lost = false;
          if (reinits >= 1) { ESP_LOGW("oled", "Display back again: restart the device to use it (athan keeps working)"); return; }
          reinits++;
          id(oled).setup();
          if (!id(oled).is_failed()) id(update_display).execute();
