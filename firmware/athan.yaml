# =====================================================================================================================
# Athan clock, version 3: ESP32-S3-WROOM-1-N16R8 + MAX98357A. ESPHome 2026.9.1 (components/speaker is a copy of its
# speaker component: another ESPHome version needs it copied again, components/speaker/README.md).
#
#   Build:   esphome run firmware/athan.yaml        (first flash over the J6 header, as USB-C is power only; it also
#                                                    writes partitions.csv)
#   Docs:    guides/ (using, building, maintaining), DEVELOPER.md (internals), firmware_rules.md (the rules the
#            code depends on), HARDWARE.md (the board)
#
# Before the first build, put the two menu tones in firmware/sounds/ (guides/building.md section 3):
#   sounds/click.wav   (menu click)      sounds/volume.wav  (volume tone): mono 16-bit 44.1 kHz WAV
#
# Behaviour lives here (menus, schedule, web entities). What ESPHome lacks (replaceable sounds in flash, the
# GitHub lists, radio subscriptions, yearly prayer files, runtime time zone, the /audio page) is the custom
# component in components/athan/.
# =====================================================================================================================

substitutions:
  device_name: athan
  friendly_name: Athan
  project_version: "3.0.0"
  # This repository's docs/ folder over HTTPS (lists, stations, yearly prayer files)
  data_url: "https://raw.githubusercontent.com/et7ad/esp32_athan/main/docs"
  # Firmware updates: manifest attached to the latest GitHub Release (scripts/make_release_manifest.py). Each display
  # has its own: manifest.json (OLED), manifest-tft.json (TFT); variant_suffix comes from the display file.
  update_manifest: "https://github.com/et7ad/esp32_athan/releases/latest/download/manifest${variant_suffix}.json"

  # The display, chosen at build time: only that display's code is built.
  #   oled  the 128x64 one-colour OLED on I2C (SSD1306 0.96" or SH1106 1.3"): displays/oled.yaml
  #   tft   the 240x240 colour TFT on SPI (ST7789 1.54" IPS):                   displays/tft.yaml
  # Change it here, or per build: ./build_firmware.sh --display tft, esphome -s display_type tft ...
  # Each display file also has its own settings (OLED model and orientation, TFT panel options).
  display_type: oled

  # Serial log level. DEBUG while testing: the log is how a crash or restart gets explained. For a finished build,
  # WARN keeps only warnings and errors (smaller, a little less work per event); NONE removes the log entirely.
  # Choices: NONE, ERROR, WARN, INFO, DEBUG, VERBOSE.
  log_level: DEBUG

  # Pins: HARDWARE.md section 3
  pin_i2s_bclk: GPIO5
  pin_i2s_lrclk: GPIO6
  pin_i2s_dout: GPIO7
  pin_amp_sd: GPIO15       # MAX98357A SD_MODE through 4.7 kOhm: high = on (left channel), low/floating = off
  pin_sda: GPIO8           # display: I2C data (OLED) or SPI data (TFT), header pin 4
  pin_scl: GPIO9           # display: I2C clock (OLED) or SPI clock (TFT), header pin 3
  # The 5-way switch: each direction and the centre push switch to GND (internal pull-ups). Any of the five
  # may be swapped here to suit the board's routing.
  pin_up: GPIO14
  pin_down: GPIO10
  pin_left: GPIO21
  pin_right: GPIO47
  pin_select: GPIO11       # centre push
  pin_relay: GPIO12
  pin_led: GPIO13

  # Volume curve: 10 % plays this many dB below full, rising evenly to 100 % = full (0 % = silent).
  # Larger = quieter low end. ESPHome's own curve spans 49 dB, which made 50 % only -24.5 dB.
  volume_range_db: "30"

  # The screen at night (Screen at Night: Dim) and when a key or the athan lights a dark one: this share of full
  # brightness (the TFT's backlight, the OLED's contrast). The owner's Brightness, if lower but not 0, wins.
  screen_dim_pct: "10"
  # A dark screen (Brightness 0 %, or Screen at Night: Turned off) lit by a key stays lit (dim) this many seconds after
  # the last press, counting down in a corner; also after the athan or the Pre-Fajr Tawashih ends. Keep it at least the
  # menu's 60 s, so the menu never goes dark while open.
  screen_wake_s: "120"

  # The fallback hotspot for Wi-Fi setup (guides/using.md section 1). The TFT's setup screen shows both.
  hotspot_ssid: "AthanFallbackHotspot"
  hotspot_password: "athan404"

  # Pre-Fajr Tawashih: minutes before Fajr, and how long the relay stays on
  prefajr_offset_min: "25"
  prefajr_relay_min: "15"

# The display's bus, fonts and screens (see display_type above)
packages:
  display_hw: !include displays/${display_type}.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: et7ad.esp32_athan
    version: ${project_version}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // First boot: Fajr volume starts equal to the main volume.
          if (id(fajr_volume_level) < 0) id(fajr_volume_level) = id(volume_level);
          // A restart while Pre-Fajr had the relay on: its timer is gone, and the restored relay would stay on all day.
          if (id(relay_by_prefajr)) {
            id(relay_by_prefajr) = false;
            id(external_relay).turn_off();
            ESP_LOGI("prefajr", "Relay off: the clock restarted while Pre-Fajr had it on");
          }
          // A window end this firmware does not offer (an earlier one let the tick start at Maghrib or Isha and end at
          // Fajr or Dhuhr) becomes the first hour at or after that prayer: the same ticks (day_window.h).
          {
            using athan::WindowKind;
            const uint8_t *ph = id(prayer_hours), *pm = id(prayer_minutes);
            id(htick_start_hour) = athan::window_sanitize(WindowKind::TICK, false, id(htick_start_hour), ph, pm);
            id(htick_end_hour) = athan::window_sanitize(WindowKind::TICK, true, id(htick_end_hour), ph, pm);
            id(night_from_hour) = athan::window_sanitize(WindowKind::NIGHT, false, id(night_from_hour), ph, pm);
            id(night_until_hour) = athan::window_sanitize(WindowKind::NIGHT, true, id(night_until_hour), ph, pm);
          }
          id(athan_core).set_location(id(selected_location_key));
          // Previews set their own volume before they start: Fajr volume for the Fajr and Tawashih lists.
          id(athan_core).set_preview_volume_callback([](int list) {
            if (list == 1 || list == 2) id(apply_fajr_volume).execute();
            else id(apply_volume).execute();
          });
          // Stopping a preview (browsing to the next one, the /audio page's Stop) silences at once (hard_mute).
          id(athan_core).set_hard_stop_callback([]() { id(hard_mute).execute(); });
          // The /audio page's Stop: what Up, Select or Down stop while a sound plays (ui_key), the radio plays on.
          id(athan_core).set_stop_sound_callback([]() {
            const bool sound_on = id(athan_playing) || id(prefajr_playing) || id(athan_core).slot_playing() ||
                                  id(athan_core).preview_list() >= 0;
            if (sound_on) id(stop_sound).execute();
            return sound_on;
          });
      - script.execute: menu_setup
      # Wi-Fi reset: power up holding Select (the centre push). Overwrites the saved network, so setup mode starts
      # (Bluetooth, then the hotspot).
      - if:
          condition:
            binary_sensor.is_on: ui_select
          then:
            - logger.log: "Select held at power-up: forgetting Wi-Fi"
            - lambda: |-
                wifi::global_wifi_component->clear_sta();
                wifi::global_wifi_component->save_wifi_sta("doesntexist", "passwordfornonetwork");
            - repeat:
                count: 3
                then:
                  - output.turn_on: led_output
                  - delay: 300ms
                  - output.turn_off: led_output
                  - delay: 300ms
            - button.press: web_restart
      # Button unlock: power up holding any of the four directions.
      - if:
          condition:
            lambda: 'return id(buttons_locked) && (id(ui_up).state || id(ui_down).state || id(ui_left).state || id(ui_right).state);'
          then:
            - lambda: |-
                id(buttons_locked) = false;
                ESP_LOGI("ui", "Buttons unlocked (a direction held at power-up)");
            - repeat:
                count: 3
                then:
                  - output.turn_on: led_output
                  - delay: 150ms
                  - output.turn_off: led_output
                  - delay: 150ms
      - script.execute: apply_volume
      - script.execute: update_display

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  partitions: partitions.csv
  framework:
    type: esp-idf
    sdkconfig_options:
      # TLS buffers (about 40 KB per HTTPS stream or download, more while two overlap) in PSRAM instead of the
      # scarce internal RAM, which Wi-Fi, the web server and the audio drivers need.
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      # Wi-Fi at ESP-IDF's own defaults. ESPHome's media player asks for "high performance networking" (64 receive
      # and transmit buffers kept in PSRAM, block-ack windows of 32 frames, 64 KB TCP windows), sized for lossless
      # music. A 128 kbps station needs none of it, and the router dropped the clock only while the radio played
      # (2026-10-07): with the radio, Wi-Fi's buffers then compete with the audio for PSRAM. These are the values
      # most tested with routers, in internal RAM. network: enable_high_performance: false (below) covers the TCP
      # half; ESPHome's Wi-Fi component ignores that switch, so its half is set here. Delete these six lines and that
      # switch to go back.
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "n"
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "10"
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_TX_BA_WIN: "6"
      CONFIG_ESP_WIFI_RX_BA_WIN: "6"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: ${log_level}   # set at the top (substitutions)
  # UART0 = TXD0/RXD0 on the J6 programming header. The board's 6-pin USB-C carries power only, so ESPHome's S3
  # default (native USB) would print nowhere. On a DevKitC prototype these logs come out of its "UART" port.
  hardware_uart: UART0

# Home Assistant native API (optional; the web page works without it)
api:
  reboot_timeout: 0s
  encryption:
    key: "/A5YakHWYfXLiBWI5Z92v0FWiaMsWbCUCWD41zlLPYk="

web_server:
  version: 3
  log: false
  # Makes the "Change Sounds At" value a clickable link (ESPHome shows values as plain text). This page only.
  js_include: web_audio_link.js
  sorting_groups:
    - id: grp_now
      name: "Now"
      sorting_weight: 10
    - id: grp_athan
      name: "Athan"
      sorting_weight: 20
    - id: grp_prayers
      name: "Athan On/Off per Prayer"
      sorting_weight: 30
    - id: grp_sounds
      name: "Sounds (change them at /audio)"
      sorting_weight: 35
    - id: grp_radio
      name: "Radio"
      sorting_weight: 40
    - id: grp_stations
      name: "Radio Stations"
      sorting_weight: 45
    - id: grp_location
      name: "Location and Prayer Times"
      sorting_weight: 50
    - id: grp_screen
      name: "Screen"
      sorting_weight: 55
    - id: grp_system
      name: "System"
      sorting_weight: 60

ota:
  - platform: esphome
    encryption:
      key: "/A5YakHWYfXLiBWI5Z92v0FWiaMsWbCUCWD41zlLPYk="   # same key as the api (ESPHome's recommendation)
  - platform: http_request
    # An install that fails (download, checksum) leaves the update pending; the menu's Update row and Firmware
    # Version say so for that version (fw_failed_version) until the next install starts.
    on_begin:
      - lambda: 'id(fw_failed_version).clear();'
    on_error:
      - lambda: 'id(fw_failed_version) = id(fw_update).update_info.latest_version;'
  # The web page's firmware upload form. Also REQUIRED for the /audio page's file upload: ESPHome only routes
  # multipart uploads to handlers when this platform is present.
  - platform: web_server

http_request:
  verify_ssl: true
  timeout: 20s

update:
  - platform: http_request
    id: fw_update
    name: "Firmware"
    source: ${update_manifest}
    # Checked once after each start (script fw_check_after_start) and once a day at 03:00 (time: on_time), never
    # installed by itself: the owner installs from the web page, the menu's Update row or Home Assistant. ESPHome's
    # own check after a start gives up when Wi-Fi takes more than a minute, as a router restarting after the same
    # power cut does. A found update shows as a mark on the screen (displays/*.yaml).
    update_interval: never
    on_update_available:
      - script.execute: update_display
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 1

# No network is compiled in: Wi-Fi is set over Bluetooth (esp32_improv) or the fallback hotspot.
wifi:
  ap:
    ssid: ${hotspot_ssid}
    password: ${hotspot_password}
    ap_timeout: 3min
  on_connect:
    - logger.log: "Wi-Fi connected"
    - script.stop: ble_when_offline
    - ble.disable:
    - script.execute: update_display
    - if:
        condition:
          lambda: 'return !id(fw_checked_after_start) && !id(fw_check_after_start).is_running();'
        then:
          - script.execute: fw_check_after_start
    # No Wi-Fi modem sleep once Bluetooth is really off: streams start faster and play steadier. ESP-IDF needs
    # modem sleep while Bluetooth runs, so it comes back before ble.enable below.
    - wait_until:
        condition:
          lambda: 'return !esp32_ble::global_ble->is_active();'
        timeout: 15s
    - lambda: 'if (!esp32_ble::global_ble->is_active()) id(athan_core).set_wifi_low_latency(true);'
  # Bluetooth setup only once Wi-Fi has been gone for 15 s (ble_when_offline): routers drop a client now and then
  # and it is back within seconds, and starting Bluetooth for that costs memory and Wi-Fi airtime while it reconnects.
  on_disconnect:
    - script.execute: ble_when_offline

captive_portal:

# ESP-IDF's standard Wi-Fi and TCP settings, not ESPHome's "high performance networking" (see sdkconfig_options
# under esp32: for the Wi-Fi half, which this switch alone does not reach).
network:
  enable_high_performance: false
  # What the clock sends (logs, the web page, Home Assistant) gets 16 KB per connection instead of ESP-IDF's 5.7 KB:
  # with 5.7 KB a burst of log lines at a station start filled it and ESPHome dropped the log connection
  # ("unexpected disconnect from ESPHome API", reconnected in 0.2 s; Wi-Fi itself stayed up). Only the sending
  # side: what the clock receives (the station's start burst) keeps ESP-IDF's small window.
  tcp_send_buffer: 16384

esp32_ble:
  use_psram: true
  max_connections: 1

# Wi-Fi setup over Bluetooth (Improv). Starts when there is no working Wi-Fi; pressing Select on the device
# authorises the phone for a minute.
esp32_improv:
  id: improv_ble
  authorizer: ui_select
  authorized_duration: 1min
  wifi_timeout: 15s
  status_indicator: led_output
  on_state:
    - script.execute: update_display   # "BT: press Select" / "BT: allowed" (update_display guards is_ready())


# ---------------------------------------------------------------------------------------------------------------------
# Audio: media player -> resamplers -> mixer -> I2S -> MAX98357A
# 44.1 kHz: the stations and tones are 44.1 kHz MP3s, so the resamplers pass them through without resampling.
# Left channel only. The mono mixer keeps channel 0 of a stereo source, and channel: mono sends that sample in
# both I2S slots. The amp plays the left slot (SD_MODE through 4.7 kOhm): its (L+R)/2 mode gave artifacts in testing.
# So every sound needs its whole content in the left channel (guides/using.md section 5).
# ---------------------------------------------------------------------------------------------------------------------
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: ${pin_i2s_lrclk}
    i2s_bclk_pin: ${pin_i2s_bclk}

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: ${pin_i2s_dout}
    dac_type: external
    sample_rate: 44100
    bits_per_sample: 16bit
    channel: mono
  # The mixer's and resamplers' task stacks (4 + 3 + 3 KB) in PSRAM, like the media player's: created at every
  # start and freed at every stop, they would otherwise come and go in internal RAM. None of them writes flash.
  - platform: mixer
    id: audio_mixer
    output_speaker: i2s_speaker
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      - id: announce_mixer_input
        timeout: never
      - id: media_mixer_input
        timeout: never
  - platform: resampler
    id: announce_resampler
    output_speaker: announce_mixer_input
    task_stack_in_psram: true
  - platform: resampler
    id: media_resampler
    output_speaker: media_mixer_input
    task_stack_in_psram: true

media_player:
  - platform: speaker
    id: player
    name: "Speaker"
    task_stack_in_psram: true
    # Each pipeline's reader buffer (ESPHome's default is 1 MB). Measured on the prototype, 2026-10-07/08:
    # - A sound from flash starts by filling it in one copy, and ESP-IDF's ring buffer copies with interrupts off:
    #   1 MB starved the I2S speaker, which restarted ("Event/record queues desynced", "Partial DMA write") and lost
    #   count of frames, so the athan screen stayed until make_athan's 7 min timeout (every athan started over a
    #   running speaker).
    # - A station's server sends its first 130-260 KB at full speed, and the reader takes as much of it as fits.
    #   Station switches every 8-15 s, the sizes in rotating 8-minute blocks: the router dropped the clock
    #   ("not authenticated") 4 times in 83 starts at 1 MB, 6 in 88 at 128 KB, 0 in 89 at 48 KB.
    # 48 KB is 3 s of a 128 kbps station (6 s of a 64 kbps one): a live stream cannot run further ahead than its
    # server's burst anyway, and 12 minutes of steady play had no underrun.
    buffer_size: 49152
    volume_min: 0.0
    volume_max: 1.0
    volume_initial: 0.5
    volume_increment: 0.1
    # Athan, tawashih and tick (stored MP3s) and the menu tones (WAV)
    announcement_pipeline:
      speaker: announce_resampler
      format: MP3
      num_channels: 1
      sample_rate: 44100
    # Radio and previews: every codec (MP3, Opus, FLAC, WAV)
    media_pipeline:
      speaker: media_resampler
      format: NONE
      num_channels: 1
      sample_rate: 44100
    # The menu tones: mono 16-bit 44.1 kHz WAV, the speaker's own format. Nothing to decode, resample or downmix,
    # and no MP3 encoder padding (about 25 ms of silence ahead of the sound, as long as the click itself), so a key's
    # click starts at once. ESPHome reads the type from the file and builds in its small WAV reader.
    files:
      - id: tone_click
        file: sounds/click.wav
      - id: tone_volume
        file: sounds/volume.wav
    on_play:
      - output.turn_on: amp_enable
      - script.stop: amp_idle_off
    on_announcement:
      - output.turn_on: amp_enable
      - script.stop: amp_idle_off
    on_idle:
      - script.execute: amp_idle_off

athan:
  id: athan_core
  media_player: player
  # Every start waits for its pipeline's first speaker to stop, then checks the format it was given: a sound
  # started on a chain still set up for the one before plays at the wrong speed and pitch.
  media_speaker: media_resampler
  announcement_speaker: announce_resampler
  time_id: sntp_time
  data_url: ${data_url}
  # Wi-Fi 802.11b/g only, without 802.11n's aggregated bursts and block acknowledgments: the setting that cured ESP
  # devices being dropped by TP-Link routers ("Force WiFi B/G", 2026-10-07 research). 54 Mbps is far more than a
  # 128 kbps station needs. false = ESP-IDF's default 802.11b/g/n.
  wifi_bg_only: true
  # Own links of radio slots 1..10 (the text entities below), used when a slot does not follow the project list
  radio_urls: [radio_url_1, radio_url_2, radio_url_3, radio_url_4, radio_url_5,
               radio_url_6, radio_url_7, radio_url_8, radio_url_9, radio_url_10]
  # The display this build is for (display_type): ATHAN_DISPLAY_OLED or ATHAN_DISPLAY_TFT in the C++ (menu_view.cpp)
  display: ${display_type}

external_components:
  - source:
      type: local
      path: components
    # speaker: ESPHome 2026.9.1's own component with two marked fixes (components/speaker/README.md): a stream's
    # format reaches the speaker again whenever it changes (wrong speed and pitch otherwise), and a link that fails
    # is not reopened in a tight loop. Keep its version equal to build_firmware.sh's ESPHOME_VERSION.
    components: [athan, speaker]

output:
  - platform: gpio
    id: amp_enable
    pin: ${pin_amp_sd}
  - platform: gpio
    id: led_output
    pin: ${pin_led}

# ---------------------------------------------------------------------------------------------------------------------
# The 5-way switch: Up, Down, Left, Right and Select (the centre push). Every press goes to script ui_key, the one
# place that decides what a key does:
#   Clock screen: Left/Right = volume of what plays (never stops it). Up = radio on/off (the slot chosen last).
#     Down = relay on/off. Select = menu. While the athan, the tawashih, the tick or a preview plays, Up, Down and
#     Select stop it (the radio plays on).
#   Menu: Up/Down = rows (they go round; the last row, Exit, returns to the clock with Select, Left or Right),
#     Left/Right = the row's items, Select = take it, or done. The rows are script menu_setup; navigation is
#     components/athan/menu.h, drawing menu_view.h.
#   Buttons locked: every key only silences.
# Debounce on each key: a press is reported at once and contact bounce for 40 ms after it is ignored, so one press
# is one event (bounce read as extra presses multiplied previews and media commands).
# ---------------------------------------------------------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    id: ui_up
    name: "ui_up"
    internal: true
    pin: {number: "${pin_up}", mode: INPUT_PULLUP, inverted: true}
    filters: [settle: 40ms]
    on_press: [script.execute: {id: ui_key, button: 0}]   # athan::MenuKey::UP
  - platform: gpio
    id: ui_down
    name: "ui_down"
    internal: true
    pin: {number: "${pin_down}", mode: INPUT_PULLUP, inverted: true}
    filters: [settle: 40ms]
    on_press: [script.execute: {id: ui_key, button: 1}]   # DOWN
  - platform: gpio
    id: ui_left
    name: "ui_left"
    internal: true
    pin: {number: "${pin_left}", mode: INPUT_PULLUP, inverted: true}
    filters: [settle: 40ms]
    on_press: [script.execute: {id: ui_key, button: 2}]   # LEFT
  - platform: gpio
    id: ui_right
    name: "ui_right"
    internal: true
    pin: {number: "${pin_right}", mode: INPUT_PULLUP, inverted: true}
    filters: [settle: 40ms]
    on_press: [script.execute: {id: ui_key, button: 3}]   # RIGHT
  # Also the Bluetooth setup's authorizer (esp32_improv) and, held at power-up, the Wi-Fi reset.
  - platform: gpio
    id: ui_select
    name: "ui_select"
    internal: true
    pin: {number: "${pin_select}", mode: INPUT_PULLUP, inverted: true}
    filters: [settle: 40ms]
    on_press: [script.execute: {id: ui_key, button: 4}]   # SELECT

  - platform: template
    name: "Athan Playing"
    id: web_athan_playing
    icon: "mdi:volume-high"
    lambda: return id(athan_playing);
    web_server:
      sorting_group_id: grp_now
      sorting_weight: 2

# ---------------------------------------------------------------------------------------------------------------------
# Switches. Template switches that mirror a global MUST use restore_mode: DISABLED (any other mode runs their
# actions inside setup(), before the display exists: the V6 boot loop). The lambda reports the state.
# ---------------------------------------------------------------------------------------------------------------------
switch:
  - platform: gpio
    id: external_relay
    name: "External Relay"
    pin: ${pin_relay}
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 5
  - platform: template
    name: "Fajr Athan"
    id: web_athan_fajr
    icon: "mdi:bell-ring"
    restore_mode: DISABLED
    lambda: return id(athan_enabled)[0];
    turn_on_action: [lambda: 'id(athan_enabled)[0] = true; id(update_display).execute();']
    turn_off_action: [lambda: 'id(athan_enabled)[0] = false; id(update_display).execute();']
    web_server: {sorting_group_id: grp_prayers, sorting_weight: 1}
  - platform: template
    name: "Dhuhr Athan"
    id: web_athan_dhuhr
    icon: "mdi:bell-ring"
    restore_mode: DISABLED
    lambda: return id(athan_enabled)[3];
    turn_on_action: [lambda: 'id(athan_enabled)[3] = true; id(update_display).execute();']
