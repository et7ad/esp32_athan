    name: "Volume"
    id: web_volume
    icon: "mdi:volume-medium"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 10
    mode: slider
    set_action:
      - lambda: |-
          int v = ((int) (x + 0.5f) + 5) / 10 * 10;
          id(volume_level) = std::max(0, std::min(100, v));
          id(apply_playing_volume).execute();   // a Fajr athan playing keeps the Fajr volume
          id(web_volume).publish_state(id(volume_level));
          id(play_tone_volume).execute();
    web_server: {sorting_group_id: grp_athan, sorting_weight: 4}
  - platform: template
    name: "Fajr Volume"
