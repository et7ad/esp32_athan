select:
  - platform: template
    name: "Location"
    id: web_location_select
    icon: "mdi:map-marker"
    # Mosque keys: folder names under docs/athantimes/ (and entries of docs/athantimes/mosques.json).
    # The device stores the KEY, not the position, so this list may be reordered or extended freely.
    options: ["davis", "sclaramca", "sclaraalnoor", "woodland", "masjid15"]
    set_action:
      - lambda: |-
          std::string key(x.c_str(), x.size());
          id(selected_location_key) = key;
          id(athan_core).set_location(key);
          id(web_location_select).publish_state(key);
    web_server:
      sorting_group_id: grp_location
      sorting_weight: 1
  - platform: template
    name: "Radio Station"
    id: web_radio_slot
    icon: "mdi:radio"
    options: ["Radio 1", "Radio 2", "Radio 3", "Radio 4", "Radio 5", "Radio 6", "Radio 7", "Radio 8", "Radio 9", "Radio 10"]
    set_action:
      - lambda: |-
          auto idx = id(web_radio_slot).index_of(x.c_str(), x.size());   // the label's position = the slot
          if (!idx.has_value()) {
            // A page opened before the names loaded still sends the old label: "Radio N…" names the slot too.
            int n = 0;
            if (sscanf(std::string(x.c_str(), x.size()).c_str(), "Radio %d", &n) == 1 && n >= 1 && n <= 10)
              idx = (size_t) (n - 1);
          }
          if (!idx.has_value()) return;
          id(radio_slot) = (int) idx.value();
          id(web_radio_slot).publish_state(idx.value());
          if (id(athan_core).radio_active() >= 0) id(radio_start).execute();   // switch station if playing
    web_server:
      sorting_group_id: grp_radio
      sorting_weight: 1

number:
