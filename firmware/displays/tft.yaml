script:
  # The screen's level from screen_refresh (athan.yaml): 10-100 % = the backlight, 0 = the backlight off.
  - id: apply_screen
    parameters:
      pct: int
    then:
      - lambda: |-
          if (pct <= 0) {
            auto call = id(tft_backlight).turn_off();
            call.perform();
            return;
          }
          auto call = id(tft_backlight).turn_on();
          call.set_brightness(pct / 100.0f);
          call.perform();

  # The TFT's own menu row, added in its place by menu_setup (after Night Until): Screen Colour, the accent and
  # athan colours (tft_theme.h PALETTES). Select takes the one shown.
  - id: menu_display_rows
    then:
      - lambda: |-
          athan::MenuRow r;
          r.title = "Screen Colour";
          r.short_title = "Colour";
          r.symbol = athan::sym::PALETTE;
          r.style = athan::RowStyle::SWATCHES;
          r.count = []() { return athan::tft::NUM_PALETTES; };
          r.label = [](int i) { return std::string(athan::tft::palette(i).name); };
          r.swatch = [](int i) { return athan::tft::palette(i).accent; };
          r.active = []() { return std::max(0, std::min(athan::tft::NUM_PALETTES - 1, id(screen_colour))); };
          r.apply = [](int i) {
            id(screen_colour) = i;
            return false;
          };
          id(athan_core).menu().add_row(std::move(r));

  # The flashing ring's dark half: ${tft_flash_ms} ms after the new second's frame drew it lit (only in the last minute
  # before an athan, and not while the menu covers the clock or the screen is dark).
  - id: ring_flash_off
    mode: restart
    then:
      - delay: ${tft_flash_ms}ms
      - lambda: |-
          if (!id(ring_flashing) || id(athan_core).menu().is_open() || id(screen_pct_applied) == 0) return;
          id(ring_flash_on) = false;
          id(update_display).execute();

  # Redraws the TFT (each display file has its own update_display; athan.yaml only asks for it). mode: restart and
  # the delay of 0 fold every request made during one pass of the loop into one draw, as on the OLED.
  - id: update_display
    mode: restart
    then:
      - delay: 0ms
      - lambda: |-
          if (id(tft).is_ready()) id(tft).update();
